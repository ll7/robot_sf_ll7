schema_version: experiment-record.v1
experiment_id: issue_6951_progress_shaped_ablation
issue: 6951
issue_url: https://github.com/ll7/robot_sf_ll7/issues/6951
parent_experiment: 1475
parent_status: parked
question: >
  Can a progress-shaped expert-action NLL objective produce a bounded,
  configurable ablation between uniform (Arm A) and progress-weighted
  (Arm B) behavioral cloning on ORCA-residual trajectories?
hypothesis: >
  Arm A (uniform weights) reproduces ordinary mean expert-action NLL.
  Arm B (signed progress from remaining-route-length reduction,
  normalized and clipped to strictly positive bounds) weights
  transition samples proportional to their contribution to route
  progress while preserving stalled/regressing samples.
config:
  - configs/training/orca_residual/issue_6951_arm_a_progress_weighted_bc.yaml
  - configs/training/orca_residual/issue_6951_arm_b_progress_weighted_bc.yaml
command: |
  # Bounded compute authorization was granted on 2026-08-13.
  # Collection used the issue-1428 smoke command shape with seeds 111/112/113;
  # six in-memory configs pinned the resulting dataset digest and ran Arm A/B.
  # Evaluation used deterministic rollouts for every train-seed/eval-seed pair
  # on planner_sanity_simple. See the tracked diagnostic summary:
  # docs/context/evidence/issue_6951_progress_shaped_ablation/README.md
inputs:
  - path: configs/training/orca_residual/issue_6951_arm_a_progress_weighted_bc.yaml
  - path: configs/training/orca_residual/issue_6951_arm_b_progress_weighted_bc.yaml
  - path: robot_sf/training/progress_weighted_bc.py
outputs:
  - path: docs/context/evidence/issue_6951_progress_shaped_ablation/README.md
    durable_reference: tracked-compact-evidence
    evidence_role: diagnostic-only synthesis
  - path: docs/context/evidence/issue_6951_progress_shaped_ablation/summary.json
    durable_reference: tracked-compact-evidence
    evidence_role: machine-readable diagnostic synthesis
  - path: output/issue_6951_compute/evaluation_results.json
    durable_reference: null
    evidence_role: worktree-local raw diagnostic table
expected_artifacts:
  - name: arm_a_policy_checkpoint
    path: output/benchmarks/expert_policies/issue_6951_arm_a_progress_weighted_bc_policy_seed_111.zip
    durable_reference_required: false
    note: worktree-local diagnostic checkpoint; not durable evidence
  - name: arm_b_policy_checkpoint
    path: output/benchmarks/expert_policies/issue_6951_arm_b_progress_weighted_bc_policy_seed_111.zip
    durable_reference_required: false
    note: worktree-local diagnostic checkpoint; not durable evidence
  - name: arm_a_manifest
    path: output/benchmarks/ppo_imitation/runs/issue_6951_arm_a_progress_weighted_bc_seed_111.json
    durable_reference_required: false
  - name: arm_b_manifest
    path: output/benchmarks/ppo_imitation/runs/issue_6951_arm_b_progress_weighted_bc_seed_111.json
    durable_reference_required: false
execution_boundary:
  submit_slurm_from_this_issue: false
  no_launch_experiment: false
  bounded_local_compute_authorized: true
  preregistered_seeds: [111, 112, 113]
  preregistered_scenario: planner_sanity_simple
evidence_grade: observed
paper_relevance: exploratory
status: completed
notes: >
  The authorized smoke diagnostic ran natively on CPU with three expert episodes
  and deterministic evaluation across the three train seeds and three evaluation
  seeds. Both arms had 0/9 successes and 9/9 collision terminations. Arm B's
  mean route-length reduction was 0.235 m higher than Arm A, but this does not
  satisfy the promotion condition. The tracked result is diagnostic-only; raw
  output remains worktree-local, issue #1475 stays parked, and no released
  default or paper-facing claim changes.
