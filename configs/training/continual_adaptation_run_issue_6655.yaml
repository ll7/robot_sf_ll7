# Continual-adaptation and revalidation protocol manifest -- reviewed SB3 PPO backend.
#
# Generated by robot_sf.research.continual_adaptation_manifest (issue #6656 wiring; residual child
# of #6655; root #6582). It wires BEHIND the merged validator
# robot_sf.research.continual_adaptation_protocol and the continual_adaptation_run.v1 schema; it
# does not modify either. Regenerate deterministically with:
#   uv run python -c "from robot_sf.research.continual_adaptation_manifest import write_ppo_continual_adaptation_manifest; write_ppo_continual_adaptation_manifest('configs/training/continual_adaptation_run_issue_6655.yaml')"
#
# It is checked by:
#   uv run python -c "from robot_sf.research.continual_adaptation_protocol import load_continual_adaptation_run, check_continual_adaptation_run; print(check_continual_adaptation_run(load_continual_adaptation_run('configs/training/continual_adaptation_run_issue_6655.yaml')).to_dict())"
#
# This manifest neither launches training, alters a checkpoint, mutates the safety wrapper, runs an
# evaluation, nor promotes a policy, and it is NOT benchmark or paper evidence. Baseline and
# safety-wrapper digests are clearly-labeled placeholders; a real adaptation run replaces both with
# the checksums of the frozen artifacts. The adapted-policy identifier is DERIVED by the validator
# from the baseline identity plus a normalized adaptation manifest; it is never pre-declared here.
schema_version: continual_adaptation_run.v1
run_id: continual_adaptation_run_issue_6655
issue: 6655
claim_boundary: Metadata-only continual-adaptation protocol contract for the reviewed
  SB3 PPO backend (scripts/training/train_ppo.py; baseline ppo_ammv_baseline_v3; safety
  wrapper robot_sf.gym_env.safety_vel_controller). Declares the immutable baseline
  identity and checksum, the immutable safety-wrapper checksum with mutation_permitted=false,
  the literal mutable parameter prefixes, the bounded finite experience budget, the
  disjoint adaptation/evaluation scenario IDs, the synthetic shift(s), and the finite
  nominal/shift/forgetting thresholds. It does not launch training, alter a checkpoint,
  mutate the safety wrapper, run an evaluation, or promote a policy; the initial promotion_decision
  is 'experimental'. This manifest is not benchmark or paper evidence.
baseline_policy:
  identifier: ppo_ammv_baseline_v3
  checksum:
    algorithm: sha256
    digest: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
safety_wrapper:
  identifier: robot_sf.gym_env.safety_vel_controller
  checksum:
    algorithm: sha256
    digest: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
  mutation_permitted: false
adaptation:
  allowed_parameters:
  - action_net.
  - value_net.
  experience_budget:
    bounded: true
    steps: 200000
    units: env_steps
scenarios:
  adaptation:
  - ammv_friction_low_adapt_a
  - ammv_friction_low_adapt_b
  evaluation:
  - ammv_friction_low_eval_holdout_a
  - ammv_friction_low_eval_holdout_b
shifts:
- id: friction_low
  kind: friction
  description: Lowered floor friction coefficient relative to the baseline calibration
    surface.
  parameters:
    friction_coefficient: 0.4
thresholds:
  nominal:
    metric: success_rate_delta
    bound: -0.02
    direction: at_most
  shift:
    metric: success_rate_delta
    bound: 0.05
    direction: at_least
  forgetting:
    metric: success_rate_delta
    bound: -0.02
    direction: at_most
promotion_decision:
  decision: experimental
  rationale: 'Metadata-only contract for the reviewed PPO backend (issue #6656 wiring;
    residual child of #6655; root #6582). Baseline and safety-wrapper digests are
    clearly-labeled placeholders; revalidation results and a new evidence bundle are
    not declared, so promotion is not requested. This manifest is not benchmark or
    paper evidence.'
