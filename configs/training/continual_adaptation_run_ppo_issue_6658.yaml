# Continual-adaptation protocol manifest for the reviewed PPO backend -- Issue #6658
#
# Child 1 of #6648 (parent #6582; contract landed via merged PR #6627). This file wires the reviewed
# PPO backend (scripts/training/train_ppo.py --config) behind the merged continual-adaptation
# protocol contract. It is the metadata-only PROTOCOL CONTRACT for the local, buildable half: it
# declares what a bounded adaptation of the PPO expert policy would have to look like before it can
# be trusted to preserve safety evidence.
#
# It is checked by:
#   uv run python -c "from robot_sf.research.continual_adaptation_protocol import load_continual_adaptation_run, check_continual_adaptation_run; print(check_continual_adaptation_run(load_continual_adaptation_run('configs/training/continual_adaptation_run_ppo_issue_6658.yaml')).to_dict())"
#
# The same manifest can be built programmatically (and written back to disk) with:
#   uv run python -c "from robot_sf.research.ppo_continual_adaptation_manifest import build_ppo_continual_adaptation_manifest; print(build_ppo_continual_adaptation_manifest()['baseline_policy']['identifier'])"
#
# This manifest neither launches training, alters a checkpoint, mutates the safety wrapper, runs an
# evaluation, nor promotes a policy, and it is NOT benchmark or paper evidence. The adapted-policy
# identifier is DERIVED by the validator from the baseline identity plus a normalized adaptation
# manifest; it is never pre-declared here.

schema_version: continual_adaptation_run.v1
run_id: continual_adaptation_run_ppo_issue_6658
issue: 6658

claim_boundary: >-
  Metadata-only continual-adaptation protocol contract for the reviewed PPO backend
  (scripts/training/train_ppo.py --config). Declares the immutable baseline identity, the immutable
  safety-wrapper checksum, the bounded adaptation experience budget, the declared mutable parameter
  prefixes, the disjoint adaptation/evaluation scenario IDs, the synthetic shift(s), and the
  nominal/shift/forgetting thresholds. It does not launch training, alter a checkpoint, mutate the
  safety wrapper, run an evaluation, or promote a policy, and it is not benchmark or paper evidence.

# Immutable baseline checkpoint identity. The validator derives a NEW adapted-policy identifier from
# this plus the normalized adaptation manifest and must never overwrite it.
baseline_policy:
  identifier: ppo_ammv_baseline_v3
  checksum:
    algorithm: sha256
    # Placeholder digest for the contract example only; a real run pins the baseline checkpoint hash.
    digest: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

# Immutable safety wrapper. The planner-agnostic safety wrapper (robot_sf.robot.safety_wrapper, issue
# #3501) post-processes the PPO policy's commanded action; the adaptation job must not modify it, and
# only this checksum may reference it. mutation_permitted must be false.
safety_wrapper:
  identifier: robot_sf.robot.safety_wrapper
  checksum:
    algorithm: sha256
    # Placeholder digest for the contract example only; a real run pins the safety-wrapper hash.
    digest: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
  mutation_permitted: false

# Declared mutable parameter prefixes and the bounded experience budget. The PPO policy and value
# heads may adapt; everything else is frozen, and no prefix may overlap the safety-wrapper namespace.
adaptation:
  allowed_parameters:
    - policy_net.head.
    - value_net.head.
  experience_budget:
    bounded: true
    steps: 200000
    units: gradient_steps

# Disjoint calibration/adaptation and held-out evaluation scenario IDs.
scenarios:
  adaptation:
    - ppo_friction_low_train_a
    - ppo_friction_low_train_b
  evaluation:
    - ppo_friction_low_eval_holdout_a
    - ppo_friction_low_eval_holdout_b

# At least one declared synthetic shift is required for revalidation.
shifts:
  - id: friction_low
    kind: friction
    description: >-
      Lowered floor friction coefficient relative to the baseline calibration surface.
    parameters:
      friction_coefficient: 0.4

# Pre-declared nominal/shift/forgetting acceptance thresholds.
thresholds:
  nominal:
    metric: success_rate_delta
    bound: -0.02
    direction: at_most
  shift:
    metric: success_rate_delta
    bound: 0.05
    direction: at_least
  forgetting:
    metric: success_rate_delta
    bound: -0.02
    direction: at_most

# Initial decision is 'experimental': this manifest is a contract example, not benchmark or paper
# evidence. 'promote' is rejected by the validator unless results.nominal_result, results.shift_result,
# results.forgetting_result, and results.evidence_bundle are all declared.
promotion_decision:
  decision: experimental
  rationale: >-
    Metadata-only PPO backend contract example. Revalidation results and a new evidence bundle are
    not declared, so promotion is not requested; this manifest is not benchmark or paper evidence.
