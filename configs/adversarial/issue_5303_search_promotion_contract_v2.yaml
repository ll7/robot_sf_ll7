# ---------------------------------------------------------------------------
# Machine-readable #6145 terminal result schema. Downstream #6146 activation is
# valid only when decision == promote, admitted_candidate_count >= 5, every
# referenced hash verifies, and every admitted candidate passes the frozen
# eligibility and lineage gates. Issue closure alone never activates anything.
# ---------------------------------------------------------------------------
result_handoff:
  schema_version: issue_5303_search_promotion_result.v2
  required_fields:
    - schema_version
    - decision
    - contract_sha256
    - execution_commit
    - admitted_candidate_count
    - candidate_manifest_sha256
    - evidence_packet_sha256
  decision_values: [promote, stop, inconclusive]
  contract_sha256_binds_this_contract: true
  downstream_activation:
    downstream_issue: 6146
    requires_decision_promote: true
    min_admitted_candidate_count: 5
    all_referenced_hashes_must_verify: true
    admitted_candidates_pass_frozen_eligibility_and_lineage_gates: true
    activation_on_issue_closure_alone: false

forbidden_in_this_step:
  - planner_execution
  - adversarial_search_campaign
  - replay_or_confirmation_run
  - slurm_or_sbatch_or_srun_submission
  - evaluation_outcome_import_or_read

# ---------------------------------------------------------------------------
# Step-3 execution binding for campaign issue #6145 (NOT authorized by this
# preregistration). The command is frozen so that no substantive field remains
# discretionary after execution starts; the execution stage must separately
# hash-pin the analysis surface implementing the frozen decision function and
# re-run the powered preflight before the first scheduled attempt.
# ---------------------------------------------------------------------------
step3_execution:
  campaign_issue: 6145
  runner_ref: scripts/tools/compare_adversarial_samplers.py
  execution_kind: evidence_grade_promotion_campaign_pending_separate_authorization
  promotion_capability: promote_stop_or_inconclusive_per_frozen_decision_rule
  required_execution_mode: adapter
  execution_stage_requirements:
    - >-
      the runner's issue #5303 preflight hook must invoke this v2 preflight before any scheduled
      attempt; the historical v1 hook only authorizes the stopped v1 diagnostic
    - >-
      the analysis surface implementing the frozen decision function must hash-pin this contract
      and the issue_5303_search_promotion_result.v2 schema in its own execution preflight before
      any outcome is produced
    - >-
      execution happens only under campaign issue 6145 with separately reviewed authorization and
      a recorded execution_commit
    - >-
      no scheduled search seed or attempt may be added, replaced, retried, or stopped after the
      first outcome of either arm
  execution_command: >
    uv run python scripts/tools/compare_adversarial_samplers.py
    --contract configs/adversarial/issue_5303_search_promotion_contract_v2.yaml
    --policy hybrid_rule_local_planner
    --algo-config configs/policy_search/candidates/scenario_adaptive_hybrid_orca_v2_collision_guard.yaml
    --reference-algo-config configs/policy_search/candidates/scenario_adaptive_orca_v1.yaml
    --scenario-template configs/adversarial/issue_5303_classic_group_crossing_medium_v2.yaml
    --scenario-family classic_group_crossing_medium
    --search-space configs/adversarial/issue_5303_search_promotion_space_v2.yaml
    --sampler random --sampler optuna
    --budget 64
    --seed 530301 --seed 530302 --seed 530303 --seed 530304 --seed 530305 --seed 530306
    --objective constraints_first_lexicographic_v1
    --horizon 100 --dt 0.1
    --require-certification
    --benchmark-profile experimental
    --execution-context-label powered_promotion_context_a
    --warm-start-archive docs/context/evidence/issue_5305_certified_archive/archive.json
    --warm-start-record issue5305_classic_cross_trap_medium_fbbd96687d61
    --warm-start-record issue5305_classic_cross_trap_medium_fe24f0ff86a1
    --output-dir output/adversarial/issue_5303_search_promotion_v2
    --out-json output/adversarial/issue_5303_search_promotion_v2/report.json
    --out-md output/adversarial/issue_5303_search_promotion_v2/comparison_table.md
    --outcomes-jsonl output/adversarial/issue_5303_search_promotion_v2/outcomes.jsonl
  expected_artifacts:
    output_dir: output/adversarial/issue_5303_search_promotion_v2
    report_json: output/adversarial/issue_5303_search_promotion_v2/report.json
    comparison_table_md: output/adversarial/issue_5303_search_promotion_v2/comparison_table.md
    outcomes_jsonl: output/adversarial/issue_5303_search_promotion_v2/outcomes.jsonl
