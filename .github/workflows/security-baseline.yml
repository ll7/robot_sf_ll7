name: Security Baseline

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "SECURITY.md"
      - "docs/security_triage.md"
      - ".github/workflows/security-baseline.yml"
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-security-advisory:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python
        with:
          # Ruff does not execute the headless runtime, so avoid an unrelated apt
          # dependency and keep this advisory scan independent of runner repositories.
          install-system-packages: "false"

      - name: Run Ruff security rules advisory baseline
        id: ruff_security
        continue-on-error: true
        env:
          SECURITY_LOG: output/security/ruff-security.log
        run: |
          mkdir -p output/security
          {
            uvx --from ruff==0.17.1 ruff check --config 'lint.ignore=[]' --select S .
          } 2>&1 | tee "$SECURITY_LOG"

      - name: Summarize Ruff security baseline
        if: always()
        env:
          SECURITY_LOG: output/security/ruff-security.log
          SECURITY_OUTCOME: ${{ steps.ruff_security.outcome }}
        run: |
          if [ -f "$SECURITY_LOG" ]; then
            printf 'Security advisory exit: %s\n' "$SECURITY_OUTCOME"
            printf 'Finding lines: '
            grep -c '^error\[S' "$SECURITY_LOG" || true
          fi

      - name: Upload Ruff security baseline log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruff-security-baseline
          path: output/security/ruff-security.log
          if-no-files-found: warn
