name: Apply issue 8134 lint correction

on:
  push:
    branches:
      - fix/8134-claimable-queue-fail-closed

permissions:
  contents: write

jobs:
  apply-lint-correction:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Apply exact lint and wording corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)


          source_path = Path("scripts/dev/snapshot_issue_batch.py")
          source = source_path.read_text(encoding="utf-8")
          source = replace_once(
              source,
              '        and issue["admission"].get("claim_outcome")\n'
              '        in {"unclaimed", "already_claimed"}\n',
              '        and issue["admission"].get("claim_outcome") in {"unclaimed", "already_claimed"}\n',
              "ruff format claim outcome",
          )
          source = replace_once(
              source,
              """    truncated, resumable, or started after page one; and
              ``unavailable`` means discovery itself failed or was quota-blocked. A
              """,
              """    truncated, resumable, or started after page one; and
              ``unavailable`` means discovery failed, was quota-blocked, or candidate
              evaluation was unavailable. A
              """,
              "queue-completeness wording",
          )
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/dev/test_snapshot_claimable_queue_fail_closed.py")
          test = test_path.read_text(encoding="utf-8")
          test = replace_once(
              test,
              """import json
              from pathlib import Path
              from unittest.mock import patch
              """,
              """import json
              from typing import TYPE_CHECKING
              from unittest.mock import patch

              if TYPE_CHECKING:
                  from pathlib import Path
              """,
              "typing-only Path import",
          )
          test_path.write_text(test, encoding="utf-8")
          PY

          python -m py_compile \
            scripts/dev/snapshot_issue_batch.py \
            tests/dev/test_snapshot_claimable_queue_fail_closed.py
          python -m pip install --disable-pip-version-check --quiet ruff==0.16.4
          ruff check \
            scripts/dev/snapshot_issue_batch.py \
            tests/dev/test_snapshot_claimable_queue_fail_closed.py
          ruff format --check \
            scripts/dev/snapshot_issue_batch.py \
            tests/dev/test_snapshot_claimable_queue_fail_closed.py

      - name: Commit bounded correction
        shell: bash
        run: |
          rm .github/workflows/apply-8134-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(workflow): satisfy queue fail-closed lint (#8134)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
