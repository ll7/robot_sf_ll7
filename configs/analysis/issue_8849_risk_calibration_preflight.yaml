schema_version: risk_calibration_preflight_config.v1

target:
  target_distribution_id: issue_5445_native_simulator_distribution_v1
  collision_predicate_id: issue_5445_disc_contact_v1
  required_execution_mode: native
  scenario_matrix: configs/scenarios/classic_interactions.yaml
  horizon_steps: 20
  dt_s: 0.1
  minimum_eligible_samples: 200

packet:
  estimators:
    - id: deterministic_ttc
      role: ranking_baseline
    - id: constant_velocity_mc
      role: probabilistic_baseline
    - id: multimodal_forecast_mc
      role: forecast_model_comparison
    - id: learned_risk
      role: learned_estimator_if_available
  calibration_split: fixed_calibration_only_no_discovery_reuse
  weighting: target_or_proposal_weights_required_for_enriched_traces
  primary_metrics: [brier_score, log_loss, reliability_ece, average_precision, false_negative_rate, time_to_warning, horizon_monotonicity, action_sensitivity]
  runtime_cap_ms: 100
  compute_estimate: {mode: cpu_only, max_cpu_hours: 2, max_storage_mb: 256, basis: minimum_eligible_samples_and_bootstrap}
  stop_rule: stop_if_prerequisites_or_matched_inputs_are_missing_or_baseline_is_not_beaten

sources:
  - id: group_crossing_exemplars
    kind: trace_series
    glob: docs/context/evidence/issue_4848_group_crossing_exemplars_2026-07/**/trace_series.json
    expected_schema: issue-4848-trace-series.v1
  - id: head_on_corridor_exemplars
    kind: trace_series
    glob: docs/context/evidence/issue_4891_head_on_corridor_exemplars_2026-07/**/trace_series.json
    expected_schema: issue-4891-trace-series.v1
  - id: doorway_trace_episode
    kind: trace_series
    glob: docs/context/evidence/issue_4253_trace_episode_2026-07/trace_series.json
    expected_schema: issue-4268-trace-series.v1
  - id: oracle_imitation_episode_summaries
    kind: episode_jsonl
    glob: docs/context/evidence/issue_1470_oracle_imitation_traces_12911_2026-06-17/oracle_imitation/issue1470_train_candidate_traces/*_combined.jsonl
    expected_schema: v1
