# Issue 576 (BR-06): PPO expert retraining v3 reward with randomized seeds.
# Uses route_completion_v3 to penalize collision/timeout/stagnation more explicitly.
base_config: expert_ppo_issue_576_br06_base.yaml
policy_id: ppo_expert_br06_v3_15m_all_maps_randomized
num_envs: auto
worker_mode: auto
seeds:
  - 123
  - 231
  - 777
  - 992
  - 1337
randomize_seeds: true
total_timesteps: 15000000
env_factory_kwargs:
  reward_name: route_completion_v3
  peds_have_obstacle_forces: true
convergence:
  plateau_window: 2000
evaluation:
  evaluation_episodes: 100
  hold_out_scenarios: []
  step_schedule:
    - until_step: 3000000
      every_steps: 500000
    - every_steps: 1000000
tracking:
  wandb:
    enabled: true
    project: robot_sf
    group: issue-576-br06-v3-randomized
    job_type: expert-ppo-retrain-v3
    tags:
      - issue-576
      - br-06
      - ppo
      - retrain-v3
      - route-completion-v3
      - randomize-seeds
