name: Docs Link Integrity

# Full-repo internal-link integrity check for all .md files under docs/.
# Extends the changed-path-scoped docs-evidence-integrity check with a
# full-repo scan that catches regressions in untouched files (issue #6480).
# Uses the same Python checker script with --full mode.

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/dev/check_docs_evidence_integrity.py"
      - ".github/workflows/docs-link-integrity.yml"

concurrency:
  group: docs-link-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-link-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Docs link integrity (full-repo scan)
        run: |
          python scripts/dev/check_docs_evidence_integrity.py --full
