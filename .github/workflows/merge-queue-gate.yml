name: Merge Queue Gate

# Required status check for the GitHub native merge queue (issue #6274).
#
# After a maintainer activates this required check, the native merge queue must
# not auto-merge a PR until this gate passes. It enforces the same fail-closed
# preflight as the in-repository `gh-pr-merger` skill:
# non-draft state, current `merge-ready` label, a current exact-head
# `gate-verdict: accepted @ <head_sha>` trailer, no unresolved actionable
# review threads, and no outstanding explicitly requested reviewers. It also
# requires the merge queue's "Only merge non-failing
# pull requests" (`ALLGREEN`) strategy so a passing tail entry cannot carry an
# earlier ungated entry through a grouped merge. The audit record (evaluated
# head/base SHAs, queue strategy, label set, gate-verdict status, staleness
# verdict, CI conclusion, thread resolution, and requested-reviewer status) is
# emitted to the job summary and stdout.
#
# To activate fail-closed behavior, add this job's status check
# ("Merge Queue Gate / merge-queue-gate") to the merge queue's required status
# checks and enable "Only merge non-failing pull requests" in the branch
# protection rules for `main`. Both the source-PR and `merge_group` runs
# enforce the same fail-closed contract. The workflow does not locate or
# control direct merge dispatchers that can bypass GitHub branch protection.
# See docs/dev_guide.md ("Merge queue gate") for the exact configuration and
# residual issue #6274 acceptance proof.

on:
  pull_request:
    # Each state change that can affect source-head admission must create a
    # fresh required check. Otherwise an earlier pass could remain usable after
    # a reviewer is requested or an actionable review is added.
    types:
      - opened
      - labeled
      - unlabeled
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - review_requested
      - review_request_removed
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open PR number to evaluate (advisory; does not gate a merge)"
        required: true
        type: string

permissions:
  checks: read
  contents: read
  issues: read
  pull-requests: read
  statuses: read

concurrency:
  group: merge-queue-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-queue-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select trusted gate revision
        id: trusted-gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            merge_group)
              trusted_ref="$MERGE_GROUP_BASE_SHA"
              ;;
            pull_request|pull_request_review|pull_request_review_comment)
              trusted_ref="$PULL_REQUEST_BASE_SHA"
              ;;
            workflow_dispatch)
              trusted_ref="$DEFAULT_BRANCH"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [[ -z "$trusted_ref" ]]; then
            echo "Trusted gate revision is empty for event $EVENT_NAME" >&2
            exit 1
          fi
          printf 'ref=%s\n' "$trusted_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never execute gate code from the PR or synthetic merge-group tree:
          # the evaluated change must not be able to weaken its own gate.
          ref: ${{ steps.trusted-gate.outputs.ref }}
          persist-credentials: false

      - name: Verify trusted gate source
        id: gate-source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ -f scripts/dev/merge_queue_gate.py ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "::error::Trusted base does not contain scripts/dev/merge_queue_gate.py; refusing the merge-group gate."
            exit 1
          fi
          echo "::notice::Trusted base does not contain scripts/dev/merge_queue_gate.py; source-head evaluation is advisory and was skipped."

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run merge-queue gate (merge_group)
        if: github.event_name == 'merge_group' && steps.gate-source.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/dev/merge_queue_gate.py \
            --from-event "$GITHUB_EVENT_PATH" \
            --repo "${{ github.repository }}" \
            --json

      - name: Run merge-queue gate (source PR head)
        if: >-
          (github.event_name == 'pull_request' || github.event_name == 'pull_request_review' ||
          github.event_name == 'pull_request_review_comment') &&
          steps.gate-source.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python scripts/dev/merge_queue_gate.py \
            --pr "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json

      - name: Run merge-queue gate (advisory, workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && steps.gate-source.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          python scripts/dev/merge_queue_gate.py \
            --pr "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json
