# Shared base for the issue-791 attention head promotion short-budget variants.
# Each variant overrides policy_id, total_timesteps, evaluation step_schedule,
# tracking.wandb.job_type, and tracking.wandb.tags.
# Inherits common invariant settings from expert_ppo_issue_791_promotion_shared_base.yaml.
# Launch a variant file, not this base config.
base_config: expert_ppo_issue_791_promotion_shared_base.yaml
scenario_config: ../../../scenarios/classic_interactions_francis2023.yaml
num_envs: 2
feature_extractor_kwargs:
  use_pedestrian_attention: true
  attn_d_model: 64
  attn_num_heads: 4
  attn_output_dim: 64
env_overrides:
  predictive_foresight_device: cpu
env_factory_kwargs:
  asymmetric_critic: true
  reward_curriculum:
    stages:
      - until_episodes: 4
        reward_kwargs:
          weights:
            progress: 1.1
            collision: -15.0
            timeout: -6.5
            terminal_bonus: 20.0
      - reward_kwargs:
          weights:
            progress: 1.1
            living: -0.015
            collision: -15.0
            near_miss: -1.5
            ttc_risk: -1.2
            comfort: -0.5
            smoothness: -0.18
            timeout: -6.5
            stagnation: -0.8
            terminal_bonus: 20.0
tracking:
  wandb:
    enabled: true
    project: robot_sf
    group: issue-791-attention-head
