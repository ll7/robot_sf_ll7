name: Strip closed state labels

# Closed issues should not keep live routing labels (state:ready / state:running /
# state:blocked) — they pollute queue reads. This Action runs at the single choke point of
# issue closure (manual, duplicate/wontfix, or PR-merge all emit `issues: closed`) and removes
# only the documented live state labels from the just-closed issue. It is a no-op when none are
# present. The periodic detector (scripts/dev/closed_state_label_hygiene.py) remains the backstop.

on:
  issues:
    types: [closed]

permissions:
  issues: write

concurrency:
  group: strip-state-labels-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  strip-state-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove live state labels from the closed issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          # Single source of truth: derive the live state-label set from the detector module
          # (scripts/dev/closed_state_label_hygiene.py::LIVE_STATE_LABELS) so this Action and the
          # CLI never drift. No second hard-coded label list lives here.
          if ! live_labels_output=$(
            python -c 'import sys; sys.path.insert(0, "scripts/dev"); import closed_state_label_hygiene as h; print("\n".join(h.LIVE_STATE_LABELS))'
          ); then
            echo "Unable to load the live state-label allowlist; refusing cleanup." >&2
            exit 1
          fi
          LIVE_LABELS=()
          if [ -n "$live_labels_output" ]; then
            mapfile -t LIVE_LABELS <<<"$live_labels_output"
          fi
          echo "Live state labels: ${LIVE_LABELS[*]}"

          # Read-then-write (defense-in-depth): the trigger already implies the issue is closed,
          # but re-confirm CLOSED and non-PR-shaped URL through the REST issue reader before any
          # label write.
          issue_payload=$(
            python -m scripts.dev.gh_issue_rest view "$ISSUE_NUMBER" --repo "$REPO" --json state url
          )
          issue_state=$(
            python -c '
          import json
          import sys

          payload = json.load(sys.stdin)
          state = payload.get("state")
          issue_url = payload.get("url")
          if not isinstance(state, str) or not isinstance(issue_url, str):
              raise SystemExit("REST issue read returned malformed state or URL")
          print(state, issue_url)
          ' <<<"$issue_payload"
          )
          read -r state issue_url <<<"$issue_state"
          echo "Issue #$ISSUE_NUMBER state: $state url: $issue_url"
          if [ "$state" != "CLOSED" ]; then
            echo "Issue #$ISSUE_NUMBER is not CLOSED ($state); skipping (no-op)."
            exit 0
          fi
          if [[ "$issue_url" == */pull/* ]]; then
            echo "Issue #$ISSUE_NUMBER has a pull request URL; skipping (no-op)."
            exit 0
          fi

          # Fetch the issue's current labels once through the verified REST helper, then remove
          # only the live state labels that are actually present. Guarding on presence keeps the
          # step a no-op when nothing is stale.
          label_payload=$(
            python -m scripts.dev.gh_pr_label_rest list "$ISSUE_NUMBER" --repo "$REPO"
          )
          current_label_names=$(
            python -c '
          import json
          import sys

          payload = json.load(sys.stdin)
          labels = payload.get("labels")
          if payload.get("status") != "ok":
              raise SystemExit(payload.get("error", "REST label read failed"))
          if not isinstance(labels, list) or any(not isinstance(label, str) for label in labels):
              raise SystemExit("REST label read returned malformed labels")
          print("\n".join(labels))
          ' <<<"$label_payload"
          )
          CURRENT_LABELS=()
          if [ -n "$current_label_names" ]; then
            mapfile -t CURRENT_LABELS <<<"$current_label_names"
          fi

          removed=0
          for label in "${LIVE_LABELS[@]}"; do
            for present in "${CURRENT_LABELS[@]:-}"; do
              if [ "$label" = "$present" ]; then
                echo "Removing stale label '$label' from issue #$ISSUE_NUMBER"
                python -m scripts.dev.gh_pr_label_rest remove "$ISSUE_NUMBER" \
                  --repo "$REPO" --label "$label"
                removed=$((removed + 1))
                break
              fi
            done
          done

          if [ "$removed" -eq 0 ]; then
            echo "No live state labels present on issue #$ISSUE_NUMBER; nothing to do."
          else
            echo "Removed $removed live state label(s) from issue #$ISSUE_NUMBER."
          fi
