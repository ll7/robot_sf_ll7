name: Dependency Review

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "fast-pysf/pyproject.toml"
      - "fast-pysf/uv.lock"
      - "third_party/python-rvo2/pyproject.toml"
      - "third_party/python-rvo2/setup.py"
      - "third_party/python-rvo2/requirements.txt"
      - "third_party/python-rvo2/LICENSE"
      - "third_party/python-rvo2/UPSTREAM.md"
      - "third_party/python-rvo2/LOCAL_CHANGES.patch"
      - "third_party/socnavbench/LICENSE"
      - "third_party/socnavbench/LICENSES/Apache-2.0.txt"
      - "third_party/socnavbench/LICENSING.yaml"
      - "third_party/socnavbench/UPSTREAM.md"
      - "scripts/tools/check_dependency_license_inventory.py"
      - "tests/tools/test_check_dependency_license_inventory.py"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-review.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical
          # Keep dependency changes within the repository's GPLv3-compatible
          # redistribution policy. This is a change-review guard; the complete
          # locked-environment inventory remains a release-time evidence gate.
          allow-licenses: >-
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            LGPL-2.1-only,
            LGPL-2.1-or-later,
            LGPL-3.0-only,
            LGPL-3.0-or-later,
            MIT,
            MPL-2.0,
            PSF-2.0,
            GPL-3.0-only,
            GPL-3.0-or-later
          comment-summary-in-pr: false
