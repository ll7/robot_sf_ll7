# Issue 576 (BR-06): short warm-start validation config.
# Use this to verify that warm-start loading, weighted scenario sampling,
# reward wiring, and periodic evaluation all work before launching the
# overnight v4 config.
base_config: expert_ppo_issue_576_br06_base.yaml
policy_id: ppo_expert_br06_v4_validation_120k
resume_model_id: ppo_expert_br06_v3_15m_all_maps_randomized_20260304T075200
resume_source_step: 15240000
num_envs: 4
worker_mode: subproc
seeds:
  - 123
randomize_seeds: true
# Important:
# - resume_model_id resolves through model/registry.yaml and downloads from W&B
#   if the checkpoint is not cached locally.
# - total_timesteps is the final post-resume target, not the number of extra
#   timesteps to add.
total_timesteps: 15360000
best_checkpoint_metric: success_rate
ppo_hyperparams:
  learning_rate: 7.5e-5
  batch_size: 256
  n_epochs: 4
  ent_coef: 0.008
  clip_range: 0.1
  target_kl: 0.02
env_factory_kwargs:
  reward_name: route_completion_v3
  reward_kwargs:
    weights:
      progress: 1.4
      living: -0.015
      collision: -12.0
      near_miss: -3.0
      ttc_risk: -2.8
      comfort: -0.5
      smoothness: -0.18
      timeout: -4.5
      stagnation: -2.0
      terminal_bonus: 4.0
  peds_have_obstacle_forces: true
scenario_sampling:
  strategy: random
  profile_strategy: cycle
  weights:
    classic_cross_trap_medium: 3.0
    classic_cross_trap_high: 4.0
    classic_doorway_low: 3.0
    classic_doorway_high: 4.0
    classic_bottleneck_medium: 3.0
    classic_bottleneck_high: 3.5
    classic_realworld_double_bottleneck_high: 4.0
    classic_group_crossing_medium: 2.5
    classic_group_crossing_high: 3.0
    classic_merging_medium: 2.5
    classic_overtaking_medium: 2.5
    classic_head_on_corridor_medium: 2.0
    classic_t_intersection_medium: 2.0
convergence:
  plateau_window: 500
evaluation:
  evaluation_episodes: 6
  hold_out_scenarios: []
  step_schedule:
    - until_step: 15300000
      every_steps: 30000
    - every_steps: 60000
tracking:
  wandb:
    enabled: false
