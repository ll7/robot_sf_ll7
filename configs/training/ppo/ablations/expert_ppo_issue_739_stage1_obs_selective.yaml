# Stage-1 issue-739 selective observation ablation.
# Keep compact ego and predictive summary features while dropping padded pedestrian arrays.
# Inherits the shared family skeleton from expert_ppo_issue_739_base.yaml.
base_config: expert_ppo_issue_739_base.yaml
policy_id: ppo_expert_issue_739_stage1_obs_selective
feature_extractor_kwargs:
  socnav_hidden_dims: [128]
  include_socnav_keys:
    - robot_speed
    - robot_velocity_xy
    - robot_angular_velocity
    - pedestrians_count
    - predictive_crossing_count
    - predictive_flow_alignment
    - predictive_min_clearance
    - predictive_ttc_risk
  include_ego_goal_vector: true
env_factory_kwargs:
  reward_kwargs:
    weights:
      progress: 1.1
      living: -0.015
      collision: -15.0
      near_miss: -3.0
      ttc_risk: -2.8
      comfort: -0.5
      smoothness: -0.18
      timeout: -6.5
      stagnation: -2.0
      terminal_bonus: 20.0
scenario_sampling:
  strategy: random
  profile_strategy: cycle
  weights:
    classic_cross_trap_medium: 3.0
    classic_cross_trap_high: 4.0
    classic_doorway_low: 3.0
    classic_doorway_high: 4.0
    classic_bottleneck_medium: 3.0
    classic_bottleneck_high: 3.5
    classic_realworld_double_bottleneck_high: 4.0
    classic_group_crossing_medium: 2.5
    classic_group_crossing_high: 3.0
    classic_merging_medium: 2.5
    classic_overtaking_medium: 2.5
    classic_head_on_corridor_medium: 2.0
    classic_t_intersection_medium: 2.0
