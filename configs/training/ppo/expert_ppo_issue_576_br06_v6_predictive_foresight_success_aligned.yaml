# BR-06 v6 PPO retraining with compact predictor-derived foresight features
# and a stronger success-aligned reward tradeoff.
base_config: expert_ppo_issue_576_br06_predictive_base.yaml
policy_id: ppo_expert_br06_v6_predictive_foresight_success_aligned
resume_model_id: ppo_expert_br06_v3_15m_all_maps_randomized_20260304T075200
num_envs: 8
worker_mode: subproc
env_overrides:
  predictive_foresight_model_id: predictive_proxy_selected_v2_full
  predictive_foresight_max_agents: 16
  predictive_foresight_horizon_steps: 8
env_factory_kwargs:
  reward_kwargs:
    weights:
      progress: 1.0
      collision: -15.0
      timeout: -8.0
      terminal_bonus: 10.0
  peds_have_obstacle_forces: true
evaluation:
  evaluation_episodes: 30
  step_schedule:
    - until_step: 3000000
      every_steps: 250000
    - until_step: 9000000
      every_steps: 500000
    - every_steps: 1000000
tracking:
  wandb:
    group: issue-576-br06-v6-predictive-foresight-success-aligned
    job_type: expert-ppo-predictive-foresight-v6
    tags:
      - issue-576
      - br-06
      - ppo
      - predictive-foresight
      - success-aligned-reward
      - v6
      - route-completion-v3
      - randomized
