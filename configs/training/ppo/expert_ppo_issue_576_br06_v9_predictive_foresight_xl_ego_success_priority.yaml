# BR-06 v9 PPO retraining with the XL ego-conditioned predictive model as
# foresight input and a more success-dominant reward tradeoff.
base_config: expert_ppo_issue_576_br06_predictive_sub_base.yaml
policy_id: ppo_expert_br06_v9_predictive_foresight_xl_ego_success_priority
resume_model_id: ppo_expert_br06_v3_15m_all_maps_randomized_20260304T075200
num_envs: 8
worker_mode: subproc
env_overrides:
  predictive_foresight_model_id: predictive_proxy_selected_v2_xl_ego
  predictive_foresight_max_agents: 24
  predictive_foresight_horizon_steps: 12
  predictive_foresight_ego_conditioning: true
env_factory_kwargs:
  reward_name: route_completion_v3
  reward_kwargs:
    weights:
      progress: 1.1
      living: -0.015
      collision: -15.0
      near_miss: -3.0
      ttc_risk: -2.8
      comfort: -0.5
      smoothness: -0.18
      timeout: -6.5
      stagnation: -2.0
      terminal_bonus: 20.0
  peds_have_obstacle_forces: true
convergence:
  plateau_window: 3000
evaluation:
  evaluation_episodes: 30
  hold_out_scenarios: []
  step_schedule:
    - until_step: 3000000
      every_steps: 250000
    - until_step: 9000000
      every_steps: 500000
    - every_steps: 1000000
tracking:
  wandb:
    enabled: true
    project: robot_sf
    group: issue-576-br06-v9-predictive-foresight-xl-ego-success-priority
    job_type: expert-ppo-predictive-foresight-v9
    tags:
      - issue-576
      - br-06
      - ppo
      - predictive-foresight
      - xl-ego
      - success-priority-reward
      - v9
      - route-completion-v3
      - randomized
