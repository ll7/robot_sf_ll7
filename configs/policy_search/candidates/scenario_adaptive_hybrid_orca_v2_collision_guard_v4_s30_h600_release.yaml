# Hybrid v4 twin of scenario_adaptive_hybrid_orca_v2_collision_guard_s30_h600_release.yaml (issue #9726).
# Identical parameters and scenario overrides except: the v4 base config
# (surface-clearance speed levels, drive-limited rollouts, braking check), no
# 3.0 m/s speed-limit raise, and centre-distance yielding overrides expressed as
# surface clearances. The v3 config stays the frozen comparison arm.
name: scenario_adaptive_hybrid_orca_v2_collision_guard_v4_s30_h600_release
algo: hybrid_rule_local_planner
allow_testing_algorithms: true
base_config_path: configs/algos/hybrid_rule_v4_clearance_braking.yaml
params:
  # v4 drops the v3 3.0 m/s cap raise: the drive saturates at 2.0 m/s, and
  # near pedestrians the braking-consistent cap governs speed anyway.
  max_linear_speed: 2.0
  static_clearance_escape_enabled: true
  static_clearance_escape_min_clearance: 1.0
  static_clearance_escape_max_speed: 0.3
  static_clearance_escape_tolerance: 0.05
  static_recenter_enabled: true
  static_recenter_weight: 0.7
  static_recenter_probe_speed: 0.3
scenario_overrides:
  classic_merging_low:
    static_clearance_escape_enabled: false
    static_recenter_enabled: false
  francis2023_blind_corner:
    continuous_static_clearance_enabled: true
    static_hard_safety_margin: 0.0
    # v3 anticipatory yielding (slow 3.5 m / moderate 4.5 m centre distance)
    # translated to surface clearance for the 1.0 m robot + 0.4 m pedestrian.
    v4_slow_clearance_human: 2.1
    v4_moderate_clearance_human: 3.1
  francis2023_perpendicular_traffic:
    very_slow_speed: 0.6
    static_clearance_escape_max_speed: 0.6
scenario_algo_overrides:
  francis2023_leave_group:
    algo: orca
    base_config_path: configs/algos/issue707_orca_tuned.yaml
    params:
      max_linear_speed: 1.15
      orca_time_horizon: 5.0
      orca_obstacle_margin: 0.14
      orca_symmetry_bias: 0.22
      orca_head_on_bias: 0.30
