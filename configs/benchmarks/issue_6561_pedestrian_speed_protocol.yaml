# Issue #6561 pedestrian desired-speed protocol.
#
# Plain-language summary: freeze a paired six-scenario pedestrian-speed study so
# the released regime, a distributed slow regime, and a typical 1.3 m/s regime
# can be compared reproducibly after the robot-speed campaign completes.
