name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "fast-pysf/pyproject.toml"
      - "fast-pysf/uv.lock"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "fast-pysf/pyproject.toml"
      - "fast-pysf/uv.lock"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  # Latest-main-wins (issue #6399): same policy as ci.yml. Cancelling
  # in-progress runs in the per-ref group lets the final aggregate SHA of a
  # merge burst be analyzed without queueing behind superseded runs, while a
  # new pull request push still only cancels its own superseded run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:python"
