    preflight_status_required: promotion_timing_ready

# ---------------------------------------------------------------------------
# Constraints-first objective ordering (unchanged from v1). The execution stage
# must register exactly this named objective before the frozen command runs; no
# weighted comfort/SNQI may compensate for a collision or zero goal completion.
# ---------------------------------------------------------------------------
objective:
  name: constraints_first_lexicographic_v1
  ordering: constraints_first_lexicographic
  tiers:
    - tier: 1
      name: collision_or_severe_intrusion
      kind: hard_constraint
      veto: true
    - tier: 2
      name: liveness_or_goal_completion
      kind: liveness
      no_soft_compensation_when_tier_1_fails: true
    - tier: 3
      name: comfort_and_efficiency
      kind: soft
      compensates_hard_constraint_or_zero_goal_completion: false
  scalar_diagnostic_only: worst_case_snqi
  rule: no_weighted_comfort_or_snqi_improvement_compensates_for_collision_or_zero_goal_completion

# ---------------------------------------------------------------------------
# The seven counted-weak-point gates (unchanged from v1). All must pass; the
# gate set is fail-closed. Fixed confirmation shortlist/cap: the 4/5
# target-failure, mechanism, reference-success gates plus the second recorded
# execution context gate.
# ---------------------------------------------------------------------------
counted_weak_point_gates:
  fail_closed: true
  confirmation:
    fresh_confirmation_seeds: 5
    seeds_distinct_from_search_seeds: true
    no_retries: true
    mechanism_threshold_seeds: 4_of_5
    neutral_reference_threshold_seeds: 4_of_5
    second_recorded_execution_context_required: true
  gates:
    - id: 1
      name: corrected_scenario_path_certification
      rule: candidate passes corrected swept-envelope and runtime simulator-collision certification
    - id: 2
      name: deterministic_replay
      rule: exact deterministic-replay signature agreement
    - id: 3
      name: target_failure_in_at_least_4_of_5_seeds_no_retries
      rule: target planner fails in at least 4 of 5 fresh confirmation seeds with no retries
    - id: 4
      name: same_primary_mechanism_in_at_least_4_of_5_seeds
      rule: the same primary failure mechanism reproduces in at least 4 of 5 seeds
    - id: 5
      name: neutral_reference_planner_succeeds_in_at_least_4_of_5_seeds
      rule: the neutral reference planner succeeds in at least 4 of 5 of the same seeds
    - id: 6
      name: shortlist_passes_threshold_in_second_execution_context
      rule: the shortlist passes the same threshold in a second recorded execution context
    - id: 7
      name: no_excluded_row_class
      rule: no fallback, degraded, unavailable, geometry_artifact, knife_edge, stress_only, or duplicate classification
  excluded_row_classes_never_discoveries_but_remain_primary_denominator:
    - fallback
    - degraded
    - unavailable
    - geometry_artifact
    - knife_edge
    - stress_only
    - duplicate

# ---------------------------------------------------------------------------
# Estimand, uncertainty, null tests, attrition, minimally important improvement.
# ---------------------------------------------------------------------------
estimand:
  primary: tpe_minus_random_difference_in_unique_fully_admitted_weak_points
  unit: unique_fully_admitted_weak_point
  denominator: intention_to_search_384_scheduled_attempts_per_method
  primary_denominator_policy: all_scheduled_attempts_including_missing_invalid_and_attrition
  unique_endpoint_deduplication: global_within_arm_normalized_config_hash_across_all_search_seeds
  clustering: candidate_level_clustering_across_search_seeds
  independent_unit: search_seed
  counted_only_when_all_seven_gates_pass: true

uncertainty:
  # Primary inference is exact, not resampled: with six seed clusters per
  # method, the twelve labeled seed units admit C(12,6)=924 exact arm-label
  # assignments, which are enumerated fully for both the cluster-level interval
  # and the null tests. The historical bootstrap remains a secondary diagnostic.
  method: exact_cluster_level_permutation_distribution
  cluster_unit: search_seed
  clusters_per_method: 6
  total_labeled_seed_units: 12
  arm_label_assignments_C_12_6: 924
  interval: exact_95_percent_cluster_level_interval_over_all_assignments
  confidence_level: 0.95
  secondary_diagnostic: nonparametric_bootstrap_over_seed_clusters
  secondary_diagnostic_resamples: 10000

null_tests:
  tests:
    - name: shuffled_outcome_seed_permutation
      unit: search_seed
    - name: ranking_permutation_seed
      unit: search_seed
  sidedness: two_sided
  threshold_p: 0.05
  both_required: true
  exact_enumeration: all_924_arm_label_assignments

missing_invalid_attrition:
  handling: fail_closed
  included_in_primary_denominator: true
  excluded_from_primary_denominator: false
  reason_recorded: true
  no_optional_seeds: true
  no_outcome_dependent_replacement_or_exclusion: true
  complete_case_analysis: secondary_sensitivity_only_never_primary

