name: Set up CI Python environment
description: Shared post-checkout Robot SF CI setup for Python, optional Node, uv caches, system packages, and artifacts.

inputs:
  node:
    description: Install the pinned Node runtime for jobs that run browser tests.
    default: "false"
  python-version:
    description: Python version passed to actions/setup-python.
    default: "3.12"
  uv-version:
    description: uv version passed to astral-sh/setup-uv.
    # Dynamic PEP 621 versions produce a root lock entry without a static
    # version. uv 0.5.11 cannot parse that valid format; keep CI on the
    # lockfile-compatible version used to generate and validate uv.lock.
    default: "0.13.4"
  migrate-artifacts:
    description: Run the legacy artifact migration step after dependency sync.
    default: "true"
  sync-args:
    description: Arguments forwarded to uv sync; defaults to the full CI environment.
    default: "--all-extras --frozen"
  install-system-packages:
    description: Install Linux packages needed by headless runtime and GUI-capable jobs.
    default: "true"

runs:
  using: composite
  steps:
    - name: Retrieve pinned historical test fixture sources
      shell: bash
      run: bash scripts/dev/fetch_test_fixture_sources.sh

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Bootstrap security-fixed pip from a hash-pinned wheel
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

    - name: Expose the fixed CA bundle to job tools
      shell: bash
      run: |
        ca_bundle="$(python -c 'from pip._vendor import certifi; print(certifi.where())')"
        empty_ca_dir="$(mktemp -d "${RUNNER_TEMP}/robot-sf-empty-ca.XXXXXX")"
        curl_home="$(mktemp -d "${RUNNER_TEMP}/robot-sf-curl-home.XXXXXX")"
        # curl can retain its compiled CA directory despite SSL_CERT_DIR. An
        # explicit capath in a job-owned config replaces that default.
        python - "$ca_bundle" "$empty_ca_dir" "$curl_home/.curlrc" <<'PY'
        import pathlib
        import sys

        def curl_quote(value):
            return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'

        pathlib.Path(sys.argv[3]).write_text(
            'cacert = ' + curl_quote(sys.argv[1]) + '\n'
            + 'capath = ' + curl_quote(sys.argv[2]) + '\n'
        )
        PY
        echo "SSL_CERT_FILE=$ca_bundle" >> "$GITHUB_ENV"
        echo "CURL_CA_BUNDLE=$ca_bundle" >> "$GITHUB_ENV"
        echo "SSL_CERT_DIR=$empty_ca_dir" >> "$GITHUB_ENV"
        echo "CURL_HOME=$curl_home" >> "$GITHUB_ENV"

    - name: Set up browser test runtime
      if: ${{ inputs.node == 'true' }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      env:
        NODE_OPTIONS: --use-openssl-ca
      with:
        node-version-file: .nvmrc
    - name: Install uv
      id: setup-uv
      env:
        NODE_OPTIONS: --use-openssl-ca
      # A transient codeload/manifest failure must reach the pinned fallback
      # below; the final version check remains fail-closed.
      continue-on-error: true
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: "true"
        # --ci pruning discards downloaded wheels: an exact hit then restores
        # only ~9 MB of metadata and downloads the ~9 GB environment again.
        prune-cache: "false"
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Report uv cache state before sync
      shell: bash
      run: |
        echo "cache-hit=${{ steps.setup-uv.outputs.cache-hit }}"
        bash scripts/dev/ci_uv_sync_diag.sh "uv-cache-pre-sync"

    - name: Retry pinned uv install after action transport failure
      if: steps.setup-uv.outcome == 'failure'
      shell: bash
      env:
        UV_VERSION: ${{ inputs.uv-version }}
        UV_INSTALL_MAX_ATTEMPTS: "3"
        UV_INSTALL_BACKOFF_BASE: "5"
        UV_INSTALL_BACKOFF_CAP: "30"
      run: bash scripts/dev/ci_install_uv_retry.sh "${UV_VERSION}"

    - name: Verify pinned uv
      if: always()
      shell: bash
      env:
        UV_VERSION: ${{ inputs.uv-version }}
      run: |
        expected="uv ${UV_VERSION}"
        actual="$(uv --version 2>/dev/null || true)"
        actual_version="${actual#uv }"
        actual_version="${actual_version%% *}"
        if [[ "$actual" != uv\ * || "$actual_version" != "$UV_VERSION" ]]; then
          echo "::error::uv setup was not proven: expected '${expected}', got '${actual:-missing uv}'" >&2
          exit 1
        fi
        echo "uv setup verified version=${UV_VERSION}"

    - name: System packages for headless
      if: ${{ runner.os == 'Linux' && inputs.install-system-packages == 'true' }}
      shell: bash
      env:
        CI_STEP_TIMEOUT_SECONDS: "1200"
      # Chapter 7 rendered-page QA invokes pdftoppm through Poppler.
      run: >
        bash scripts/dev/ci_step_timer.sh "System packages for headless"
        bash scripts/dev/ci_install_headless_packages.sh
        libglib2.0-0 libgl1 fonts-dejavu-core jq poppler-utils

    - name: Free runner disk space
      shell: bash
      run: bash scripts/dev/free_github_runner_space.sh

    - name: Sync dependencies (locked, with transient-failure retry)
      shell: bash
      env:
        # setup-python runs above, so macOS can use the timer's Python standard-library
        # fallback without installing GNU Coreutils.
        CI_STEP_TIMEOUT_SECONDS: "1200"
      run: bash scripts/dev/ci_step_timer.sh "Sync dependencies (locked)" bash scripts/dev/uv_sync_retry.sh -- ${{ inputs.sync-args }}

    - name: Verify certificate trust after dependency sync
      shell: bash
      env:
        NODE_OPTIONS: --use-openssl-ca
      run: uv run --no-sync python scripts/ci/check_tls_trust.py

    - name: Report uv cache state after sync
      if: always()
      shell: bash
      run: bash scripts/dev/ci_uv_sync_diag.sh "uv-cache-post-sync"

    - name: Migrate legacy artifacts into canonical root
      if: ${{ inputs.migrate-artifacts == 'true' }}
      shell: bash
      run: bash scripts/dev/ci_step_timer.sh "Migrate legacy artifacts into canonical root" uv run python scripts/tools/migrate_artifacts.py
