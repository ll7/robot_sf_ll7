name: Blocker staleness report

# Report stale issue blockers weekly without changing issue state or making findings a CI failure.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: blocker-staleness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blocker-staleness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python
        with:
          migrate-artifacts: "false"

      - name: Scan blocker staleness
        env:
          NODE_OPTIONS: --use-openssl-ca
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/tools/check_blocker_staleness.py \
            --json --report-only > blocker_staleness.json

      - name: Summarize blocker staleness
        env:
          NODE_OPTIONS: --use-openssl-ca
          REPORT_PATH: blocker_staleness.json
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text())

          def cell(value: object) -> str:
              return " ".join(str(value).split()).replace("|", "\\|") or "—"

          print("## Blocker staleness report")
          print()
          print(f"Schema: `{cell(report['schema_version'])}`")
          for classification, rows in report["results"].items():
              print()
              print(f"### {cell(classification.replace('_', ' '))} ({len(rows)})")
              print()
              print("| Issue | Title | Closed blockers | Open blockers |")
              print("| --- | --- | --- | --- |")
              if not rows:
                  print("| — | No issues | — | — |")
                  continue
              for row in rows:
                  issue = row["issue"]
                  print(
                      "| #{number} | {title} | {closed} | {open_} |".format(
                          number=issue["number"],
                          title=cell(issue["title"]),
                          closed=cell(", ".join(f"#{number}" for number in row["closed_blockers"])),
                          open_=cell(", ".join(f"#{number}" for number in row["open_blockers"])),
                      )
                  )
          PY

      - name: Upload blocker-staleness report
        env:
          NODE_OPTIONS: --use-openssl-ca
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blocker-staleness-report
          path: blocker_staleness.json
          retention-days: 90
          if-no-files-found: error

      - name: Scan blocked queue triage
        env:
          NODE_OPTIONS: --use-openssl-ca
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/dev/blocked_queue_triage.py \
            --repo "$GITHUB_REPOSITORY" \
            --label state:blocked \
            --report-only \
            --output blocked_queue_triage.json > /dev/null

      - name: Summarize blocked queue triage
        env:
          NODE_OPTIONS: --use-openssl-ca
          REPORT_PATH: blocked_queue_triage.json
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text())
          counts = report["counts"]

          print("## Blocked queue triage")
          print()
          print(f"Schema: `{report['schema']}`")
          print(f"Open issues: `{report['source']['open_issue_count']}`")
          print(f"Pagination complete: `{report['source']['pagination_complete']}`")
          print()
          print("| Dimension | Counts |")
          print("| --- | --- |")
          for name, values in (
              ("Blocker class", counts["by_blocker_class"]),
              ("Condition mode", counts["by_condition_mode"]),
              ("Confidence", counts["by_confidence"]),
              ("Progress age", counts["by_progress_age"]),
          ):
              rendered = ", ".join(f"{key}={value}" for key, value in sorted(values.items()))
              print(f"| {name} | {rendered} |")
          print()
          print(f"Closure candidates: `{len(report['closure_candidates'])}` (none proposed by policy)")
          print(f"Watcher: `{report['watcher_recommendation']['command']}`")
          PY

      - name: Upload blocked queue triage report
        env:
          NODE_OPTIONS: --use-openssl-ca
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blocked-queue-triage-report
          path: blocked_queue_triage.json
          retention-days: 90
          if-no-files-found: error
