# Development candidate: restored release-B action contract and optimization horizon.
# This is a legacy differential-drive reference, not a T60 policy or release admission.
base_config: expert_ppo_issue_576_br06_v3_15m_all_maps_randomized.yaml
policy_id: ppo_dev_delta_recovery_15m
scenario_config: ../../scenarios/classic_interactions_francis2023_release_0_0_8_v1.yaml
seeds: [1001]
randomize_seeds: false
total_timesteps: 15032320
num_envs: 20
worker_mode: subproc
ppo_hyperparams:
  n_steps: 2048
env_overrides:
  ppo_action_semantics: velocity_delta
  robot_config:
    type: differential_drive
    max_linear_speed: 2.0
    max_angular_speed: 1.0
    allow_backwards: false
    max_linear_accel: 1.0
    max_linear_decel: 1.0
    max_angular_accel: 1.0
  sim_config:
    time_per_step_in_secs: 0.1
env_factory_kwargs:
  reward_name: route_completion_v3
  reward_kwargs:
    weights:
      progress: 2.2
      living: -0.01
      collision: -10.0
      near_miss: -1.0
      ttc_risk: 0.0
      comfort: -0.5
      smoothness: -0.2
      timeout: -3.0
      stagnation: -1.2
      terminal_bonus: 3.0
  peds_have_obstacle_forces: true
scenario_sampling:
  strategy: random
  episode_seed_pool: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010,
                      1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020]
convergence:
  success_rate: 1.1
  collision_rate: 0.0
  plateau_window: 100000000
evaluation:
  scenario_config: ../../scenarios/classic_interactions_francis2023_release_0_0_8_v1.yaml
  evaluation_seed_manifest: dev_delta_recovery_selection.yaml
  evaluation_episodes: 480
  randomize_seeds: false
  step_schedule:
    - every_steps: 983040
  full_policy_analysis_on_new_best: false
  full_policy_analysis_videos: false
tracking:
  tensorboard: false
  wandb:
    enabled: true
    project: robot_sf
    group: ppo-delta-recovery-development
    name: ppo-delta-recovery
    job_type: development-policy-training
