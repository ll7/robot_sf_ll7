# Canonical issue-708 full retraining run from scratch.
# Usage:
#   uv run python scripts/training/train_ppo.py \
#     --config configs/training/ppo/expert_ppo_issue_708_br06_v11_predictive_foresight_success_priority_from_scratch.yaml \
#     --log-level WARNING
base_config: expert_ppo_issue_576_br06_predictive_base.yaml
policy_id: ppo_expert_issue_708_br06_v11_predictive_foresight_success_priority_from_scratch
num_envs: auto_throughput
worker_mode: subproc
env_overrides:
  predictive_foresight_model_id: predictive_proxy_selected_v2_full
  predictive_foresight_max_agents: 16
  predictive_foresight_horizon_steps: 8
env_factory_kwargs:
  reward_kwargs:
    weights:
      progress: 1.1
      collision: -15.0
      timeout: -6.5
      terminal_bonus: 20.0
  peds_have_obstacle_forces: true
evaluation:
  # 70 maintained scenarios x 5 fixed seeds for deterministic checkpoint comparison.
  evaluation_episodes: 350
  randomize_seeds: false
  scenario_config: ../../scenarios/sets/ppo_full_maintained_eval_v1.yaml
  full_policy_analysis_on_new_best: true
  full_policy_analysis_videos: false
  step_schedule:
    - every_steps: 1000000
tracking:
  wandb:
    group: issue-708-ppo-from-scratch
    job_type: expert-ppo-issue-708
    tags:
      - issue-708
      - ppo
      - from-scratch
      - predictive-foresight
      - success-priority-reward
      - route-completion-v3
      - randomized
