name: Dependency Review

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "THIRD_PARTY_NOTICES.md"
      - "fast-pysf/**"
      - "third_party/python-rvo2/**"
      - "third_party/socnavbench/**"
      - "third_party/python-rvo2/pyproject.toml"
      - "third_party/python-rvo2/setup.py"
      - "third_party/python-rvo2/requirements.txt"
      - "third_party/socnavbench/LICENSING.yaml"
      - "third_party/socnavbench/LICENSE"
      - "third_party/socnavbench/LICENSES/Apache-2.0.txt"
      - "third_party/socnavbench/UPSTREAM.md"
      - "third_party/python-rvo2/LICENSE"
      - "third_party/python-rvo2/UPSTREAM.md"
      - "third_party/python-rvo2/LOCAL_CHANGES.patch"
      - "scripts/validation/dependency_license_profiles.v1.json"
      - "scripts/validation/dependency_license_profiles.v1.schema.json"
      - "scripts/validation/dependency_license_policy.v1.json"
      - "scripts/validation/dependency_license_policy.v1.schema.json"
      - "scripts/tools/check_dependency_license_inventory.py"
      - "tests/tools/test_check_dependency_license_inventory.py"
      - "docs/context/dependency_license_inventory.md"
      - "docs/context/evidence/llvmlite_0.49.0_surface_disposition_2026-08-20.md"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-review.yml"
      - "scripts/validation/release_legal_inputs.v1.json"
      - "scripts/tools/check_release_legal_input_coverage.py"
      - "tests/dev/test_release_legal_input_coverage.py"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical
          # Keep dependency changes within the repository's GPLv3-compatible
          # redistribution policy. This is a change-review guard; the complete
          # locked-environment inventory remains a release-time evidence gate.
          allow-licenses: >-
            Apache-2.0,
            Apache-2.0 WITH LLVM-exception,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            LGPL-2.1-only,
            LGPL-2.1-or-later,
            LGPL-3.0-only,
            LGPL-3.0-or-later,
            MIT,
            MPL-2.0,
            PSF-2.0,
            GPL-3.0-only,
            GPL-3.0-or-later
          comment-summary-in-pr: false

      - name: Generate dependency license inventory evidence
        run: >-
          python scripts/tools/check_dependency_license_inventory.py
          --output output/validation/dependency-license-inventory.json

      - name: Check generated inventory freshness
        run: >-
          python scripts/tools/check_dependency_license_inventory.py
          --check-freshness output/validation/dependency-license-inventory.json

      - name: Upload dependency license inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-license-inventory
          path: output/validation/dependency-license-inventory.json
          if-no-files-found: error
