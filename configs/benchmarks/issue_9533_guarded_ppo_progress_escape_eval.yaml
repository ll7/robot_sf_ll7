# Development screening campaign for issue #9533; all outcomes remain diagnostic-only.
# The 16 classic scenario candidates are selected from the historical constrained cells
# in #9480. The guard-control dev rows alone select the later frozen constrained subset.
# All three arms use the BR-06 v3 checkpoint and retain planner/simulation traces.
name: issue_9533_guarded_ppo_progress_escape_eval_v2
paper_facing: false
paper_profile_version: paper-matrix-v1
scenario_matrix: configs/scenarios/classic_interactions_francis2023.yaml
scenario_candidates:
  - classic_bottleneck_low
  - classic_bottleneck_medium
  - classic_bottleneck_high
  - classic_cross_trap_low
  - classic_cross_trap_medium
  - classic_cross_trap_high
  - classic_doorway_low
  - classic_doorway_medium
  - classic_doorway_high
  - classic_merging_low
  - classic_merging_medium
  - classic_overtaking_low
  - classic_overtaking_medium
  - classic_t_intersection_low
  - classic_t_intersection_medium
  - classic_realworld_double_bottleneck_high
comparability_mapping: configs/benchmarks/alyassi_comparability_map_v1.yaml
route_clearance_certifications: configs/benchmarks/route_clearance_certifications_v1.yaml

seed_policy:
  mode: seed-set
  seed_set: eval
  seed_sets_path: configs/benchmarks/seed_sets_v1.yaml

workers: 8
horizon: 600
dt: 0.1
record_forces: false
record_planner_decision_trace: true
record_simulation_step_trace: true
checkpoint_provenance_enforcement: error
resume: false
stop_on_failure: false
bootstrap_samples: 1000
bootstrap_confidence: 0.95
bootstrap_seed: 123
kinematics_matrix:
  - differential_drive
export_publication_bundle: false
include_videos_in_publication: false
overwrite_publication_bundle: false
paper_interpretation_profile: diagnostic-only

planners:
  - key: ppo_br06_matched_guard_off
    algo: ppo
    planner_group: experimental
    algo_config: configs/algos/ppo_v3_issue_9533_cpu.yaml
    benchmark_profile: experimental

  - key: guarded_ppo_baseline
    algo: guarded_ppo
    planner_group: experimental
    algo_config: configs/algos/guarded_ppo_camera_ready_cpu.yaml
    benchmark_profile: experimental

  - key: guarded_ppo_progress_escape
    algo: guarded_ppo
    planner_group: experimental
    algo_config: configs/algos/guarded_ppo_issue_9533_progress_escape.yaml
    benchmark_profile: experimental
