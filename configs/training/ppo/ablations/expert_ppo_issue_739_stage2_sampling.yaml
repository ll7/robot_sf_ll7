# Stage-2 issue-739 scenario-sampling ablation.
# Purpose: use cycle strategy to give each scenario equal exposure during early learning.
base_config: expert_ppo_issue_739_base.yaml
policy_id: ppo_expert_issue_739_stage2_sampling
scenario_config: ../../../scenarios/classic_interactions_francis2023.yaml
seeds:
  - 123
randomize_seeds: true
feature_extractor_kwargs:
  socnav_hidden_dims: [128, 128]
ppo_hyperparams:
  learning_rate: 7.5e-5
  batch_size: 256
  n_epochs: 4
  target_kl: 0.02
env_factory_kwargs:
  reward_name: route_completion_v3
  reward_kwargs:
    weights:
      progress: 1.1
      living: -0.015
      collision: -15.0
      near_miss: -3.0
      ttc_risk: -2.8
      comfort: -0.5
      smoothness: -0.18
      timeout: -6.5
      stagnation: -2.0
      terminal_bonus: 20.0
  peds_have_obstacle_forces: true
scenario_sampling:
  strategy: cycle
  profile_strategy: cycle
convergence:
  plateau_window: 32
evaluation:
  # Stage-1: full maintained surface, one fixed seed for faster ablation turnaround.
  evaluation_episodes: 70
  scenario_config: ../../../scenarios/sets/ppo_full_maintained_eval_v1.yaml
  full_policy_analysis_on_new_best: false
  step_schedule:
    - every_steps: 8192
