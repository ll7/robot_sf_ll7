# CPU-safe guarded PPO profile for parallel benchmark-release execution.
#
# This preserves the camera-ready guarded PPO policy and guard thresholds while
# preventing every forked map worker from loading a separate policy copy onto a
# shared GPU. The fallback behavior is intentionally unchanged from the
# canonical guarded PPO profile; release acceptance still rejects any episode
# that actually reports fallback or degraded execution.

model_id: ppo_expert_br06_v3_15m_all_maps_randomized_20260304T075200
device: cpu
predictive_foresight_device: cpu
deterministic: true
obs_mode: dict
action_space: unicycle
v_max: 2.0
omega_max: 1.0
fallback_to_goal: true

guard_rollout_dt: 0.1
guard_rollout_steps: 6
guard_near_field_distance: 2.0
guard_hard_ped_clearance: 0.58
guard_first_step_ped_clearance: 0.72
guard_hard_obstacle_clearance: 0.30
guard_min_ttc: 0.70

fallback_risk_dwa:
  max_linear_speed: 0.9
  max_angular_speed: 1.0
  rollout_dt: 0.1
  rollout_steps: 8
  near_field_distance: 2.5
  near_field_speed_cap: 0.55
  goal_progress_weight: 4.5
  heading_weight: 0.8
  ped_clearance_weight: 2.0
  obstacle_clearance_weight: 1.2
  smoothness_weight: 0.15
  ttc_weight: 0.35
  progress_escape_enabled: false
  clearance_model: surface_v2
  robot_radius_m: 1.0
  pedestrian_radius_m: 0.4
  hard_obstacle_clearance: 0.30

# Candidate-only geometry: guard thresholds are free-surface clearances.
guard_clearance_model: surface_v2
guard_robot_radius_m: 1.0
guard_pedestrian_radius_m: 0.4
