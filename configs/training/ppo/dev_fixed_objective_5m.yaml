# Share the release parent so each release-contract config remains runnable.
base_config: expert_ppo_issue_576_br06_v3_15m_all_maps_randomized.yaml
policy_id: ppo_dev_fixed_objective_5m
scenario_config: ../../scenarios/classic_interactions_francis2023_release_0_0_8_v1.yaml
seeds:
- 1001
randomize_seeds: false
total_timesteps: 5000000
num_envs: 20
worker_mode: subproc
ppo_hyperparams:
  n_steps: 256
env_overrides:
  ppo_action_semantics: velocity_delta
  robot_config:
    type: differential_drive
    max_linear_speed: 2.0
    max_angular_speed: 1.0
    allow_backwards: false
    max_linear_accel: 1.0
    max_linear_decel: 1.0
    max_angular_accel: 1.0
  sim_config:
    time_per_step_in_secs: 0.1
env_factory_kwargs:
  reward_name: route_completion_v3
  reward_kwargs:
    weights:
      progress: 1.0
      living: -0.015
      collision: -15.0
      near_miss: -1.5
      ttc_risk: 0.0
      comfort: -0.5
      smoothness: -0.18
      timeout: -6.5
      stagnation: -0.8
      terminal_bonus: 20.0
  peds_have_obstacle_forces: true
scenario_sampling:
  strategy: random
  episode_seed_pool:
  - 1001
  - 1002
  - 1003
  - 1004
  - 1005
  - 1006
  - 1007
  - 1008
  - 1009
  - 1010
  - 1011
  - 1012
  - 1013
  - 1014
  - 1015
  - 1016
  - 1017
  - 1018
  - 1019
  - 1020
convergence:
  success_rate: 1.1
  collision_rate: 0.0
  plateau_window: 100000000
evaluation:
  scenario_config: ../../scenarios/classic_interactions_francis2023_release_0_0_8_v1.yaml
  evaluation_seed_manifest: dev_policy_selection_seeds.yaml
  evaluation_episodes: 480
  randomize_seeds: false
  step_schedule:
  - every_steps: 1000000
  full_policy_analysis_on_new_best: false
  full_policy_analysis_videos: false
tracking:
  tensorboard: false
  wandb:
    enabled: true
    project: robot_sf
    group: navigation-dev-20261008
    name: ppo-fixed-objective-dev1001
    job_type: development-policy-training
