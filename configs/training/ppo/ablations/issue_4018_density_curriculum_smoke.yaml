# Issue #4018 diagnostic smoke config. Not a benchmark or training-result claim.
# Inherits the shared skeleton from issue_4018_smoke_base.yaml.
base_config: issue_4018_smoke_base.yaml
policy_id: issue_4018_density_curriculum_smoke
density_curriculum:
  enabled: true
  advance_rule: timestep
  enforce_nondecreasing_density: true
  stages:
    - id: sparse
      until_timesteps: 32
      density_m2: 0.04
      difficulty: 0
      max_peds_per_group: 3
    - id: medium
      until_timesteps: 64
      density_m2: 0.08
      difficulty: 0
      max_peds_per_group: 4
    - id: dense
      until_timesteps: null
      density_m2: 0.12
      difficulty: 0
      max_peds_per_group: 5
tracking:
  tensorboard: false
  wandb:
    enabled: false
    tags:
      - issue-4018
      - density-curriculum-smoke
