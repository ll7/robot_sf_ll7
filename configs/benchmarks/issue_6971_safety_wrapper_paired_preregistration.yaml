# Issue #6971 preregistration: metric-capable paired safety-wrapper campaign.
#
# This is a frozen design and analysis contract. It does not run episodes, submit compute, or
# establish a safety gain. A future maintainer go/no-go must be recorded before this packet is
# used by a campaign launcher. Fallback/degraded execution is never success evidence.
schema_version: issue_6971_safety_wrapper_paired_preregistration.v1
issue: 6971
parent_issues: [3501, 4598, 4830, 6970]
status: preregistration
evidence_tier: proposal
benchmark_evidence: false
paper_facing: false

claim_boundary: >
  Preregistration only. This packet does not run episodes or submit compute and is not benchmark
  evidence or a paper-facing safety result. It fixes the estimand, retained fields, analysis,
  and cost boundary for a future diagnostic campaign; any measured effect remains scoped to the
  declared planner/scenario/seed suite.

execution_boundary:
  campaign_execution_in_this_pr: false
  compute_submit_authorized: false
  slurm_submission_in_this_pr: false
  gpu_submission_in_this_pr: false
  paper_or_dissertation_claim_in_this_pr: false
  metric_semantics_changes: false
  fallback_or_degraded_success_allowed: false

domain_approval:
  required: true
  status: pending
  required_decisions:
    - Confirm the fixed scenario suite and S20 seed schedule remain the intended diagnostic scope.
    - Confirm native planner and model provenance readiness before any campaign submission.
    - Confirm the #4826 per-arm subprocess isolation gate is available on the execution host.
    - Confirm the reserved wall-clock, worker-hour, and storage budget is acceptable.
    - Confirm that the resulting report stays diagnostic and does not promote a universal or transfer claim.

