# Issue #9748: pre-registered development-only scenario-parameter variants.
#
# The source families are reused deliberately, but every selected row receives
# an issue-specific identity. These identities must remain disjoint from the
# frozen release matrix. The campaign config owns the same seed policy; the
# manifest keeps the seeds here as well so loading this scenario set alone does
# not silently fall back to the source archetype seeds.
schema_version: robot_sf.scenario_matrix.v1
issue: 9748
development_only: true
not_release_evidence: true
freeze_required_before_tuning: true

includes:
  - ../archetypes/classic_doorway.yaml
  - ../archetypes/classic_group_crossing.yaml
  - ../single/francis2023_perpendicular_traffic.yaml
  - ../single/francis2023_crowd_navigation.yaml

select_scenarios:
  - classic_doorway_medium
  - classic_group_crossing_medium
  - francis2023_perpendicular_traffic
  - francis2023_crowd_navigation

# This is the approved development seed domain. The checked-in campaign also
# applies this list through its fixed-list policy, so both loaders expose the
# same effective seed schedule.
scenario_overrides:
  seeds:
    - 1001
    - 1002
    - 1003
    - 1004
    - 1005
    - 1006
    - 1007
    - 1008
    - 1009
    - 1010
    - 1011
    - 1012
    - 1013
    - 1014
    - 1015
    - 1016
    - 1017
    - 1018
    - 1019
    - 1020
    - 1021
    - 1022
    - 1023
    - 1024
    - 1025
    - 1026
    - 1027
    - 1028
    - 1029
    - 1030

# The name override is applied after source selection. This gives each
# perturbed row a stable development-only identity while preserving the source
# map and route geometry.
scenario_overrides_by_name:
  classic_doorway_medium:
    name: issue_9748_dev_classic_doorway_medium
    simulation_config:
      ped_density: 0.065
      route_spawn_jitter_frac: 0.30
    metadata:
      development_only: true
      source_scenario: classic_doorway_medium
      development_variant: density_and_route_spawn_jitter
      evidence_tier: development_tuning_only
      claim_boundary: no release or paper-facing evidence
  classic_group_crossing_medium:
    name: issue_9748_dev_classic_group_crossing_medium
    simulation_config:
      ped_density: 0.10
    metadata:
      development_only: true
      source_scenario: classic_group_crossing_medium
      development_variant: density
      evidence_tier: development_tuning_only
      claim_boundary: no release or paper-facing evidence
  francis2023_perpendicular_traffic:
    name: issue_9748_dev_francis2023_perpendicular_traffic
    simulation_config:
      ped_density: 0.12
    metadata:
      development_only: true
      source_scenario: francis2023_perpendicular_traffic
      development_variant: density
      evidence_tier: development_tuning_only
      claim_boundary: no release or paper-facing evidence
  francis2023_crowd_navigation:
    name: issue_9748_dev_francis2023_crowd_navigation
    simulation_config:
      ped_density: 0.10
    metadata:
      development_only: true
      source_scenario: francis2023_crowd_navigation
      development_variant: density
      evidence_tier: development_tuning_only
      claim_boundary: no release or paper-facing evidence

map_search_paths:
  - ../../../maps/svg_maps
