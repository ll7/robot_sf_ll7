  thresholds_weakened: false

# ---------------------------------------------------------------------------
# Outcome-free sensitivity analysis (recomputed by the powered preflight).
# Distinguishes ATTAINABLE SIGNIFICANCE (what the exact design can represent)
# from POWER/SENSITIVITY (what it will detect, which depends on realized
# outcomes and cannot be claimed outcome-free).
# ---------------------------------------------------------------------------
power_analysis:
  n_seeds_per_method: 6
  total_labeled_seeds: 12
  permutation_arrangements_C_12_6: 924
  min_one_sided_permutation_p: 0.0010822510822510823
  min_two_sided_permutation_p: 0.0021645021645021645
  null_test_threshold: 0.05
  two_sided_can_reject_at_threshold: true
  # floor(0.05 * 924) = 46 assignments: any rejection region containing at
  # most 46 of the 924 assignments at least as extreme as the observed
  # statistic has exact two-sided p <= 46/924 ~= 0.0498 <= 0.05; 47
  # assignments would exceed the threshold.
  two_sided_rejection_region_max_arrangements: 46
  bootstrap_ci_clusters_per_method: 6
  attainable_significance_vs_power:
    attainable_significance: >-
      the exact enumeration of C(12,6)=924 arm-label assignments can represent the
      two-sided p<=0.05 boundary; the minimum attainable two-sided p is 2/924
    power_or_sensitivity: >-
      no outcome-free power claim is made against an unspecified alternative;
      sensitivity is characterized by the frozen rejection-region boundary (at most 46
      of 924 assignments at least as extreme as the observed statistic) and the
      minimally important improvement of one unique fully admitted weak point
  conclusion: >
    With exactly six search seeds per method, candidate-level clustering makes the
    search seed the independent unit, so each null test permutes twelve labeled seed
    units. There are C(12,6)=924 arm-label assignments: the minimum two-sided p-value
    is 2/924, which is below the 0.05 threshold, so the approved two-sided decision
    boundary is representable. Whether the fixed design actually rejects depends on the
    realized cluster outcomes; this preregistration therefore fixes the decision
    boundary, the minimally important effect (one unique fully admitted weak point),
    and the sensitivity characterization above instead of claiming outcome-free power.

