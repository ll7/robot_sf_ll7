# Issue-739 follow-up: 12M-step retraining based on issue-708 baseline.
# Reduced from 30M to 12M steps based on ablation results showing convergence
# is achievable earlier. Uses the proven baseline configuration from issue-739.
# Inherits the shared family skeleton from ablations/expert_ppo_issue_739_base.yaml.
#
# Usage:
#   uv run python scripts/training/train_ppo.py \
#     --config configs/training/ppo/expert_ppo_issue_739_12m_baseline_retrain.yaml \
#     --log-level WARNING
#
# Or with SLURM:
#   sbatch scripts/slurm/train_ppo_12m.slurm

base_config: ablations/expert_ppo_issue_739_base.yaml
policy_id: ppo_expert_issue_739_12m_baseline_retrain
scenario_config: ../../scenarios/classic_interactions_francis2023.yaml
num_envs: auto_throughput
seeds:
  - 123
  - 231
  - 777
  - 992
  - 1337

# Reduced from 30M to 12M based on issue-739 ablation findings
total_timesteps: 12000000

feature_extractor_kwargs:
  socnav_hidden_dims: [128, 128]
policy_net_arch: [256, 256]

env_factory_kwargs:
  reward_kwargs:
    weights:
      progress: 1.1
      living: -0.015
      collision: -15.0
      near_miss: -3.0
      ttc_risk: -2.8
      comfort: -0.5
      smoothness: -0.18
      timeout: -6.5
      stagnation: -2.0
      terminal_bonus: 20.0

scenario_sampling:
  strategy: random
  profile_strategy: cycle
  weights:
    classic_cross_trap_medium: 3.0
    classic_cross_trap_high: 4.0
    classic_doorway_low: 3.0
    classic_doorway_high: 4.0
    classic_bottleneck_medium: 3.0
    classic_bottleneck_high: 3.5
    classic_realworld_double_bottleneck_high: 4.0
    classic_group_crossing_medium: 2.5
    classic_group_crossing_high: 3.0
    classic_merging_medium: 2.5
    classic_overtaking_medium: 2.5
    classic_head_on_corridor_medium: 2.0
    classic_t_intersection_medium: 2.0

convergence:
  plateau_window: 1200  # Reduced proportionally for 12M steps

evaluation:
  # 70 maintained scenarios x 5 fixed seeds for deterministic checkpoint comparison
  evaluation_episodes: 350
  hold_out_scenarios: []
  randomize_seeds: false
  scenario_config: ../../scenarios/sets/ppo_full_maintained_eval_v1.yaml
  full_policy_analysis_on_new_best: true
  full_policy_analysis_videos: false
  # Eval every 400k steps (was 1M for 30M run, scaled proportionally)
  step_schedule:
    - every_steps: 400000

tracking:
  tensorboard: true
  wandb:
    enabled: true
    project: robot_sf
    group: issue-739-12m-baseline-retrain
    job_type: expert-ppo-issue-739
    tags:
      - issue-739
      - ppo
      - 12m-steps
      - baseline-retrain
      - predictive-foresight
      - success-priority-reward
      - route-completion-v3
      - randomized
