# Machine-readable frozen powered promotion contract for the issue #5303 adversarial search
# (schema v2, contract task issue-5303-step-2b-powered-search-promotion-preregistration).
#
# Plain-language summary: this freezes (before any new outcomes are generated) the powered
# successor of the historical three-seed #5303 diagnostic preregistration: one executable,
# falsifiable contract that asks whether the existing Optuna/Tree-structured Parzen
# Estimator (TPE) search finds more fully certified, independently confirmed weak points
# than the existing random search for scenario_adaptive_hybrid_orca_v2_collision_guard on
# the held-out classic_group_crossing_medium family, under a matched candidate and
# simulator-time budget, using exactly SIX independent search seeds per method and 64
# scheduled candidates per seed per method (384 per method, 768 total). The exact
# cluster-level inference over C(12,6)=924 arm-label assignments can represent the approved
# two-sided p<=0.05 decision boundary, so this contract is promotion-capable; it does not
# weaken any historical threshold.
#
# This file is the frozen source of truth. Its SHA-256 is recorded in the side-effect-free
# preregistration manifest
# (docs/context/evidence/issue_5303_search_promotion_powered_preregistration/) and is
# recomputed by robot_sf/benchmark/issue_5303_search_promotion_preregistration_v2.py at
# every check. Any field change is a contract change and requires re-preregistration before
# any outcome is generated.
schema_version: issue_5303_search_promotion_contract.v2
issue: 5303
parent_issue: 5303
step: "2b"
task_id: issue-5303-step-2b-powered-search-promotion-preregistration
frozen_on: "2026-08-11"
# Exact green origin/main commit on which every pre-existing input hash was reproduced
# (all 20 GitHub check runs completed success/skipped-by-design; blocker #6858 closed,
# runtime-materialization prerequisite #6475 terminally reconciled to merged PR #6586).
base_commit: 2b3e3c199f1f0d283ffeed0e0bac55710d8efccc
evidence_boundary: proposal_preflight_only
# What this preregistration does NOT establish. A positive step-3 result would support only
# the narrow target/family/budget statement in claim_under_test; it never supports transfer,
# minimax ranking, or paper-facing claims.
not_a_claim_of:
  - tpe_superiority_established
  - cross_planner_transfer
  - minimax_or_portfolio_ranking
  - paper_or_dissertation_or_benchmark_wide_claim

claim_under_test: >
  Under a frozen family-disjoint design and matched candidate (64 per search seed per
  method) and simulator-time budgets, the existing Optuna/TPE search yields more fully
  certified and independently confirmed weak points than the existing random search for
  scenario_adaptive_hybrid_orca_v2_collision_guard on the held-out classic_group_crossing_medium
  family, using exactly six independent search seeds per method (384 scheduled attempts per
  method, 768 total) and a constraints-first objective ordering (collision/severe intrusion,
  then liveness/goal completion, then comfort/efficiency).

