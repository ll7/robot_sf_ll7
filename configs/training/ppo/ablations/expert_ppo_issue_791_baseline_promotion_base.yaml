# Shared base for the issue-791 baseline promotion short-budget variants.
# Each variant overrides policy_id, total_timesteps, evaluation step_schedule,
# tracking.wandb.job_type, and tracking.wandb.tags.
# Inherits common invariant settings from expert_ppo_issue_791_promotion_shared_base.yaml.
# Launch a variant file, not this base config.
base_config: expert_ppo_issue_791_promotion_shared_base.yaml
scenario_config: ../../../scenarios/classic_interactions_francis2023.yaml
num_envs: 2
env_overrides:
  predictive_foresight_device: cpu
tracking:
  wandb:
    enabled: true
    project: robot_sf
    group: issue-791-baseline
