# Issue-791 wave-4 candidate B: warm-start the 11566 best.zip with an exploration boost.
#
# Motivation
# ----------
# The 11610 warm-start proved that continuing from the 11566 best checkpoint with the same
# hyperparameters reaches exactly the same best value (0.58571) and stalls. This test asks
# whether the plateau is an exploitation lock-in by loosening the update-size gates and
# raising the entropy coefficient:
#   - ent_coef: 0.008 -> 0.02       (stronger policy exploration)
#   - clip_range: 0.1 -> 0.15       (allow larger PPO updates)
#   - target_kl: 0.02 -> 0.03       (tolerate larger KL per segment before early-stop)
# Everything else matches the 11566 recipe so only the exploration regime changes.
#
# Resume overlay keeps the original grid_socnav / MultiInputPolicy contract so the
# 11566 checkpoint loads without observation-space drift.
base_config: expert_ppo_issue_791_reward_curriculum_promotion_10m_env22_resume_base.yaml
policy_id: ppo_expert_issue_791_reward_curriculum_promotion_10m_env22
scenario_config: ../../../scenarios/classic_interactions_francis2023.yaml
num_envs: 22
total_timesteps: 10000000
resume_from: ../../../../output/slurm/issue791-reward-curriculum-job-11566/benchmarks/expert_policies/checkpoints/ppo_expert_issue_791_reward_curriculum_promotion_10m_env22/ppo_expert_issue_791_reward_curriculum_promotion_10m_env22_best.zip
ppo_hyperparams:
  ent_coef: 0.02
  clip_range: 0.15
  target_kl: 0.03
evaluation:
  step_schedule:
    - every_steps: 524288
tracking:
  wandb:
    job_type: expert-ppo-10m-promotion-env22-exploration-boost
    tags:
      - issue-791
      - reward-curriculum
      - ppo
      - promotion-10m-env22
      - resume-best
      - exploration-boost
      - wave-4
