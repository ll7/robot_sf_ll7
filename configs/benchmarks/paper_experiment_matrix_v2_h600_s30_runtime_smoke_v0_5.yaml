# Candidate runtime smoke for the current 0.0.8 benchmark-data template.
# The #9748 frozen v4 slots resolve; runtime and SNQI claims require separate runs.
name: paper_experiment_matrix_v2_h600_s30_runtime_smoke_v0_5
derived_from:
  config: configs/benchmarks/paper_experiment_matrix_v2_h600_s30_benchmark_data_template.yaml
  config_sha256: 088b2b15a9bbddf6bb8eed4ef01c41c29c08f169ad56ea5efb26d9517abb616f
paper_facing: true
paper_profile_version: paper-matrix-v1
scenario_matrix: configs/scenarios/single/francis2023_blind_corner_release_0_0_8_v1.yaml
comparability_mapping: configs/benchmarks/alyassi_comparability_map_v2.yaml
route_clearance_certifications: configs/benchmarks/route_clearance_certifications_v1.yaml

amv_profile:
  name: amv-paper-v1
  contract_version: "1"
  coverage_enforcement: warn
  required_dimensions:
    use_case: [delivery_robot, shared_space_micromobility]
    context: [sidewalk, shared_space]
    speed_regime: [walking_speed, scooter_speed]
    maneuver_type: [overtake, crossing, bottleneck]

seed_policy:
  mode: fixed-list
  seeds: [103]
  seed_sets_path: configs/benchmarks/seed_sets_v1.yaml

snqi_weights: null
snqi_baseline: null
snqi_contract:
  enabled: false
  enforcement: warn
  rank_alignment_warn_threshold: 0.5
  rank_alignment_fail_threshold: 0.3
  outcome_separation_warn_threshold: 0.05
  outcome_separation_fail_threshold: 0.0
  max_component_dominance_warn_threshold: 0.24
  max_component_dominance_fail_threshold: 0.27
  calibration_seed: 123
  calibration_trials: 600

workers: 32
scenario_horizons: configs/benchmarks/horizon_schedules/release_0_0_8_authored_v1.yaml
scenario_horizons_sha256: 3b3d9716746f877b1fe5ba019af6edba56a17038f48c341f138210295c10e650
dt: 0.1
record_forces: true
checkpoint_provenance_enforcement: error
resume: false
stop_on_failure: true
bootstrap_samples: 100
bootstrap_confidence: 0.95
bootstrap_seed: 123
kinematics_matrix: [differential_drive]
export_publication_bundle: false
include_videos_in_publication: false
overwrite_publication_bundle: false
repository_url: https://github.com/ll7/robot_sf_ll7
release_tag: paper-matrix-v2-h600-s30-runtime-smoke-v0_5
doi: 10.5281/zenodo.<fresh-concept-required>
paper_interpretation_profile: runtime-smoke-advisory-no-ranking

release_kind: benchmark-data
release_status: runtime-smoke-only
claim_boundary:
  evidence_class: runtime-smoke
  benchmark_data_release: true
  software_release: false
  snqi: advisory-no-ranking
  full_benchmark_evidence: false
zenodo:
  concept: fresh-required
  doi_status: pending-assignment
  reuse_existing_concept: false
artifact_provenance:
  raw_episode_outputs: worktree-local-ignored-cache
  compact_manifest: tracked-compact-evidence
  source_commit: record-at-run

