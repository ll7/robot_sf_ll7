# Issue #8570 bounded falsification answerability packet.
#
# This is a source-bound preparation contract. It does not launch an optimizer,
# simulator, planner, campaign, or confirmation replay, and it makes no
# robustness, safety, benchmark, or scientific claim.
schema_version: adversarial_falsification_answerability.v1
packet_id: issue_8570_bounded_falsification_first_slice
issue: 8570
claim_boundary: >-
  diagnostic-only preparation packet: source-bound adversarial falsification design;
  no simulator, planner, optimizer, campaign, benchmark, safety, or scientific claim
evidence_tier: diagnostic-only
claim_eligible: false

source:
  base_ref: origin/main
  base_commit: c61b0f93683e1f9d2c83125f1d830b3d0162f3d1
  inputs:
    search_space:
      path: configs/adversarial/issue_7340_station_platform_search_space_v1.yaml
