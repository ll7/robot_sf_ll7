      result_portability: not_portable
      provenance:
        source_type: observation_level_contract
        references:
          - robot_sf/benchmark/observation_levels.py
          - configs/benchmarks/observation_noise_goal_smoke.yaml
        note: synthetic noise profiles exist but no full benchmark evidence
      revalidation_action: >
        Revalidate under noisy tracked-agent observations before any
        robustness claim.

    - axes:
        site_topology: classic_corridor
        social_cultural: social_force_default
        robot_embodiment: differential_drive
        observation_perception: lidar_2d
      evidence_status: not_evidenced
      protocol_portability: portable
      result_portability: not_portable
      provenance:
        source_type: observation_level_contract
        references:
          - robot_sf/benchmark/observation_levels.py
        note: lidar observation level defined but no full benchmark run
      revalidation_action: >
        Run full benchmark protocol with lidar observation level before
        any perception-dependent claim.

    - axes:
        site_topology: classic_corridor
        social_cultural: social_force_default
        robot_embodiment: differential_drive
        observation_perception: occluded_partial_state
      evidence_status: not_evidenced
      protocol_portability: requires_adaptation
      result_portability: not_portable
      provenance:
        source_type: observation_level_contract
        references:
          - robot_sf/benchmark/observation_levels.py
        note: occlusion level defined but requires scenario visibility support
      revalidation_action: >
        Revalidate both protocol applicability (occlusion-aware metrics)
        and empirical results under occluded observations.

    # --- Cross-site cross-social pairs (diagnostic) ---
    - axes:
        site_topology: intersection
        social_cultural: social_force_heterogeneous_speeds
        robot_embodiment: differential_drive
        observation_perception: oracle_full_state
      evidence_status: not_evidenced
      protocol_portability: portable
      result_portability: not_portable
      provenance:
        source_type: not_applicable
        references: []
        note: cross-axis combination not yet tested
      revalidation_action: >
        Revalidate if cross-site cross-social interaction claims are needed.

    - axes:
        site_topology: bottleneck
        social_cultural: social_force_heterogeneous_speeds
        robot_embodiment: differential_drive
        observation_perception: oracle_full_state
      evidence_status: not_evidenced
      protocol_portability: portable
      result_portability: not_portable
      provenance:
        source_type: not_applicable
        references: []
        note: cross-axis combination not yet tested
      revalidation_action: >
        Revalidate if bottleneck-specific speed-heterogeneity claims needed.

# --- Canonical current configurations inventory ---
# Lists the active, evidenced configurations in this repository without
# implying unsupported coverage claims.

canonical_configurations:
  description: >
    Active benchmark configurations with current provenance. Naming a
    configuration here does not imply it covers all matrix cells or that
    its results transfer across contexts.
  configs:
  - key: paper_experiment_matrix_v1
    display_name: Paper experiment matrix v1 (camera-ready baseline)
    config_path: configs/benchmarks/paper_experiment_matrix_v1.yaml
    scenario_matrix: configs/scenarios/classic_interactions_francis2023.yaml
    seed_policy: eval (seed_sets_v1.yaml)
    kinematics: [differential_drive]
    observation_level: oracle_full_state
    social_model: social_force_default
    planners: [goal, social_force, orca, ppo, prediction_planner, fast_pysf_planner]
    benchmark_profile: baseline-safe
    evidence_status: covered
    coverage_notes: >
      Primary benchmark configuration. Covers classic_interactions and
      francis2023 scenario classes with differential drive kinematics and
      oracle observation. Does not cover holonomic, lidar, noisy, or
      heterogeneous social force contexts.

  - key: paper_experiment_matrix_7planners_v1
    display_name: Paper experiment matrix 7 planners v1
    config_path: configs/benchmarks/paper_experiment_matrix_7planners_v1.yaml
    scenario_matrix: configs/scenarios/classic_interactions_francis2023.yaml
    seed_policy: eval
    kinematics: [differential_drive]
    observation_level: oracle_full_state
    social_model: social_force_default
    benchmark_profile: baseline-safe
    evidence_status: covered
    coverage_notes: >
      Extended planner panel variant. Same context coverage as
      paper_experiment_matrix_v1 with additional planner comparison.

  - key: cross_kinematics_v1
    display_name: Cross-kinematics compatibility matrix
    config_path: configs/benchmarks/paper_cross_kinematics_v1_compatibility.yaml
    kinematics: [differential_drive, bicycle_drive, holonomic]
    observation_level: oracle_full_state
    social_model: social_force_default
    evidence_status: partially_covered
    coverage_notes: >
      Kinematics compatibility testing. Does not constitute full
      benchmark evidence for non-differential-drive configurations.

  - key: camera_ready_holonomic
    display_name: Camera-ready holonomic planners
    config_path: configs/benchmarks/camera_ready_all_planners_holonomic.yaml
    kinematics: [holonomic]
    observation_level: oracle_full_state
