# Reusable benchmark-data v0.2 identity template for the 14-arm S30/H600
# contract. Historical concrete manifests remain immutable reference inputs.
#
# The source SHA and publication coordinates are supplied only after a clean
# candidate is selected. The resolver derives latest_main_base_commit from the
# exact first parent of that candidate, so this file never predicts or embeds
# the hash of its own future source commit.
schema_version: benchmark-release-manifest.v0.2
benchmark_protocol_version: 0.1.0
release_id: "{{release_tag}}"
release_tag: "{{release_tag}}"
maturity: pre-1.0
release_kind: benchmark-data
identity_resolution:
