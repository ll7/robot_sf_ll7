# Issue-791 eval-aligned reward-curriculum 10M reward-strong variant.
# The shared base owns the recipe; this file keeps the intervention and
# launch attribution explicit. Launch this variant, not the base config.
base_config: expert_ppo_issue_791_reward_curriculum_promotion_10m_env22_base.yaml
policy_id: ppo_expert_issue_791_reward_curriculum_promotion_10m_env22_eval_aligned_reward_strong
scenario_config: ../../../scenarios/sets/ppo_full_maintained_eval_v1.yaml
num_envs: 22
total_timesteps: 10000000
env_factory_kwargs:
  reward_kwargs:
    weights:
      progress: 1.5
      terminal_bonus: 30.0
  reward_curriculum:
    stages:
      - until_episodes: 100
        reward_kwargs:
          weights:
            progress: 1.5
            collision: -15.0
            timeout: -6.5
            terminal_bonus: 30.0
      - reward_kwargs:
          weights:
            progress: 1.5
            living: -0.015
            collision: -15.0
            near_miss: -1.5
            ttc_risk: -1.2
            comfort: -0.5
            smoothness: -0.18
            timeout: -6.5
            stagnation: -0.8
            terminal_bonus: 30.0
scenario_sampling:
  strategy: random
  profile_strategy: cycle
evaluation:
  step_schedule:
    - every_steps: 524288
tracking:
  wandb:
    job_type: expert-ppo-10m-weekend-reward-strong
    tags:
      - issue-791
      - reward-curriculum
      - ppo
      - promotion-10m-env22
      - eval-aligned
      - wave-4
      - weekend-wave-5
      - reward-strong
