default_license_spdx: MIT
default_license_file: LICENSE
upstream_notice_present: false
notes: >-
  The selected upstream planner files are MIT-licensed unless listed in an
  override below. The override is explicit because the directory also retains
  Apache-2.0 headers from the upstream mesh-loading bridge. Files created by
  Robot SF are listed separately and are not silently attributed to upstream.
license_overrides:
  - license_spdx: Apache-2.0
    files:
      - mp_env/map_utils.py
      - mp_env/render/rotation_utils.py
      - mp_env/render/swiftshader_renderer.py
      - sbpd/sbpd.py
local_files:
