# Opt-in force-coupled dynamic potential-field local planner (issue #7889).
# Experimental/testing-only: runnable for controlled deterministic smoke, not
# paper-facing benchmark evidence. Does not change any default planner or
# release roster.
allow_testing_algorithms: true
planner_variant: force_coupled_potential_field
attractive_weight: 1.0
repulsive_weight: 2.0
influence_radius_m: 3.0
force_saturation: 5.0
look_ahead_min_m: 0.5
look_ahead_max_m: 2.0
look_ahead_gain: 0.8
max_linear_speed: 1.0
max_angular_speed: 1.2
max_linear_rate: 0.8
max_angular_rate: 1.5
control_dt: 0.2
numerical_epsilon: 1.0e-6
obstacle_grid_threshold: 0.5
obstacle_grid_max_points: 256
obstacle_input_mode: observation_contract
pedestrian_input_mode: observation_contract
