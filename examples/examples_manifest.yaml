version: 0.1.0
schema_version: 1
exclusions:
  - path: classic_interactions_pygame.py
    kind: mirror
    reason: "Compatibility shim re-exporting examples/_archived/classic_interactions_pygame.py; registered once under _archived."
  - path: example_multi_pedestrian.py
    kind: mirror
    reason: "Compatibility shim re-exporting examples/advanced/08_multi_pedestrian.py; registered once under advanced."
  - path: demo_utils.py
    kind: helper
    reason: "Shared helper module (fast_demo_enabled) imported by examples; not a runnable example entry point."
categories:
  - slug: uncategorized
    title: "Uncategorized Examples"
    description: "Pending classification into the new tiered structure."
    order: 0
    ci_default: true
  - slug: quickstart
    title: "Quickstart"
    description: "Foundational walkthroughs for first-time users."
    order: 1
    ci_default: true
  - slug: advanced
    title: "Advanced Features"
    description: "Feature-focused demos for developers exploring capabilities."
    order: 2
    ci_default: true
  - slug: benchmarks
    title: "Benchmarks"
    description: "Benchmark runners and evaluation workflows."
    order: 3
    ci_default: true
  - slug: plotting
    title: "Plotting & Analysis"
    description: "Visualization and analysis scripts built atop benchmark outputs."
    order: 4
    ci_default: true
  - slug: _archived
    title: "Archived"
    description: "Deprecated or interactive-only examples kept for reference."
    order: 5
    ci_default: false
examples:
  - path: _archived/classic_interactions_pygame.py
    name: "Classic Interactions Pygame"
    summary: "Archived: Classic interactions pygame demo (see benchmarks/demo_full_classic_benchmark.py)."
