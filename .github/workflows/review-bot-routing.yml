name: Route external review bots

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: review-bot-routing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route-coderabbit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label code-bearing pull requests for CodeRabbit review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const automaticLabel = "review-bot-auto";
            const retryableStatuses = new Set([429, 500, 502, 503, 504]);
            const maxAttempts = 3;
            const highRiskPrefixes = [
              "robot_sf/",
              "fast-pysf/",
              "scripts/",
              "tests/",
              ".github/workflows/",
            ];

            async function withGithubRetry(operation, description) {
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  return await operation();
                } catch (error) {
                  const status = Number(error.status);
                  if (!retryableStatuses.has(status)) {
                    throw error;
                  }
                  if (attempt === maxAttempts) {
                    const message = error.message || "no error message";
                    throw new Error(
                      `${description} failed after ${maxAttempts} attempts ` +
                        `(HTTP ${status}): ${message}`,
                    );
                  }
                  const delayMs = 1000 * 2 ** (attempt - 1);
                  core.warning(
                    `${description} failed with HTTP ${status}; retrying in ${delayMs}ms ` +
                      `(attempt ${attempt + 1}/${maxAttempts}).`,
                  );
                  await new Promise((resolve) => setTimeout(resolve, delayMs));
                }
              }
              throw new Error(`${description} failed after ${maxAttempts} attempts.`);
            }

            const issueParams = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            };
            const labels = await withGithubRetry(
              () => github.paginate(github.rest.issues.listLabelsOnIssue, issueParams),
              "Listing pull request labels",
            );
            const hasAutomaticLabel = labels.some(({ name }) => name === automaticLabel);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const hasHighRiskPath = files.some(({ filename }) =>
              highRiskPrefixes.some((prefix) => filename.startsWith(prefix)),
            );

            if (hasHighRiskPath) {
              if (hasAutomaticLabel) {
                core.info(`${automaticLabel} is already present on this code-bearing pull request.`);
              } else {
                await withGithubRetry(
                  () => github.rest.issues.addLabels({ ...issueParams, labels: [automaticLabel] }),
                  `Adding ${automaticLabel}`,
                );
                core.info(`Applied ${automaticLabel} to a code-bearing pull request.`);
              }
              return;
            }

            if (!hasAutomaticLabel) {
              core.info(`No ${automaticLabel} label was present.`);
              return;
            }

            try {
              await withGithubRetry(
                () => github.rest.issues.removeLabel({ ...issueParams, name: automaticLabel }),
                `Removing ${automaticLabel}`,
              );
              core.info(`Removed ${automaticLabel}; no high-risk paths remain.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.info(`No ${automaticLabel} label was present.`);
            }
