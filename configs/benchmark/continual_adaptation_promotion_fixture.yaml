      digest: e86afc9d700b96aa9cd487eeedf942b8c586cdfe3ab0a215823ec2c4896c28de
  evidence_bundle:
    identifier: continual_adaptation_evidence_6657_v1
    uri: docs/context/evidence/issue_6657_continual_adaptation_campaign/evidence_bundle.yaml
