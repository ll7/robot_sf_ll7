# Issue #10516. Development comparison with a 60-second cap.
# Keep the scenario, seed and planner selections matched across the three step sizes.
name: issue_10516_timestep_dev_v1_200ms
paper_facing: false
protocol_version: 0.0.8
scenario_matrix: configs/scenarios/issue_10516_timestep_dev_v1.yaml
route_clearance_certifications: configs/benchmarks/route_clearance_certifications_v1.yaml
seed_policy:
  mode: fixed-list
  seeds: [1111, 1112, 1113, 1114, 1115, 1116, 1117, 1118, 1119, 1120]
dt: 0.2
horizon: 300
workers: 1
kinematics_matrix:
  - differential_drive
record_forces: true
record_simulation_step_trace: true
checkpoint_provenance_enforcement: error
resume: false
stop_on_failure: true
export_publication_bundle: false
planners:
  - key: prediction_planner
    algo: prediction_planner
    planner_group: experimental
    algo_config: configs/algos/prediction_planner_release_v0_0_8.yaml
    benchmark_profile: experimental
  - key: goal
    algo: goal
    planner_group: core
    benchmark_profile: baseline-safe
  - key: social_force
    algo: social_force
    planner_group: core
    algo_config: configs/algos/social_force_release_v0_0_8.yaml
    benchmark_profile: baseline-safe
  - key: orca
    algo: orca
    planner_group: core
    benchmark_profile: baseline-safe
    algo_config: configs/algos/orca_release_v0_0_8.yaml
    socnav_missing_prereq_policy: fail-fast
  - key: ppo
    algo: ppo
    planner_group: experimental
    algo_config: configs/baselines/ppo_release_robot_0_0_8_cpu.yaml
    benchmark_profile: experimental
    adapter_impact_eval: true
  - key: socnav_sampling
    algo: socnav_sampling
    planner_group: experimental
    algo_config: configs/algos/socnav_sampling_release_v0_0_8.yaml
    benchmark_profile: experimental
    socnav_missing_prereq_policy: fail-fast
  - key: sacadrl
    algo: sacadrl
    planner_group: experimental
    algo_config: configs/algos/socnav_release_v0_0_8.yaml
    benchmark_profile: experimental
    socnav_missing_prereq_policy: fail-fast
  - key: scenario_adaptive_hybrid_orca_v2_bottleneck_yield_v4
    algo: hybrid_rule_local_planner
    planner_group: experimental
    algo_config: configs/policy_search/candidates/scenario_adaptive_hybrid_orca_v2_bottleneck_yield_v4_s30_h600_release_0_0_8_frozen.yaml
    benchmark_profile: experimental
  - key: scenario_adaptive_hybrid_orca_v2_collision_guard_v4
    algo: hybrid_rule_local_planner
    planner_group: experimental
    algo_config: configs/policy_search/candidates/scenario_adaptive_hybrid_orca_v2_collision_guard_v4_s30_h600_release_0_0_8_frozen.yaml
    benchmark_profile: experimental
  - key: hybrid_rule_v4_fast_progress_static_escape
    algo: hybrid_rule_local_planner
    planner_group: experimental
    algo_config: configs/policy_search/candidates/hybrid_rule_v4_fast_progress_static_escape_s30_h600_release_0_0_8_frozen.yaml
    benchmark_profile: experimental
  - key: hybrid_rule_v4_fast_progress_static_escape_continuous
    algo: hybrid_rule_local_planner
    planner_group: experimental
    algo_config: configs/policy_search/candidates/hybrid_rule_v4_fast_progress_static_escape_continuous_s30_h600_release_0_0_8_frozen.yaml
    benchmark_profile: experimental
  - key: guarded_ppo
    algo: guarded_ppo
    planner_group: experimental
    algo_config: configs/algos/guarded_ppo_release_v0_0_8.yaml
    benchmark_profile: experimental
  - key: predictive_mppi
    algo: predictive_mppi
    planner_group: experimental
    algo_config: configs/algos/predictive_mppi_release_v0_0_8.yaml
    benchmark_profile: experimental
  - key: risk_dwa
    algo: risk_dwa
    planner_group: experimental
    algo_config: configs/algos/risk_dwa_release_v0_0_8.yaml
    benchmark_profile: experimental
