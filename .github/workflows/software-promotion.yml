name: Promote Immutable Software Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Build workflow run ID that produced the candidate"
        required: true
        type: string
      candidate_artifact_id:
        description: "Exact GitHub artifact ID from the build workflow"
        required: true
        type: string
      candidate_artifact_name:
        description: "Exact GitHub artifact name from the build workflow"
        required: true
        type: string
      candidate_artifact_digest:
        description: "Exact GitHub artifact digest (sha256:<64 hex>)"
        required: true
        type: string
      source_sha:
        description: "Exact 40-hex source commit recorded in candidate-manifest.json"
        required: true
        type: string
      package_version:
        description: "Package version recorded in candidate-manifest.json"
        required: true
        type: string
      resume_testpypi_run_id:
        description: "Optional prior promotion run containing an accepted TestPyPI receipt"
        required: false
        default: ""
        type: string
      resume_testpypi_receipt_artifact_id:
        description: "Optional prior TestPyPI receipt artifact ID; skips a duplicate upload"
        required: false
        default: ""
        type: string
      resume_testpypi_receipt_artifact_name:
        description: "Optional prior TestPyPI receipt artifact name"
        required: false
        default: ""
        type: string
      resume_testpypi_receipt_artifact_digest:
        description: "Optional prior TestPyPI receipt artifact digest"
        required: false
        default: ""
        type: string
      resume_production_run_id:
        description: "Optional prior promotion run containing an accepted PyPI receipt"
        required: false
        default: ""
        type: string
      resume_production_receipt_artifact_id:
        description: "Optional prior PyPI receipt artifact ID; skips a duplicate upload"
        required: false
        default: ""
        type: string
      resume_production_receipt_artifact_name:
        description: "Optional prior PyPI receipt artifact name"
        required: false
        default: ""
        type: string
      resume_production_receipt_artifact_digest:
        description: "Optional prior PyPI receipt artifact digest"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: robot-sf-software-promotion-${{ inputs.package_version }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  SDL_VIDEODRIVER: dummy
  MPLBACKEND: Agg
  PYGAME_HIDE_SUPPORT_PROMPT: "1"

jobs:
  verify-candidate:
    name: Verify immutable candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      candidate-version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Checkout promotion verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Require the protected main-branch workflow
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "software promotion must run from the protected main branch." >&2
            exit 1
          fi

      - name: Require complete resume identities
        env:
          TEST_RESUME_RUN_ID: ${{ inputs.resume_testpypi_run_id }}
          TEST_RESUME_ARTIFACT_ID: ${{ inputs.resume_testpypi_receipt_artifact_id }}
          TEST_RESUME_ARTIFACT_NAME: ${{ inputs.resume_testpypi_receipt_artifact_name }}
          TEST_RESUME_ARTIFACT_DIGEST: ${{ inputs.resume_testpypi_receipt_artifact_digest }}
          PRODUCTION_RESUME_RUN_ID: ${{ inputs.resume_production_run_id }}
          PRODUCTION_RESUME_ARTIFACT_ID: ${{ inputs.resume_production_receipt_artifact_id }}
          PRODUCTION_RESUME_ARTIFACT_NAME: ${{ inputs.resume_production_receipt_artifact_name }}
          PRODUCTION_RESUME_ARTIFACT_DIGEST: ${{ inputs.resume_production_receipt_artifact_digest }}
        run: |
          set -euo pipefail
          check_resume_tuple() {
            local label="$1"
            shift
            local present=0
            local value
            for value in "$@"; do
              if [[ -n "${value}" ]]; then
                present=$((present + 1))
              fi
            done
            if [[ "${present}" -ne 0 && "${present}" -ne 4 ]]; then
              echo "${label} resume identity must provide run, artifact ID, name, and digest together." >&2
              exit 1
            fi
          }
          check_resume_tuple testpypi \
            "${TEST_RESUME_RUN_ID}" "${TEST_RESUME_ARTIFACT_ID}" \
            "${TEST_RESUME_ARTIFACT_NAME}" "${TEST_RESUME_ARTIFACT_DIGEST}"
          check_resume_tuple pypi \
            "${PRODUCTION_RESUME_RUN_ID}" "${PRODUCTION_RESUME_ARTIFACT_ID}" \
            "${PRODUCTION_RESUME_ARTIFACT_NAME}" "${PRODUCTION_RESUME_ARTIFACT_DIGEST}"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Read candidate artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/candidate-metadata"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            > "${RUNNER_TEMP}/candidate-metadata/artifact.json"

      - name: Download exact candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          path: ${{ runner.temp }}/software-candidate

      - name: Verify artifact identity and candidate bytes
        id: verify
        env:
          METADATA: ${{ runner.temp }}/candidate-metadata/artifact.json
          CANDIDATE_DIR: ${{ runner.temp }}/software-candidate
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          python scripts/dev/software_promotion.py check-artifact \
            --metadata "${METADATA}" \
            --artifact-id "${ARTIFACT_ID}" \
            --artifact-name "${ARTIFACT_NAME}" \
            --artifact-digest "${ARTIFACT_DIGEST}" \
            --run-id "${RUN_ID}" \
            --kind candidate --source-sha "${SOURCE_SHA}"
          python scripts/dev/software_promotion.py verify-candidate \
            --candidate-dir "${CANDIDATE_DIR}" \
            --source-sha "${SOURCE_SHA}" \
            --candidate-run-id "${RUN_ID}" \
            --candidate-artifact-id "${ARTIFACT_ID}" \
            --candidate-artifact-name "${ARTIFACT_NAME}" \
            --candidate-artifact-digest "${ARTIFACT_DIGEST}" \
            --version "${VERSION}"
          python scripts/dev/software_candidate_manifest.py verify \
            --bundle-dir "${CANDIDATE_DIR}" \
            --expected-source-sha "${SOURCE_SHA}" \
            --expected-workflow-run-id "${RUN_ID}"
          printf 'version=%s\n' "${VERSION}" >> "${GITHUB_OUTPUT}"

  testpypi-upload:
    name: Publish exact bytes to TestPyPI
    needs: verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: testpypi
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      receipt-artifact-id: ${{ steps.upload-receipt.outputs.artifact-id }}
      receipt-artifact-digest: ${{ steps.upload-receipt.outputs.artifact-digest }}
      receipt-artifact-name: ${{ steps.receipt-name.outputs.name }}
    steps:
      - name: Checkout promotion verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Read candidate artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/candidate-metadata"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            > "${RUNNER_TEMP}/candidate-metadata/artifact.json"

      - name: Download and verify candidate before upload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          path: ${{ runner.temp }}/software-candidate

      - name: Verify candidate admission
        env:
          METADATA: ${{ runner.temp }}/candidate-metadata/artifact.json
          CANDIDATE_DIR: ${{ runner.temp }}/software-candidate
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          python scripts/dev/software_promotion.py check-artifact \
            --metadata "${METADATA}" --artifact-id "${ARTIFACT_ID}" \
            --artifact-name "${ARTIFACT_NAME}" --artifact-digest "${ARTIFACT_DIGEST}" \
            --run-id "${RUN_ID}" --kind candidate --source-sha "${SOURCE_SHA}"
          python scripts/dev/software_promotion.py verify-candidate \
            --candidate-dir "${CANDIDATE_DIR}" --source-sha "${SOURCE_SHA}" \
            --candidate-run-id "${RUN_ID}" --candidate-artifact-id "${ARTIFACT_ID}" \
            --candidate-artifact-name "${ARTIFACT_NAME}" \
            --candidate-artifact-digest "${ARTIFACT_DIGEST}" --version "${VERSION}"
          python scripts/dev/software_candidate_manifest.py verify \
            --bundle-dir "${CANDIDATE_DIR}" --expected-source-sha "${SOURCE_SHA}" \
            --expected-workflow-run-id "${RUN_ID}"

      - name: Stage exact wheel and sdist without rebuilding
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/software-candidate
          PACKAGE_DIR: ${{ runner.temp }}/software-packages
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          python scripts/dev/software_promotion.py stage-packages \
            --candidate-dir "${CANDIDATE_DIR}" --output-dir "${PACKAGE_DIR}" \
            --source-sha "${SOURCE_SHA}" --candidate-run-id "${RUN_ID}" \
            --candidate-artifact-id "${ARTIFACT_ID}" --candidate-artifact-name "${ARTIFACT_NAME}" \
            --candidate-artifact-digest "${ARTIFACT_DIGEST}" --version "${VERSION}"

      - name: Read prior TestPyPI receipt for safe resume
        if: ${{ inputs.resume_testpypi_receipt_artifact_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.resume_testpypi_receipt_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_testpypi_run_id }}
          path: ${{ runner.temp }}/prior-testpypi-receipt

      - name: Verify prior TestPyPI receipt for safe resume
        if: ${{ inputs.resume_testpypi_receipt_artifact_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RUN_ID: ${{ inputs.resume_testpypi_run_id }}
          PRIOR_ARTIFACT_ID: ${{ inputs.resume_testpypi_receipt_artifact_id }}
          PRIOR_ARTIFACT_NAME: ${{ inputs.resume_testpypi_receipt_artifact_name }}
          PRIOR_ARTIFACT_DIGEST: ${{ inputs.resume_testpypi_receipt_artifact_digest }}
          CANDIDATE_DIR: ${{ runner.temp }}/software-candidate
          RESUME_DIR: ${{ runner.temp }}/prior-testpypi-receipt
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.package_version }}
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/prior-testpypi-receipt-metadata.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRIOR_ARTIFACT_ID}" > "${metadata}"
          python scripts/dev/software_promotion.py check-artifact \
            --metadata "${metadata}" --artifact-id "${PRIOR_ARTIFACT_ID}" \
            --artifact-name "${PRIOR_ARTIFACT_NAME}" --artifact-digest "${PRIOR_ARTIFACT_DIGEST}" \
            --run-id "${PRIOR_RUN_ID}" --kind receipt
          python scripts/dev/software_promotion.py verify-receipt \
            --candidate-dir "${CANDIDATE_DIR}" --receipt "${RESUME_DIR}/testpypi-upload-receipt.json" \
            --channel testpypi --source-sha "${SOURCE_SHA}" --candidate-run-id "${RUN_ID}" \
            --candidate-artifact-id "${ARTIFACT_ID}" --candidate-artifact-name "${ARTIFACT_NAME}" \
            --candidate-artifact-digest "${ARTIFACT_DIGEST}" --version "${VERSION}"

      - name: Publish to TestPyPI through trusted publisher
        if: ${{ inputs.resume_testpypi_receipt_artifact_id == '' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/software-packages
          repository-url: https://test.pypi.org/legacy/
          skip-existing: false

      - name: Bind TestPyPI receipt to the exact candidate
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/software-candidate
          RECEIPT_DIR: ${{ runner.temp }}/testpypi-receipt
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.package_version }}
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          RESUME_ID: ${{ inputs.resume_testpypi_receipt_artifact_id }}
          RESUME_DIR: ${{ runner.temp }}/prior-testpypi-receipt
        run: |
          set -euo pipefail
          mkdir -p "${RECEIPT_DIR}"
          if [[ -n "${RESUME_ID}" ]]; then
            cp "${RESUME_DIR}/testpypi-upload-receipt.json" \
              "${RECEIPT_DIR}/testpypi-upload-receipt.json"
          else
            python scripts/dev/software_promotion.py write-receipt \
              --candidate-dir "${CANDIDATE_DIR}" --channel testpypi \
              --receipt "${RECEIPT_DIR}/testpypi-upload-receipt.json" \
              --source-sha "${SOURCE_SHA}" --candidate-run-id "${RUN_ID}" \
              --candidate-artifact-id "${ARTIFACT_ID}" --candidate-artifact-name "${ARTIFACT_NAME}" \
              --candidate-artifact-digest "${ARTIFACT_DIGEST}" --version "${VERSION}" \
              --promotion-run-id "${GITHUB_RUN_ID}" --promotion-run-attempt "${GITHUB_RUN_ATTEMPT}"
          fi

      - name: Set receipt artifact name
        id: receipt-name
        run: printf 'name=robot-sf-testpypi-receipt-%s-%s\n' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload TestPyPI receipt
        id: upload-receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: robot-sf-testpypi-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testpypi-receipt/
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Report receipt artifact identity
        env:
          RECEIPT_ARTIFACT_ID: ${{ steps.upload-receipt.outputs.artifact-id }}
          RECEIPT_ARTIFACT_DIGEST: ${{ steps.upload-receipt.outputs.artifact-digest }}
        run: printf 'TestPyPI receipt artifact id=%s digest=%s\n' "${RECEIPT_ARTIFACT_ID}" "${RECEIPT_ARTIFACT_DIGEST}"

  testpypi-cold-install:
    name: Verify TestPyPI public-index install
    needs: testpypi-upload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload-cold-receipt.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-cold-receipt.outputs.artifact-digest }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout promotion verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned uv for the clean-install probe
        env:
          UV_VERSION: "0.11.21"
          UV_INSTALL_MAX_ATTEMPTS: "3"
          UV_INSTALL_BACKOFF_BASE: "5"
          UV_INSTALL_BACKOFF_CAP: "30"
        run: bash scripts/dev/ci_install_uv_retry.sh "${UV_VERSION}"

      - name: Read candidate artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/candidate-metadata"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            > "${RUNNER_TEMP}/candidate-metadata/artifact.json"

      - name: Download exact candidate from its build run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          path: ${{ runner.temp }}/promotion-inputs/robot-sf-software-candidate

      - name: Download TestPyPI receipt from this promotion run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.testpypi-upload.outputs.receipt-artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/promotion-inputs/robot-sf-testpypi-receipt-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify candidate, receipt, and receipt artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIR: ${{ runner.temp }}/promotion-inputs/robot-sf-software-candidate
          RECEIPT_DIR: ${{ runner.temp }}/promotion-inputs/robot-sf-testpypi-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.package_version }}
          CANDIDATE_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_artifact_digest }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RECEIPT_ID: ${{ needs.testpypi-upload.outputs.receipt-artifact-id }}
          RECEIPT_DIGEST: ${{ needs.testpypi-upload.outputs.receipt-artifact-digest }}
          RECEIPT_NAME: ${{ needs.testpypi-upload.outputs.receipt-artifact-name }}
        run: |
          set -euo pipefail
          receipt_metadata="${RUNNER_TEMP}/testpypi-receipt-metadata.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${RECEIPT_ID}" > "${receipt_metadata}"
          python scripts/dev/software_promotion.py check-artifact \
            --metadata "${RUNNER_TEMP}/candidate-metadata/artifact.json" \
            --artifact-id "${CANDIDATE_ID}" --artifact-name "${CANDIDATE_NAME}" \
            --artifact-digest "${CANDIDATE_DIGEST}" --run-id "${CANDIDATE_RUN_ID}" \
            --kind candidate --source-sha "${SOURCE_SHA}"
          python scripts/dev/software_candidate_manifest.py verify \
            --bundle-dir "${CANDIDATE_DIR}" --expected-source-sha "${SOURCE_SHA}" \
            --expected-workflow-run-id "${CANDIDATE_RUN_ID}"
          python scripts/dev/software_promotion.py check-artifact \
            --metadata "${receipt_metadata}" --artifact-id "${RECEIPT_ID}" \
            --artifact-name "${RECEIPT_NAME}" --artifact-digest "${RECEIPT_DIGEST}" \
            --run-id "${GITHUB_RUN_ID}" --kind receipt
          python scripts/dev/software_promotion.py verify-receipt \
            --candidate-dir "${CANDIDATE_DIR}" \
            --receipt "${RECEIPT_DIR}/testpypi-upload-receipt.json" --channel testpypi \
            --source-sha "${SOURCE_SHA}" --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --candidate-artifact-id "${CANDIDATE_ID}" --candidate-artifact-name "${CANDIDATE_NAME}" \
            --candidate-artifact-digest "${CANDIDATE_DIGEST}" --version "${VERSION}"

      - name: Download both package formats from TestPyPI
        env:
          VERSION: ${{ inputs.package_version }}
          INDEX_ROOT: ${{ runner.temp }}/testpypi-index
        run: |
          set -euo pipefail
          mkdir -p "${INDEX_ROOT}"
          python -m pip download --disable-pip-version-check --no-cache-dir --no-deps \
            --only-binary=:all: --index-url https://test.pypi.org/simple \
            --dest "${INDEX_ROOT}" "robot-sf==${VERSION}"
          python -m pip download --disable-pip-version-check --no-cache-dir --no-deps \
            --no-binary=:all: --index-url https://test.pypi.org/simple \
            --dest "${INDEX_ROOT}" "robot-sf==${VERSION}"

      - name: Verify public-index package bytes
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/promotion-inputs/robot-sf-software-candidate
          INDEX_ROOT: ${{ runner.temp }}/testpypi-index
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.package_version }}
          CANDIDATE_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_artifact_digest }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          python scripts/dev/software_promotion.py verify-index-artifacts \
            --candidate-dir "${CANDIDATE_DIR}" --download-dir "${INDEX_ROOT}" \
            --source-sha "${SOURCE_SHA}" --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --candidate-artifact-id "${CANDIDATE_ID}" --candidate-artifact-name "${CANDIDATE_NAME}" \
            --candidate-artifact-digest "${CANDIDATE_DIGEST}" --version "${VERSION}"

      - name: Run clean exact-wheel install and console-script probes
        env:
          ROBOT_SF_WHEEL_INSTALL_SMOKE_EXTRAS: ""
          ROBOT_SF_WHEEL_INSTALL_SMOKE_REPORT: ${{ runner.temp }}/testpypi-cold-install/wheel-install-smoke.json
          INDEX_ROOT: ${{ runner.temp }}/testpypi-index
        run: |
          set -euo pipefail
          wheel="$(find "${INDEX_ROOT}" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          [[ -n "${wheel}" ]]
          bash scripts/validation/wheel_install_smoke.sh "${wheel}"

      - name: Bind cold-install receipt to TestPyPI and candidate
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/promotion-inputs/robot-sf-software-candidate
          TEST_RECEIPT: ${{ runner.temp }}/promotion-inputs/robot-sf-testpypi-receipt-${{ github.run_id }}-${{ github.run_attempt }}/testpypi-upload-receipt.json
          INDEX_ROOT: ${{ runner.temp }}/testpypi-index
          REPORT: ${{ runner.temp }}/testpypi-cold-install/wheel-install-smoke.json
          RECEIPT: ${{ runner.temp }}/testpypi-cold-install/testpypi-cold-install-receipt.json
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.package_version }}
          CANDIDATE_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_artifact_digest }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${RECEIPT}")"
          wheel="$(find "${INDEX_ROOT}" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          python scripts/dev/software_promotion.py write-cold-install-receipt \
            --candidate-dir "${CANDIDATE_DIR}" --test-receipt "${TEST_RECEIPT}" \
            --downloaded-wheel "${wheel}" --index-url https://test.pypi.org/simple \
            --report "${REPORT}" --receipt "${RECEIPT}" \
            --source-sha "${SOURCE_SHA}" --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --candidate-artifact-id "${CANDIDATE_ID}" --candidate-artifact-name "${CANDIDATE_NAME}" \
            --candidate-artifact-digest "${CANDIDATE_DIGEST}" --version "${VERSION}"

      - name: Upload TestPyPI cold-install evidence
        id: upload-cold-receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: robot-sf-testpypi-cold-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testpypi-cold-install/
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  pypi-upload:
    name: Publish exact bytes to PyPI
    needs: [verify-candidate, testpypi-upload, testpypi-cold-install]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      receipt-artifact-id: ${{ steps.upload-receipt.outputs.artifact-id }}
      receipt-artifact-digest: ${{ steps.upload-receipt.outputs.artifact-digest }}
      receipt-artifact-name: ${{ steps.receipt-name.outputs.name }}
    steps:
      - name: Checkout promotion verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Read candidate artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/candidate-metadata"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            > "${RUNNER_TEMP}/candidate-metadata/artifact.json"

      - name: Download exact candidate from its build run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          path: ${{ runner.temp }}/promotion-inputs/robot-sf-software-candidate

      - name: Download TestPyPI receipt and cold-install evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.testpypi-upload.outputs.receipt-artifact-id }},${{ needs.testpypi-cold-install.outputs.artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/promotion-inputs

      - name: Verify all pre-production bindings
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIR: ${{ runner.temp }}/promotion-inputs/robot-sf-software-candidate
          TEST_RECEIPT_DIR: ${{ runner.temp }}/promotion-inputs/robot-sf-testpypi-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          COLD_DIR: ${{ runner.temp }}/promotion-inputs/robot-sf-testpypi-cold-install-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.package_version }}
          CANDIDATE_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_artifact_digest }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          TEST_ID: ${{ needs.testpypi-upload.outputs.receipt-artifact-id }}
          TEST_DIGEST: ${{ needs.testpypi-upload.outputs.receipt-artifact-digest }}
          TEST_NAME: ${{ needs.testpypi-upload.outputs.receipt-artifact-name }}
          COLD_ID: ${{ needs.testpypi-cold-install.outputs.artifact-id }}
          COLD_DIGEST: ${{ needs.testpypi-cold-install.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          candidate_metadata="${RUNNER_TEMP}/candidate-metadata/artifact.json"
          test_metadata="${RUNNER_TEMP}/testpypi-receipt-metadata.json"
          cold_metadata="${RUNNER_TEMP}/cold-install-metadata.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TEST_ID}" > "${test_metadata}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${COLD_ID}" > "${cold_metadata}"
          python scripts/dev/software_promotion.py check-artifact \
            --metadata "${candidate_metadata}" --artifact-id "${CANDIDATE_ID}" \
            --artifact-name "${CANDIDATE_NAME}" --artifact-digest "${CANDIDATE_DIGEST}" \
            --run-id "${CANDIDATE_RUN_ID}" --kind candidate --source-sha "${SOURCE_SHA}"
          python scripts/dev/software_candidate_manifest.py verify \
            --bundle-dir "${CANDIDATE_DIR}" --expected-source-sha "${SOURCE_SHA}" \
            --expected-workflow-run-id "${CANDIDATE_RUN_ID}"
          python scripts/dev/software_promotion.py check-artifact \
            --metadata "${test_metadata}" --artifact-id "${TEST_ID}" \
            --artifact-name "${TEST_NAME}" --artifact-digest "${TEST_DIGEST}" \
            --run-id "${GITHUB_RUN_ID}" --kind receipt
          python scripts/dev/software_promotion.py check-artifact \
            --metadata "${cold_metadata}" --artifact-id "${COLD_ID}" \
            --artifact-name "robot-sf-testpypi-cold-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "${COLD_DIGEST}" --run-id "${GITHUB_RUN_ID}" --kind receipt
          python scripts/dev/software_promotion.py verify-receipt \
            --candidate-dir "${CANDIDATE_DIR}" --receipt "${TEST_RECEIPT_DIR}/testpypi-upload-receipt.json" \
            --channel testpypi --source-sha "${SOURCE_SHA}" --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --candidate-artifact-id "${CANDIDATE_ID}" --candidate-artifact-name "${CANDIDATE_NAME}" \
            --candidate-artifact-digest "${CANDIDATE_DIGEST}" --version "${VERSION}"
          python scripts/dev/software_promotion.py verify-cold-install \
            --candidate-dir "${CANDIDATE_DIR}" --test-receipt "${TEST_RECEIPT_DIR}/testpypi-upload-receipt.json" \
            --receipt "${COLD_DIR}/testpypi-cold-install-receipt.json" \
            --report "${COLD_DIR}/wheel-install-smoke.json" \
            --source-sha "${SOURCE_SHA}" --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --candidate-artifact-id "${CANDIDATE_ID}" --candidate-artifact-name "${CANDIDATE_NAME}" \
            --candidate-artifact-digest "${CANDIDATE_DIGEST}" --version "${VERSION}"

      - name: Stage exact wheel and sdist without rebuilding
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/promotion-inputs/robot-sf-software-candidate
          PACKAGE_DIR: ${{ runner.temp }}/software-packages
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          python scripts/dev/software_promotion.py stage-packages \
            --candidate-dir "${CANDIDATE_DIR}" --output-dir "${PACKAGE_DIR}" \
            --source-sha "${SOURCE_SHA}" --candidate-run-id "${RUN_ID}" \
            --candidate-artifact-id "${ARTIFACT_ID}" --candidate-artifact-name "${ARTIFACT_NAME}" \
            --candidate-artifact-digest "${ARTIFACT_DIGEST}" --version "${VERSION}"

      - name: Read prior PyPI receipt for safe resume
        if: ${{ inputs.resume_production_receipt_artifact_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.resume_production_receipt_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_production_run_id }}
          path: ${{ runner.temp }}/prior-pypi-receipt

      - name: Verify prior PyPI receipt for safe resume
        if: ${{ inputs.resume_production_receipt_artifact_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RUN_ID: ${{ inputs.resume_production_run_id }}
          PRIOR_ARTIFACT_ID: ${{ inputs.resume_production_receipt_artifact_id }}
          PRIOR_ARTIFACT_NAME: ${{ inputs.resume_production_receipt_artifact_name }}
          PRIOR_ARTIFACT_DIGEST: ${{ inputs.resume_production_receipt_artifact_digest }}
          CANDIDATE_DIR: ${{ runner.temp }}/promotion-inputs/robot-sf-software-candidate
          RESUME_DIR: ${{ runner.temp }}/prior-pypi-receipt
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.package_version }}
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/prior-pypi-receipt-metadata.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRIOR_ARTIFACT_ID}" > "${metadata}"
          python scripts/dev/software_promotion.py check-artifact \
            --metadata "${metadata}" --artifact-id "${PRIOR_ARTIFACT_ID}" \
            --artifact-name "${PRIOR_ARTIFACT_NAME}" --artifact-digest "${PRIOR_ARTIFACT_DIGEST}" \
            --run-id "${PRIOR_RUN_ID}" --kind receipt
          python scripts/dev/software_promotion.py verify-receipt \
            --candidate-dir "${CANDIDATE_DIR}" --receipt "${RESUME_DIR}/pypi-upload-receipt.json" \
            --channel pypi --source-sha "${SOURCE_SHA}" --candidate-run-id "${RUN_ID}" \
            --candidate-artifact-id "${ARTIFACT_ID}" --candidate-artifact-name "${ARTIFACT_NAME}" \
            --candidate-artifact-digest "${ARTIFACT_DIGEST}" --version "${VERSION}"

      - name: Publish to PyPI through trusted publisher
        if: ${{ inputs.resume_production_receipt_artifact_id == '' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/software-packages
          repository-url: https://upload.pypi.org/legacy/
          skip-existing: false

      - name: Bind PyPI receipt to the exact candidate
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/promotion-inputs/robot-sf-software-candidate
          RECEIPT_DIR: ${{ runner.temp }}/pypi-receipt
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.package_version }}
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          RESUME_ID: ${{ inputs.resume_production_receipt_artifact_id }}
          RESUME_DIR: ${{ runner.temp }}/prior-pypi-receipt
        run: |
          set -euo pipefail
          mkdir -p "${RECEIPT_DIR}"
          if [[ -n "${RESUME_ID}" ]]; then
            cp "${RESUME_DIR}/pypi-upload-receipt.json" "${RECEIPT_DIR}/pypi-upload-receipt.json"
          else
            python scripts/dev/software_promotion.py write-receipt \
              --candidate-dir "${CANDIDATE_DIR}" --channel pypi \
              --receipt "${RECEIPT_DIR}/pypi-upload-receipt.json" \
              --source-sha "${SOURCE_SHA}" --candidate-run-id "${RUN_ID}" \
              --candidate-artifact-id "${ARTIFACT_ID}" --candidate-artifact-name "${ARTIFACT_NAME}" \
              --candidate-artifact-digest "${ARTIFACT_DIGEST}" --version "${VERSION}" \
              --promotion-run-id "${GITHUB_RUN_ID}" --promotion-run-attempt "${GITHUB_RUN_ATTEMPT}"
          fi

      - name: Set receipt artifact name
        id: receipt-name
        run: printf 'name=robot-sf-pypi-receipt-%s-%s\n' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload PyPI receipt
        id: upload-receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: robot-sf-pypi-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pypi-receipt/
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Report receipt artifact identity
        env:
          RECEIPT_ARTIFACT_ID: ${{ steps.upload-receipt.outputs.artifact-id }}
          RECEIPT_ARTIFACT_DIGEST: ${{ steps.upload-receipt.outputs.artifact-digest }}
        run: printf 'PyPI receipt artifact id=%s digest=%s\n' "${RECEIPT_ARTIFACT_ID}" "${RECEIPT_ARTIFACT_DIGEST}"
