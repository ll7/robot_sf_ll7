<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Francis 2023 (c): Pedestrian Overtaking -->
<!-- #10063: Robot spawn y=4.0..4.5 (formerly 4.0..6.0); h1 start y=6.6 (formerly 6.0). Its initial lateral offset is 2.1 m from the spawn rectangle and 1.6 m from the authored robot route; the exit inclines upward, so these are not the runtime passing gaps. h1 starts at x=1.5 behind every robot start and outside the reset reaction buffer. Release robot cap 0.7 m/s, unchanged h1 desired speed 0.8 m/s, 600-step budget: preserves a real overtake rather than outrunning h1. OVTFIX2: h1 now finishes at (35,13), away from the unchanged robot final approach. The nominal parked centre clears the full robot goal rectangle by 7.071 m and the robot route by 8 m. The upper exit area is extended by 5 m so wall repulsion cannot pull the parked walker back onto the final approach; the straight walker route retains a forward overtaking advantage. -->
<svg
  width="40"
  height="15"
  viewBox="0 0 40 15"
  version="1.1"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
  <g inkscape:label="obstacles">
    <rect x="0" y="0" width="40" height="1" fill="#000000" inkscape:label="obstacle" />
    <rect x="0" y="14" width="40" height="1" fill="#000000" inkscape:label="obstacle" />
    <rect x="0" y="0" width="1" height="15" fill="#000000" inkscape:label="obstacle" />
    <rect x="39" y="0" width="1" height="15" fill="#000000" inkscape:label="obstacle" />
  </g>
  <g inkscape:label="robot">
    <rect x="3" y="4" width="2" height="0.5" fill="#ffdf00" inkscape:label="robot_spawn_zone" />
    <rect x="36" y="4" width="2" height="2" fill="#ff6c00" inkscape:label="robot_goal_zone" />
    <path d="M 7 5 L 37 5" stroke="#0300d5" stroke-width="0.3" fill="none" inkscape:label="robot_route_0_0" />
  </g>
  <g inkscape:label="pedestrians">
    <circle cx="1.5" cy="6.6" r="0.6" fill="#7fa7ff" stroke="#3a5edb" stroke-width="0.2"
      inkscape:label="single_ped_h1_start" />
    <circle cx="1.5" cy="6.6" r="0.4" fill="none" stroke="#8c4bff" stroke-width="0.2" class="poi" id="poi_h1_start" inkscape:label="poi_h1_start" />
    <circle cx="35" cy="13" r="0.6" fill="none" stroke="#3a5edb" stroke-width="0.2"
      inkscape:label="single_ped_h1_goal" />
    <circle cx="35" cy="13" r="0.4" fill="none" stroke="#8c4bff" stroke-width="0.2" class="poi" id="poi_h1_goal" inkscape:label="poi_h1_goal" />
  </g>
</svg>
