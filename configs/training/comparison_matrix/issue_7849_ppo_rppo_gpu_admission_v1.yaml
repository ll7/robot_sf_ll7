    - 6000000
    - 7000000
    - 8000000
    - 9000000
    - 10000000
    - 11000000
    - 12000000
    - 13000000
    - 14000000
    - 15000000
  checkpoint_kinds_required: [latest, scheduled, best, final]
  selection_rule:
    metric: success_rate
    direction: maximize
    tie_break: earliest evaluation step
    collision_guardrail: report collision_rate separately and reject any rule that lets success compensate a material collision regression
    no_outcome_tuning: true
  evaluation_seed_manifest:
    status: missing_explicit_disjoint_manifest
    required: true
    current_runner_behavior: >-
      Feed-forward evaluation derives deterministic seed blocks from the
      training seed list, while recurrent evaluation derives its seed from the
      training seed. Neither runner accepts or records a separate immutable
      disjoint evaluation-seed manifest.
  recurrent_metric_producer:
    status: available_native
    current_behavior: >-
      The recurrent evaluator preserves terminal metadata for both supported
      vector-environment step APIs, emits the canonical success_rate and
      collision_rate episode/summary metrics, and selects the configured
      metric without a return proxy. Focused tests cover metric production and
      checkpoint selection; full rows still require an immutable shared
      evaluation-seed manifest.
    required_remedy: bind the native producer to the shared evaluation-seed manifest
  feed_forward_metric_producer:
    status: available_per_seed
    current_behavior: >-
      The feed-forward lane accepts one declared --seed per invocation and a
      path-safe --run-id, isolates the effective policy/checkpoint
      identity, and retains the canonical metric surface. Full rows and
      explicit disjoint evaluation identities still require Gate 0.

technical_fixes:
  feed_forward_seed_independence:
    status: implemented_and_focused_tested
    interface: --seed plus --run-id
    semantic_boundary: >-
      The registered config, hyperparameters, reward, scenarios, and seed set
      remain unchanged; the override selects one declared seed and isolates
      its run identity.
  recurrent_metric_production:
    status: implemented_and_focused_tested
    metrics: [success_rate, collision_rate, path_efficiency, comfort_exposure, snqi, eval_episode_return, eval_avg_step_reward]
    selection: configured_best_checkpoint_metric
    semantic_boundary: >-
      Metrics reuse train_ppo's canonical terminal metadata helper. No metric
      definition, collision flag, selection direction, or scientific threshold
      was changed.

