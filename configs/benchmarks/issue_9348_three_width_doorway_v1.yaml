schema_version: robot_sf.issue_9348_three_width_doorway.v1
issue: 9348
family_id: francis2023_narrow_doorway_three_width_v1
family_reference:
  issue: 6644
  manifest: configs/benchmarks/issue_6644_narrow_doorway_geometry_family_v1.yaml
  generator_owner: robot_sf/benchmark/narrow_doorway_geometry_family.py
claim_boundary: diagnostic within-simulator geometry evidence only; not physical-footprint validation, realism evidence, sim-to-real evidence, deployment safety, frozen-release evidence, or a general planner ranking

base_scenario:
  scenario_id: francis2023_narrow_doorway
  scenario_path: configs/scenarios/single/francis2023_narrow_doorway.yaml
  map_path: maps/svg_maps/francis2023/francis2023_narrow_doorway.svg

geometry:
  units: m
  gap_width_m:
    - 3.6
    - 4.2
    - 4.8
  constriction_depth_m:
    - 1.0
  baseline:
    gap_width_m: 2.0
    constriction_depth_m: 1.0
  route_y_m: 5.0
  route_waypoints:
    - [7.0, 5.0]
    - [25.5, 5.0]
  map_bounds_m: [0.0, 30.0, 0.0, 10.0]

width_selection_rationale:
  envelope_diameter_m: 2.0
  source: ll7/diss#2669 suggests positive-clearance ratios as candidates; the narrower 2.2 m and 2.8 m probes failed the current grid feasibility preflight, so these wider levels await the same preflight before freezing
  ratios: [1.8, 2.1, 2.4]
  clearance_m: [1.6, 2.2, 2.8]
  baseline_2m_role: historical reference only; zero-clearance map excluded from comparison

envelope:
  nominal_radius_m: 1.0
  reduced_probe_radius_m: 0.5
  source: robot_sf.common.robot_defaults.DEFAULT_ROBOT_RADIUS; frozen width/radius semantics audited by issue #6645; runtime radius binding by issue #6641

oracle:
  algorithm: goal
  seed: 225
  horizon_steps: 400
  run_before_planners: true
  classification_contract:
    negative_margin: infeasible_by_construction
    zero_margin: boundary_tangent
    positive_margin: geometrically_feasible_candidate

planner_protocol:
  roster:
    - goal
    - social_force
  seeds: [225, 226, 227, 228, 229, 230, 231, 232, 233, 234, 235, 236, 237, 238, 239, 240, 241, 242, 243, 244, 245, 246, 247, 248, 249, 250, 251, 252, 253, 254]
  horizon_steps: 400
  execution_status: not_started
  pairing: pair_id is shared across widths; admission requires matching recorded initial actor states and external RNG states before any width comparison; matching seed alone is insufficient
  expected_rows: 180
  pair_admission: fail_closed_until_initial_state_and_external_rng_hashes_match
  fallback_policy: record_unavailable_or_degraded; never silently coerce a cell into valid planner evidence

execution:
  production_campaign_authorized: false
  slurm_submission_authorized: false
  evidence_admission: not_started
  baseline_map_must_remain_unchanged: true
