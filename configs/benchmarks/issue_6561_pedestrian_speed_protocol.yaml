pedestrian_speed_contract:
  spawn:
    initial_speed_m_s: 0.5
    initial_speed_binding: released_default
    change_forbidden: true
  regimes:
    - regime_id: legacy_default
      role: released_reference
      runtime_controls:
        ped_speed_tier: null
        desired_speed_mean: null
        desired_speed_std: null
        desired_speed_seed: null
      binding: unset_tier_spawn_coupled_legacy_default
    - regime_id: slow_distributed
      role: fixed_mean_distribution_control
      runtime_controls:
        ped_speed_tier: null
        desired_speed_mean: 0.65
        desired_speed_std: 0.2
        desired_speed_seed: episode_seed
      binding: explicit_desired_speed_distribution
    - regime_id: typical_distributed
      role: typical_adult_walking_distribution
      runtime_controls:
        ped_speed_tier: null
        desired_speed_mean: 1.3
        desired_speed_std: 0.2
        desired_speed_seed: episode_seed
      binding: explicit_desired_speed_distribution
  regime_count: 3

metric_contract:
  primary_metrics:
    - success_rate
    - collision_rate
    - near_miss_rate
  exposure_metrics:
    - time_to_goal_norm
    - total_exposure_seconds
    - travel_distance_m
    - mean_clearance_m
    - min_clearance_m
  typed_collision_metrics:
    - ped_collision_rate
    - obstacle_collision_rate
    - agent_collision_rate
    - unclassified_collision_rate
  denominator_contract: >-
    Every primary and exposure metric is computed over complete native rows for
    the exact scenario-regime-planner-seed identity; excluded rows are listed and
    cannot be silently reintroduced into a summary.

inference_contract:
  comparison: regime_minus_legacy_default
  resampling_unit: paired_scenario_seed_block
  resampling_unit_rationale: >-
    Pair each non-reference regime with legacy_default for the same scenario,
    planner, and seed, then resample the seed block across the six declared
    scenarios. This preserves the fixed-suite contrasts without implying an
    unobserved scenario superpopulation.
  estimand_scope: per_planner_robustness
  ranking_scope: descriptive_only
  confidence_level: 0.95
  interval_method: paired_seed_block_percentile_bootstrap_one_sided
  bootstrap_replicates: 2000
  tail_probability_rule: plus_one_empirical_tail_at_harm_margin
  multiplicity:
    method: holm_bonferroni
    family: planner_by_non_reference_regime_by_primary_metric
    tests_per_planner: 6
    directional_families:
      - materially_harmful
      - noninferiority
    familywise_alpha: 0.05
    directional_family_alpha: 0.025
    allocation: equal_split_bonferroni
  harm_margins:
    success_rate: -0.05
    collision_rate: 0.02
    near_miss_rate: 0.05
  decision_labels:
    materially_harmful: >-
      At least one primary metric crosses its multiplicity-adjusted harm margin
      in the harmful direction.
    no_material_shift: >-
      All primary metrics satisfy the adjusted non-inferiority rule at their
      declared margins.
    inconclusive: >-
      The native paired grid is complete but neither decision condition is met.
    intervention_not_activated: >-
      The desired-speed intervention fails the frozen activation or transient
      validity rule; no no-harm conclusion is allowed.

activation_contract:
  required_diagnostics:
    - configured_desired_speed_mean_m_s
    - configured_desired_speed_std_m_s
    - realized_desired_speed_mean_m_s
    - realized_desired_speed_std_m_s
    - initial_spawn_speed_mean_m_s
    - initial_spawn_speed_peak_m_s
    - time_to_desired_speed_target_seconds
    - acceleration_transient_steps
    - desired_speed_activation_fraction
  target_tolerance_m_s: 0.2
  minimum_activation_fraction: 0.8
  maximum_spawn_transient_seconds: 2.0
  transient_exclusion: >-
    Record the first time each pedestrian enters the target tolerance and the
    acceleration transient; exclude only the declared transient window from
    activation summaries. Never tune or silently shorten the window after rows.
  rule: >-
    For slow_distributed and typical_distributed, the regime is activated only
    when at least 0.80 of pedestrians reach the configured desired-speed mean
    within 0.20 m/s and the p95 time-to-target is at most 2.0 seconds. The
    legacy_default reference is recorded but is not treated as an intervention.
  failure_class: intervention_not_activated

