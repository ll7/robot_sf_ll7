schema_version: research-campaign-manifest.v0.1

campaign:
  id: issue_3062_example_research_campaign
  parent_issue: 3062
  purpose: Example contract for research-engine campaign provenance and artifact flow.
  evidence_tier: proposal
  claim_boundary: >
    This example validates manifest shape only. It does not claim planner,
    metric, benchmark, or paper-facing results.

scenario_suite:
  matrix_path: configs/benchmarks/issue_3059_research_engine_suite_v0.yaml
  scenario_ids:
    - nominal_shared_space
  suite_hash_policy: record_sha256_before_run

planners:
  rows:
    - planner_id: social_force
      adapter_mode: native
      config_path: null
      expected_availability: available
    - planner_id: prediction_planner
      adapter_mode: adapter
      config_path: configs/benchmarks/planner_readiness_matrix_v1.yaml
      expected_availability: adapter_preflight_required

seed_policy:
  mode: fixed-list
  seeds:
    - 101
    - 202
  repeat_policy: every_planner_scenario_pair

metrics:
  ids:
    - success_rate
    - collision_rate
    - min_clearance_m
    - timeout_rate
  denominator_policy: report_per_planner_scenario_seed_denominators
  baseline_or_weights: not_required

row_status_policy:
  allowed_values:
    - successful_evidence
    - diagnostic_only
    - fallback
    - degraded
    - not_available
    - failed
    - blocked
  success_values:
    - successful_evidence
  fail_closed_values:
    - not_available
    - failed
    - blocked
  fallback_policy: >
    Fallback and degraded rows remain visible in summaries and cannot be counted
    as benchmark-strength success evidence.

outputs:
  local_root: output/benchmarks/issue_3062_example_research_campaign
  disposable: true
  required_paths:
    - campaign_manifest.json
    - manifest.json
    - run_meta.json
    - preflight/validate_config.json
    - preflight/preview_scenarios.json
    - reports/campaign_summary.json
    - reports/campaign_table.csv
    - reports/campaign_table.md
    - reports/row_status_summary.json
  summary_json:
    path: reports/campaign_summary.json
    required_fields:
      - campaign_id
      - source_manifest
      - git_commit
      - planner_rows
      - row_status_summary
      - answerability
      - artifact_paths
      - caveats
  summary_table:
    path: reports/campaign_table.csv
    required_columns:
      - scenario_id
      - planner_id
      - adapter_mode
      - seed
      - row_status
      - success_rate
      - collision_rate
      - min_clearance_m
      - timeout_rate

durable_evidence:
  plan:
    kind: tracked_context_evidence
    path: docs/context/evidence/issue_3062_campaign_manifest_example/README.md
    required_before_claim: true
  external_artifact_pointer: not_required_for_example
  local_output_boundary: >
    The output/ tree is a disposable local cache. Durable review evidence must
    be copied or summarized under docs/context/evidence, a release artifact, or
    an external artifact pointer with checksums.

answerability:
  schema_version: research_answerability.v1
  question:
    research_question: Can the declared planner rows be compared on this frozen example suite?
    bounded_claim: The manifest shape is executable as a diagnostic packet only.
    decision_vocabulary:
      - continue
      - stop
      - inconclusive
      - invalid
    negative_result_meaning: A dry-run packet cannot establish planner performance or a null effect.
  estimand:
    primary: Per-planner scenario-seed metric values with explicit denominators.
    reference_or_null: No reference arm is declared for this manifest example.
    decision_predicates: A diagnostic packet is never a decision-capable campaign result.
    minimally_important_effect: Not required for a manifest-shape diagnostic.
  producers:
    - field: success_rate
      producer: research_campaign_manifest._build_rows
      source: scripts/validation/run_research_campaign_manifest.py
      unit: proportion
      direction: higher_is_better
      denominator: planner_scenario_seed
      pairing_key: scenario_id_planner_id_seed
      missingness_rule: Preserve null when no executed value exists.
      status: available
      execution_mode: native
      required: true
    - field: collision_rate
      producer: research_campaign_manifest._build_rows
      source: scripts/validation/run_research_campaign_manifest.py
      unit: proportion
      direction: lower_is_better
      denominator: planner_scenario_seed
      pairing_key: scenario_id_planner_id_seed
      missingness_rule: Preserve null when no executed value exists.
      status: available
      execution_mode: native
      required: true
    - field: min_clearance_m
      producer: research_campaign_manifest._build_rows
      source: scripts/validation/run_research_campaign_manifest.py
      unit: metres
      direction: higher_is_better
      denominator: planner_scenario_seed
      pairing_key: scenario_id_planner_id_seed
      missingness_rule: Preserve null when no executed value exists.
      status: available
      execution_mode: native
      required: true
    - field: timeout_rate
      producer: research_campaign_manifest._build_rows
      source: scripts/validation/run_research_campaign_manifest.py
      unit: proportion
      direction: lower_is_better
      denominator: planner_scenario_seed
      pairing_key: scenario_id_planner_id_seed
      missingness_rule: Preserve null when no executed value exists.
      status: available
      execution_mode: native
      required: true
  analysis:
    analysis_unit: planner_scenario_seed
    resampling_unit: fixed_suite
    command: uv run python scripts/validation/run_research_campaign_manifest.py
    multiplicity: No inferential comparison is made by the example packet.
    sensitivity_plan: Keep fallback, degraded, unavailable, and null values visible.
    dry_run_status: passed
    comparability_status: passed
  design:
    mode: diagnostic
    power_status: not_required
    budget: Four planner-scenario-seed dry-run rows.
    sample_size: Four generated rows; no decision-capable effect claim.
  artifacts:
    raw_owner: Campaign runner output owner.
    durable_path: docs/context/evidence/issue_3062_campaign_manifest_example/README.md
    checksums:
      - manifest_resolved.json
      - summary.json
    durability_status: planned
    incomplete_policy: Interrupted or unavailable outputs remain explicit and cannot be promoted.
  proof_surfaces:
    producer:
      status: not_run
      required: true
    preregistration:
      status: unavailable
      required: false
      unavailable_reason: This manifest is a shape-only example without a preregistration file.
    evidence_contract:
      status: unavailable
      required: false
      unavailable_reason: No evidence-contract id is declared by this example.
    analysis:
      status: not_run
      required: true
    artifact:
      status: unavailable
      required: false
      unavailable_reason: The example plans durable evidence but does not ship a catalog.
    result_packet:
      status: unavailable
      required: false
      unavailable_reason: No generic result-interpretation validator is available for this example.

validation:
  commands:
    - uv run pytest tests/benchmark/test_research_campaign_manifest_contract.py
  answerability_proof:
    producer:
      kind: manifest_rows
    analysis:
      kind: command
      command:
        - uv
        - run
        - pytest
        - tests/benchmark/test_research_campaign_manifest_contract.py
        - -q
  dry_run: not_required_for_example
  expected_result: Manifest loads and required contract fields are present.
