# Dynamic risk-aware MPPI with corridor passing and yielding at crossings.
allow_testing_algorithms: true
horizon_steps: 20
rollout_dt: 0.2
sample_count: 400
risk_threshold: 0.05
robot_radius_m: 1.0
max_linear_speed: 1.5
max_angular_speed: 1.0
reference_speed: 1.5
linear_noise_std: 0.8
angular_noise_std: 0.75
tracking_weight: 2.0
lateral_weight: 0.5
speed_weight: 1.0
rotation_weight: 0.15
risk_soft_weight: 10.0
risk_hard_weight: 40.0
random_seed: 1031
corridor_passing: true
crossing_yield: true
