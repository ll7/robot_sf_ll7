decision_summary: >-
  Fourteen evidence files merged after the 2026-07-11 baseline introduced 52 findings across
  eight codes. Every introduced code is already in the strict-CI exclusion policy, so no active
  strict-linter finding was introduced (strict mode remains at zero active findings). Each file
  was reviewed against its source to decide remediate-vs-baseline. All fourteen use the same
  legacy-debt pattern as the original 359 findings: artifact provenance gaps
  (external/private/untracked artifacts, ambiguous bare filenames) and campaign provenance gaps
  (dangling historical commits, missing producing config). None is trivially remediable without
  recovering external or historical provenance (durable remote commits, committed large
  artifacts, or external private locations), which is out of scope for this refresh and explicitly
  out of scope for Issue #5972 (deleting artifacts and suppressing new findings globally are
  excluded; this is a targeted, reviewed baseline inclusion, not a global suppression).
  Accordingly each file is dispositioned baseline below. A future maintainer who backfills
  provenance for any of these files should refresh the baseline with --write-baseline to lock in
  the reduction.
  Review addendum (issue #5983): campaign-level aggregation for
  `issue4206_trace_capable_h600_rerun_20260704` had attributed the unresolved producer commit
  62e08add1c2a5a750a6fd68a823319280c2dccd6 (an orphaned squash fragment, no longer reachable)
  from the issue #4891 and remaining issue #4848 exemplar records to the canonical Issue #4848
  metadata path. It was recorded below as a reviewed baseline increase pending provenance repair.
  Repair addendum (issue #5986): the dangling producer provenance across the whole shared
  campaign has been repaired by recording the unavailable original-generation provenance in every
  #4848 and #4891 exemplar `metadata.json`, `trace_series.json`, and `README.md`. The reachable
  origin/main integration commit 0b0214ced856eac77fa9a4c15b02921eabab1661 (squash-merge of PR
  #4938) is recorded separately as `published_integration_commit`, a pointer to the published
  exporter source; it is not asserted to be the generation commit. This completes the repair PR
  #5383 started (it fixed one metadata.json and README but left trace_series.json and the other
  bundles on the orphaned commit, which kept the campaign-level finding alive). The per-file
  SHA256SUMS were refreshed for every changed file. The baseline was refreshed with --write-baseline,
  dropping the #4848 canonical-path `dangling_commit` from 1 to 0 (total 415 -> 414); the
  corresponding reviewed baseline increase entry is removed below. The orphaned 62e08add commit
  remains unavailable and was not recovered or substituted as generation provenance. The three
  remaining findings on the canonical #4848 path
  (duplicate_campaign_id, missing_config_path, missing_config_sha256) are separate campaign
  provenance concerns outside issue #5986's dangling-commit scope and remain tracked here.
  Reconciliation addendum (issue #6109): the #5164 recovery merged exact historical campaign
  summaries for jobs 13268 and 13273. Their declared producer commit
  56b245132ea104ee8a621ddf65b8a3dd85028ed2 is absent from the full local history and from the
  GitHub commit API. Replacing it in the byte-preserved source reports would falsify provenance,
  so the two campaign-level dangling_commit increases are explicitly baselined below. In the
  same repair, all eight source-report hashes in h600_source_reports_recovery.json were bound to
  their tracked, byte-matching artifact paths instead of baselining the fixable
  hash_without_artifact_path findings. Regenerating the baseline also locks in six resolved
  uncommitted-artifact findings from h600_source_reports_manifest.json, reducing the baseline
  from 414 findings across 87 files to 410 findings across 86 files.
  Package A addendum (issue #6156 / PR #6423): the consolidated diagnostic bundle committed the
  thirteen artifact-manifest paths that had previously been recorded as untracked, resolving all
  thirteen uncommitted_artifact_missing_location findings on artifact_manifest.yaml. Regenerating
  the baseline locks in that reduction from 410 to 397 findings across the same 86 files. The
  source episode store remains external under private-campaign://, so its single
  hash_without_artifact_path finding remains explicitly baselined below. This reconciliation
  changes provenance bookkeeping only; the bundle remains diagnostic-only and both reported
  analyses remain not_identifiable.
  Main-repair addendum (issue #6695): PR #6733 merged the issue #6412 visualization-only
  re-export compact package under issue_6412_real_reexport_package/ without refreshing the
  ratchet baseline, reddening main fast-feedback CI on the clean-main drift guard. The three
  new files introduce 18 findings across codes already in the strict-CI exclusion policy
  (1 artifact_hash_mismatch, 11 uncommitted_artifact_missing_location,
  6 hash_without_artifact_path); the strict gate keeps zero active findings. The package is a
  compact visualization-only export (schema issue_6412_compact_evidence.v1,
  raw_and_normalized_traces_in_git: false, human_evidence_owner_review: pending) that
  deliberately records hashes for raw/figure artifacts kept out of git, and its bare
  package-relative paths resolve repo-root-relative under the generic linter, so its tracked
  byte-matching sibling files do not bind. Schema-aware path binding or explicit location
  markers are #6412 owner-review provenance backfill, not a safe rewrite inside a CI unbreak
  repair, so all three files are dispositioned baseline below and the baseline grows from 397
  findings across 86 files to 415 findings across 89 files. A future backfill that binds these
  artifacts should refresh the baseline with --write-baseline to lock in the reduction.
  S10 squash-history addendum (issue #6776): the nominal and stress metadata-only preflight
  packets from #6095 reference the real producing commit d791c08f, which is unreachable from
  main after the #6106 squash merge. The four resulting dangling_commit/config_missing_at_commit
  findings are explicitly baselined below; the source packets and producer SHA are preserved.
  Chapter 7 portfolio addendum (issue #7047): the Chapter 7 release-cell package remains
  byte-frozen under issue_6792_ch7_evidence_package_v1, but the external portfolio input is now
  bound by docs/context/evidence/issue_7047_ch7_portfolio_companion_binding.v1.json to the tracked
  source config configs/analysis/ch7_worked_example_portfolio.v1.yaml at SHA-256
  2fe0723bbb67eb18d25944b6933575b7c7b5a31836062c0bd56540fe4e3923ec. The linter validates the
  companion fail-closed against exact document paths, JSON pointers, document digests, target path,
  target tracking state, and target digest, then resolves only the two exact #7047 findings. The
  baseline is refreshed from 421 findings across 93 files to 419 findings across 91 files while
  preserving the package bytes and without changing the release-cell-only claim boundary.
  Chapter 7 v2 package addendum (issue #7322): the deterministic collision-excluded projection is
  tracked under issue_7322_ch7_evidence_package_v2 with a public custody note and exact source,
  portfolio, registry-reference, manifest, and SHA256SUMS digests. Its versioned manifest and
  source-verification view carry two package-relative config provenance hashes that the generic
  linter cannot bind because it intentionally excludes `configs/` paths from artifact resolution.
  The package schema and frozen generated bytes are not rewritten to satisfy a generic linter
  heuristic; both findings are explicitly dispositioned below and the refreshed baseline grows
  from 419 findings across 91 files to 421 findings across 93 files. The package remains
  blocked_pending_domain_approval / not_admitted and is not paper-facing evidence.
  Mechanism-atlas addendum (issue #7046): the repaired #7032 atlas replaces free-form identity
  strings with structured path, full-commit, and digest records. The generic evidence linter
  intentionally does not treat `configs/...` paths as artifact bindings, and the diagnostic
  dataset digest refers to worktree-local output with no durable artifact path. The atlas validator
  independently verifies config bytes, local commits, and source-manifest binding, so these four
  per-file `hash_without_artifact_path` findings are retained as explicit, diagnostic-only
  baseline debt for both the checked-in input and deterministic generated atlas.
  Current-main reconciliation (issue #7634): the committed baseline already contains the
  historical #7410 build receipt's one `artifact_hash_mismatch` finding, but its human companion
  entry was dropped during a later baseline refresh. The receipt and adjacent review sidecar are
  byte-stable and the recorded artifact hash matches; the generic linter resolves an embedded
  verifier hash against the current source after a later builder refresh. Restore the explicit
  baseline disposition without rewriting the frozen receipt or promoting any evidence claim.
  Receipt addendum (issue #8567; 2026-09-08): the compact diagnostic-only native counterfactual
  producer receipt adds one tracked evidence file. Its configuration identities use the registry's
  explicit `config_sha256` field, while raw smoke row and trace digests remain bound by the receipt's
  worktree-local output statement. The new file was reviewed as non-claim instrumentation proof.
  The current-main ratchet also identifies two historical provenance findings in the receipt:
  `config_missing_at_commit` and `dangling_commit`, because its preserved implementation head is
  not reachable after squash integration and the current-head linter has no head-reachable commit
  through which to resolve the declared config. The producer commit and config are real and the
  declared digest matches at that retained revision. Those bytes and producer identities must not
  be rewritten; both findings are explicitly baselined, increasing the reviewed machine baseline
  from 429 to 431 findings across 96 files.
  Source-bound fixture addendum (issue #8566; 2026-09-10): the diagnostic-only report records
  exact SHA-256 identities for tracked config/release metadata and its self-describing report
  digest. The generic evidence linter intentionally does not bind `configs/...` paths as artifact
  paths and cannot bind the report's self-digest without treating the report as its own payload.
  The packet's validator and SHA256SUMS receipt verify those bytes and retain the explicit
  no-campaign/no-claim boundary, so the five `hash_without_artifact_path` findings are baselined
  as reviewed provenance bookkeeping rather than rewritten into a weaker schema.
  Worked-example trace addendum (issue #9431; 2026-09-23): the diagnostic-only 18-episode trace
  bundle preserves its exact 0.0.7 release-tag identity and the exporter revision used to produce
  the compact examples. The generic linter extracts their embedded/full SHA-1 values from the
  campaign provenance document and requires ancestry from frozen main `5426a585...`; the release
  candidate commit `07f7e8d43084de748915e1b1eb8b2a1603357c6e` and pre-squash exporter commit
  `f39bbcc7d49026c490d5cbda8bb1bdcfb18f8233` are outside that ancestry. Both objects and their
  roles are verified, while runtime `source_commit` `2e87f9de0523ef977bce19b40189ea0a74c61e13`
  is reachable from frozen main. Replacing these exact provenance coordinates with a later
  integration SHA or shortening the release-tag identity would misstate the producer record.
  Preserve the diagnostic-only claim boundary and the separately disclosed startup/admission
  receipt exception; no benchmark, statistical, or causal claim is promoted. This targeted
  provenance disposition refreshes the machine baseline from 436 findings across 97 files to 438
  across 98 files, and records the 40-file evidence-tree addition: 38 diagnostic trace files plus
  two SHA-bound `evidence-review-marker.v1` sidecars. The sidecars bind the root README and
  campaign provenance bytes without modifying either artifact.
  Replay-gallery addendum (issue #9647; 2026-09-25): the current strict-gate demo records one
  selected #1501 compatibility row, one changed-revision outcome replay, and three tracked figures.
  Its complete `scenario_cert.v1` certificate was generated post-hoc from tracked static route
  inputs; dynamic task feasibility remains unknown. Two earlier smoke receipts are retained as
  pre-strict run history. The exact old fixture manifest bytes are preserved as
  `manifest.pre_strict_gate.json`, so the historical receipt hash remains bound without implying
  current-gate acceptance. Explicit location markers distinguish ignored local replay outputs from
  the compact tracked bundle, resolving 23 prior missing-location findings. The seven-file demo
  bundle adds no current evidence-registry findings. The machine baseline drops from 461 findings
  across 102 files to 438 across 98 files; the result remains diagnostic plumbing evidence only.
  Issue #9656 evidence-tree addendum (2026-09-25): the checksum-pinned historical hard-case packet
  contributes five diagnostic packet paths under `issue_9656_hard_case_mining_2026-09-24/`:
  `checksums.sha256`, `evidence_bundle_manifest.json`, and payload
  `current_head_no_replay_manifest.json`, `report.md`, and `summary.json`. Five adjacent
  `evidence-review-marker.v1` sidecars bind those exact bytes without modifying the packet. An
  independent exact-head review at `5ab13d21f56ec6f2c3c3dd9312bc1e2ae5650eb1` verified the packet,
  sidecar digests, test-fixture writer exemption, and candidate/frozen-base report, and conditionally
  approved only the tree-manifest refresh after this companion update. Its separate catalog finding
  was repaired by registering all five sidecars in `docs/context/catalog.yaml` at
  `97a581a85fefae082922c20290ccdaed473b67c3`. The reviewed candidate adds five paths to the prior
  baseline tree (2428 files / `4159317c0c3ae61d519788cd1050e8a6f724322c37e8cc2446f4dd8b8809d5b6`
  to 2433 / `71237cccbc8e6fa3f14a8548a264d0eda3ac30b1b6e368bb72a8bef7d6675022`); from frozen base,
  the complete packet tree is 2423 files / `c5d2440137291b0eb83416894ba10dcd32aacc24a23946b7a67ef99b0c961222`
  to 2433. The evidence scan remains at 438 findings across 98 files with no new or increased
  per-code finding, and no #9656 path has a finding. Refresh the machine baseline only to bind this
  five-sidecar path-set change. The diagnostic-only historical claim boundary is preserved; no
  finding disposition or strict-CI exclusion is added.
  Prior-main reconciliation (2026-09-25): the source packet was merged onto frozen main
  `61c9db79ba9b37d0668c0a93a72bd9b89ad3405b`. Relative to that base, the only evidence-tree
  additions are the same five packet files and five SHA-bound sidecars listed above; there are no
  evidence-tree removals. The tree at that prior-main reconciliation was 2427 files /
  `2d0a52ac85a26ecedca6e4779c4e486acc999e8aef4d0f0ac88acf026ae1300c`; the merged candidate is
  2437 files / `105bdffc3c3a47967360ed41c7a43b4e4042cb42cc511cb50265095fc66d7347`. The three
  payload checksums and all five sidecar artifact paths, schema markers, and byte digests were
  verified. Candidate projection retains 438 findings across 98 files, with all 171 finding rows
  unchanged and no #9656 path finding. This refresh binds the merged path set only; it does not
  alter finding dispositions or strict-CI exclusions.
  Combined-main reconciliation (2026-09-27): base a0ba60cd contains the #9647 gallery evidence and already binds 2465 evidence-tree paths at SHA-256 7253f1cc2eb98da8e6ddd3acdab31c59efaf534968f782c69933c89232132dd0. This candidate retains those bytes and adds the five checksum-pinned #9656 packet files plus five exact-byte review sidecars, yielding 2475 paths at SHA-256 df403f7cc9982246fd776c1e13cef5fb1426575dddeb23ce9cd0db4c769b3f4f. The ratchet retains 438 findings across 98 files with no new or increased finding. The refresh binds the combined path inventory only; it introduces no new finding disposition or scientific claim.
