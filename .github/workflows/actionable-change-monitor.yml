name: RobotSF actionable-change monitor

# Keep one durable, delta-only alert surface for research and benchmark work.
# The workflow never merges, changes research state, or submits compute.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: actionable-change-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python
        with:
          migrate-artifacts: "false"

      - name: Run delta-only actionable-change monitor
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/tools/check_actionable_change_monitor.py
          --repo "${{ github.repository }}"
          --issue 6819
