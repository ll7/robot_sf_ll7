# Usage: uv run python scripts/training/train_ppo.py --config configs/training/ppo/expert_ppo_issue_576_br06_v10_predictive_foresight_success_priority_policy_analysis_select.yaml --log-level WARNING
# BR-06 v10 PPO retraining with compact predictor-derived foresight features
# and full policy analysis as the true best-checkpoint selector.
base_config: expert_ppo_issue_576_br06_predictive_sub_base.yaml
policy_id: ppo_expert_br06_v10_predictive_foresight_success_priority_policy_analysis_select
resume_model_id: ppo_expert_br06_v3_15m_all_maps_randomized_20260304T075200
num_envs: auto_throughput
worker_mode: subproc
env_overrides:
  predictive_foresight_model_id: predictive_proxy_selected_v2_full
  predictive_foresight_max_agents: 16
  predictive_foresight_horizon_steps: 8
env_factory_kwargs:
  reward_name: route_completion_v3
  reward_kwargs:
    weights:
      progress: 1.1
      living: -0.015
      collision: -15.0
      near_miss: -3.0
      ttc_risk: -2.8
      comfort: -0.5
      smoothness: -0.18
      timeout: -6.5
      stagnation: -2.0
      terminal_bonus: 20.0
convergence:
  plateau_window: 3000
evaluation:
  evaluation_episodes: 30
  hold_out_scenarios: []
  full_policy_analysis_on_new_best: true
  full_policy_analysis_videos: false
  step_schedule:
    - every_steps: 1000000
tracking:
  wandb:
    enabled: true
    project: robot_sf
    group: issue-576-br06-v10-predictive-foresight-policy-analysis-select
    job_type: expert-ppo-predictive-foresight-v10
    tags:
      - issue-576
      - br-06
      - ppo
      - predictive-foresight
      - success-priority-reward
      - v10
      - policy-analysis-select
      - route-completion-v3
      - randomized
