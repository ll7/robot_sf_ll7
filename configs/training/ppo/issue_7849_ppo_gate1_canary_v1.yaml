# Issue #7849 Gate-1 canary input. Seed 4014 is disjoint from all full-run
# training seeds. This is non-evidence implementation/infrastructure smoke.

scenario_config: ../../scenarios/sets/classic_cross_trap_subset.yaml
evaluation:
  scenario_config: ../../scenarios/sets/classic_cross_trap_subset.yaml
  evaluation_episodes: 3
  hold_out_scenarios: []
  randomize_seeds: false
  step_schedule:
    - every_steps: 1024

policy_id: ppo_issue_7849_gate1_canary_v1
seeds: [4014]
randomize_seeds: false
total_timesteps: 2048
ppo_hyperparams:
  learning_rate: 0.0001
  n_steps: 128
  batch_size: 64
  n_epochs: 2
  gamma: 0.99
  gae_lambda: 0.95
best_checkpoint_metric: success_rate
convergence:
  success_rate: 0.8
  collision_rate: 0.1
  plateau_window: 512
env_overrides:
  observation_mode: default_gym
env_factory_kwargs:
  reward_name: route_completion_v2
policy_net_arch: [64, 64]
num_envs: 1
worker_mode: dummy
tracking:
  tensorboard: false
