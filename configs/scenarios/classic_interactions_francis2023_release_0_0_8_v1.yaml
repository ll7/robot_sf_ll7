    # h1 still starts behind at x=1.5 and walks at 0.8 m/s. A slower robot makes
    # the pedestrian overtake rather than lose ground; 600 steps covers the
    # unchanged 34 m robot trip at the 0.7 m/s cap plus acceleration/interaction.
    # OVTFIX2: h1 finishes at (31,9), away from the final robot approach.
    # Its eastward desired speed is 0.797 m/s, still above the 0.7 m/s robot cap.
    map_id: null
    map_file: ../../maps/successor_svg_maps/issue_10063_francis2023_ped_overtaking_safe_spawn_v1.svg
    robot_config:
      max_linear_speed: 0.7
    simulation_config:
