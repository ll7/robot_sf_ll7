# Issue-791 reward curriculum 10M long-horizon promotion run.
# Uses the v2 schedule fix (until_episodes=100) from the 128k gate experiment.
# 22 parallel envs, 24 CPU threads, evaluated every 512k steps.
# Wall-time is cluster-limited; resume with resume_model_id if the job is resubmitted.
base_config: expert_ppo_issue_791_reward_curriculum_promotion_10m_env22_base.yaml
policy_id: ppo_expert_issue_791_reward_curriculum_promotion_10m_env22
scenario_config: ../../../scenarios/classic_interactions_francis2023.yaml
num_envs: 22
total_timesteps: 10000000
scenario_sampling:
  strategy: random
  profile_strategy: cycle
  weights:
    classic_cross_trap_medium: 3.0
    classic_cross_trap_high: 4.0
    classic_doorway_low: 3.0
    classic_doorway_high: 4.0
    classic_bottleneck_medium: 3.0
    classic_bottleneck_high: 3.5
    classic_realworld_double_bottleneck_high: 4.0
    classic_group_crossing_medium: 2.5
    classic_group_crossing_high: 3.0
    classic_merging_medium: 2.5
    classic_overtaking_medium: 2.5
    classic_head_on_corridor_medium: 2.0
    classic_t_intersection_medium: 2.0
evaluation:
  step_schedule:
    - every_steps: 524288
tracking:
  wandb:
    job_type: expert-ppo-10m-promotion-env22
    tags:
      - issue-791
      - reward-curriculum
      - ppo
      - promotion-10m-env22
      - schedule-fix-v2
