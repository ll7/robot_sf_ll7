# Machine-readable frozen promotion contract for the issue #5303 adversarial v1 search.
#
# Plain-language summary: this freezes (before any new outcomes are generated) one
# executable, falsifiable contract that asks whether the existing Optuna/TPE search
# finds more fully certified, independently confirmed weak points than the existing
# random search for scenario_adaptive_hybrid_orca_v2_collision_guard on the held-out
# classic_group_crossing_medium family, under a matched candidate and simulator-time
# budget. TPE = Tree-structured Parzen Estimator (the existing Optuna sampler).
#
# This file is the frozen source of truth. Its SHA-256 is recorded in the side-effect-free
# preregistration manifest (docs/context/evidence/issue_5303_search_promotion_preregistration/)
# and is recomputed by robot_sf/benchmark/issue_5303_search_promotion_preflight.py at every
# check. Any field change is a contract change and requires re-preregistration before any
# step-3 outcome is generated.
schema_version: issue_5303_search_promotion_contract.v1
issue: 5303
parent_issue: 5303
step: 2
task_id: issue-5303-step-2-search-promotion-preregistration
frozen_on: "2026-07-24"
evidence_boundary: proposal_preflight_only
# What this preregistration does NOT establish. A positive step-3 result would support only
# the narrow target/family/budget statement in claim_under_test; it never supports transfer,
# minimax ranking, or paper-facing claims.
not_a_claim_of:
  - tpe_superiority_established
  - cross_planner_transfer
  - minimax_or_portfolio_ranking
  - paper_or_dissertation_or_benchmark_wide_claim

claim_under_test: >
  Under a frozen family-disjoint design and matched candidate (64 per search seed per
  method) and simulator-time budgets, the existing Optuna/TPE search yields more fully
  certified and independently confirmed weak points than the existing random search for
  scenario_adaptive_hybrid_orca_v2_collision_guard on the held-out classic_group_crossing_medium
  family, using exactly three search seeds per method and a constraints-first objective
  ordering (collision/severe intrusion, then liveness/goal completion, then comfort/efficiency).

