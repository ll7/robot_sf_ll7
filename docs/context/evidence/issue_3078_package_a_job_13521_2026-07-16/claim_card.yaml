# final diagnostic classification for real-data diagnostics that are both
# not_identifiable; it is not benchmark evidence and not paper-facing.
schema_version: package-a-transfer-claim-card.v1
issue: 3078
claim_status: reviewed
classification: diagnostic
evidence_tier: diagnostic
decision_packet_classification: diagnostic
