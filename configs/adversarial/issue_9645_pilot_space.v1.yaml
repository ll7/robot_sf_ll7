# Re-seeded after the issue #9645 pilot ran: scenario_seed is the dev seed 1001 for any
# future run. The pilot itself ran with scenario_seed 123, a held-out evaluation seed
# (111-140). Its exact input is the byte-identical, hash-pinned copy at
# payload/inputs/issue_9645_pilot_space.v1.yaml inside the issue #9645 evidence bundle
# under docs/context/evidence/. Do not cite that bundle from tuning, calibration or
# campaign configs; its outputs are quarantined.
schema_version: adversarial-search-space.v1
description: >-
  Issue #9645 paired Random/TPE pilot derived from the crossing/TTC source bounds.
  Only candidate-effective dimensions vary; pedestrian timing controls are omitted
  because the crossing template has no bound pedestrian ID. The lower start/goal
  bounds are clipped to 2.5 m after the original 1.0/2.0 m search bounds produced
  an obstacle-inflated start. The simulator scenario seed is fixed to 123 so sampler
  proposal seeds do not change the environment.
variables:
  start_x:
    min: 2.5
    max: 3.0
  start_y:
    min: 2.5
    max: 4.0
  goal_x:
    min: 7.0
    max: 9.0
  goal_y:
    min: 2.5
    max: 4.0
  pedestrian_speed_mps:
    min: 0.8
    max: 1.4
  scenario_seed:
    min: 1001
    max: 1001
constraints:
  min_start_goal_distance_m: 2.0
