schema_version: experiment-record.v1
experiment_id: issue_6951_progress_shaped_ablation
issue: 6951
issue_url: https://github.com/ll7/robot_sf_ll7/issues/6951
parent_experiment: 1475
parent_status: parked
question: >
  Can a progress-shaped expert-action NLL objective produce a bounded,
  configurable ablation between uniform (Arm A) and progress-weighted
  (Arm B) behavioral cloning on ORCA-residual trajectories?
hypothesis: >
  Arm A (uniform weights) reproduces ordinary mean expert-action NLL.
  Arm B (signed progress from remaining-route-length reduction,
  normalized and clipped to strictly positive bounds) weights
  transition samples proportional to their contribution to route
  progress while preserving stalled/regressing samples.
config:
  - configs/training/orca_residual/issue_6951_arm_a_progress_weighted_bc.yaml
  - configs/training/orca_residual/issue_6951_arm_b_progress_weighted_bc.yaml
command: |
  # No execution authorized. This is a no-launch experiment record.
  # Seeds 111/112/113 are preregistered only.
  #
  # When execution is authorized, run:
  #   uv run python scripts/training/pretrain_from_expert.py \
  #     --config configs/training/orca_residual/issue_6951_arm_a_progress_weighted_bc.yaml
  #   uv run python scripts/training/pretrain_from_expert.py \
  #     --config configs/training/orca_residual/issue_6951_arm_b_progress_weighted_bc.yaml
  #
  # Validation only (no training):
  #   uv run python -m pytest tests/training/test_progress_weighted_bc.py -v
inputs:
  - path: configs/training/orca_residual/issue_6951_arm_a_progress_weighted_bc.yaml
  - path: configs/training/orca_residual/issue_6951_arm_b_progress_weighted_bc.yaml
  - path: robot_sf/training/progress_weighted_bc.py
outputs:
  - path: output/reports/imitation/runs/issue_6951_arm_a_progress_weighted_bc_no_launch.json
    durable_reference: null
    evidence_role: no-launch placeholder
  - path: output/reports/imitation/runs/issue_6951_arm_b_progress_weighted_bc_no_launch.json
    durable_reference: null
    evidence_role: no-launch placeholder
expected_artifacts:
  - name: arm_a_policy_checkpoint
    path: model/issue_6951_arm_a_progress_weighted_bc_policy.zip
    durable_reference_required: false
    note: no-launch; placeholder only
  - name: arm_b_policy_checkpoint
    path: model/issue_6951_arm_b_progress_weighted_bc_policy.zip
    durable_reference_required: false
    note: no-launch; placeholder only
  - name: arm_a_manifest
    path: output/reports/imitation/runs/issue_6951_arm_a_progress_weighted_bc_no_launch.json
    durable_reference_required: false
  - name: arm_b_manifest
    path: output/reports/imitation/runs/issue_6951_arm_b_progress_weighted_bc_no_launch.json
    durable_reference_required: false
execution_boundary:
  submit_slurm_from_this_issue: false
  no_launch_experiment: true
  preregistered_seeds: [111, 112, 113]
  preregistered_scenario: planner_sanity_simple
evidence_grade: proposal
paper_relevance: exploratory
status: no_launch
notes: >
  This is a no-launch experiment record for issue #6951. No SLURM, training,
  or benchmark evidence execution is authorized. Seeds 111/112/113 and
  planner_sanity_simple are preregistered only. Issue #1475 is parked and
  not affected by this experiment. Arm A uses the same objective/loss code
  path with uniform transition weights (equivalent to ordinary mean
  expert-action NLL). Arm B derives signed progress only from reduction
  in explicitly recorded remaining route length, normalized by declared
  scale, with strictly positive clipped weights.
