repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version. Keep in sync with `ruff` in pyproject.toml `[tool.ruff]`
    # required-version and the dev dependency pin; a mismatch fails the hook with
    # "Required version does not match the running version".
    rev: v0.16.1
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(docs/|specs/|\.understand-anything/|maps/svg_maps/|fast-pysf/tests/test_maps/)
      - id: end-of-file-fixer
        exclude: ^(docs/|specs/|\.understand-anything/|maps/svg_maps/|fast-pysf/tests/test_maps/)
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: local
    hooks:
      - id: prevent-schema-duplicates
        name: Prevent Schema Duplicates
        entry: uv run python hooks/prevent_schema_duplicates.py
        language: system
        files: \.schema\.v[0-9]+\.json$
        pass_filenames: true
      - id: check-config-abs-paths
        name: Check Configs And Evidence For Absolute Home-Dir Paths
        entry: uv run python hooks/check_config_abs_paths.py
        language: system
        files: ^(configs/.*\.(ya?ml|json|toml|cfg|ini)|docs/context/evidence/.*\.(json|jsonl|md|csv|ya?ml|txt))$
        pass_filenames: true
      - id: check-config-provenance
        name: Check Training Config Issue Provenance
        entry: uv run python hooks/check_config_provenance.py
        language: system
        files: ^configs/training/.*\.ya?ml$
        pass_filenames: true
      - id: check-release-assurance-hashes
        name: Check Release Assurance Hashes
        entry: uv run python hooks/check_release_assurance_hashes.py
        language: system
        files: ^(docs/RELEASE\.md|CITATION\.cff|docs/context/evidence/issue_4683_release_assurance_case_example\.json)$
        pass_filenames: false
      - id: check-ruff-version-parity
        name: Check Ruff Version Parity
        entry: uv run python scripts/dev/check_ruff_version_parity.py
        language: system
        files: ^(\.pre-commit-config\.yaml|pyproject\.toml|scripts/dev/check_ruff_version_parity\.py)$
        pass_filenames: false
      - id: no-fstring-logger
        name: No f-string logger.*() calls (loguru structured-style guard)
        entry: uv run python hooks/no_fstring_logger.py
        language: system
        # ruff G004 cannot see loguru; this hook flags logger.<method>(f"...")
        # calls and is ratcheted via hooks/no_fstring_logger_allowlist.txt.
        # Run a full scan when either source or the guard/baseline changes. Passing only
        # staged filenames would let baseline-only edits bypass repository-wide validation.
        files: ^(robot_sf/.*\.py|hooks/no_fstring_logger(?:_allowlist\.txt|\.py))$
        pass_filenames: false
      - id: ty-advisory-typecheck
        name: Ty Advisory Type Check
        # Advisory pre-commit mirror of CI's typecheck phase (scripts/dev/ci_driver.sh).
        # Keep the ty pin in sync with that phase; --exit-zero surfaces pre-existing
        # ty findings without blocking routine commits. The whole-repo downward
        # ratchet still runs in CI via scripts/dev/ty_advisory_ratchet.py.
        entry: uvx ty@0.0.58 check --exit-zero
        language: system
        files: \.py$
        pass_filenames: true
