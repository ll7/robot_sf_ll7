name: Strip closed state labels

# Closed issues should not keep live routing labels (state:ready / state:running /
# state:blocked) — they pollute queue reads. This Action runs at the single choke point of
# issue closure (manual, duplicate/wontfix, or PR-merge all emit `issues: closed`) and removes
# only the documented live state labels from the just-closed issue. It is a no-op when none are
# present. The periodic detector (scripts/dev/closed_state_label_hygiene.py) remains the backstop.

on:
  issues:
    types: [closed]

permissions:
  issues: write

concurrency:
  group: strip-state-labels-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  strip-state-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove live state labels from the closed issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          # Single source of truth: derive the live state-label set from the detector module
          # (scripts/dev/closed_state_label_hygiene.py::LIVE_STATE_LABELS) so this Action and the
          # CLI never drift. No second hard-coded label list lives here.
          if ! live_labels_output=$(
            python -c '
          import sys

          sys.path.insert(0, "scripts/dev")
          import closed_state_label_hygiene as h

          labels = h.LIVE_STATE_LABELS
          if not isinstance(labels, (tuple, list)) or not labels:
              raise SystemExit("live state-label allowlist must be a non-empty list")
          if any(
              type(label) is not str or not label.strip() or not label.isprintable()
              for label in labels
          ):
              raise SystemExit(
                  "live state-label allowlist must contain non-empty printable strings"
              )
          if len(set(labels)) != len(labels):
              raise SystemExit("live state-label allowlist must contain distinct labels")
          print("\n".join(labels))
          '
          ); then
            echo "Unable to load the live state-label allowlist; refusing cleanup." >&2
            exit 1
          fi
          if ! python -c '
          import sys

          labels_output = sys.stdin.read()
          labels = labels_output.splitlines()
          if not labels or any(not label.strip() or not label.isprintable() for label in labels):
              raise SystemExit("allowlist output must contain non-empty printable labels")
          if len(set(labels)) != len(labels):
              raise SystemExit("allowlist output must contain distinct labels")
          ' <<<"$live_labels_output"; then
            echo "The live state-label allowlist output is malformed; refusing cleanup." >&2
            exit 1
          fi
          LIVE_LABELS=()
          if [ -n "$live_labels_output" ]; then
            mapfile -t LIVE_LABELS <<<"$live_labels_output"
          fi
          echo "Live state labels: ${LIVE_LABELS[*]}"

          # Read-then-write (defense-in-depth): the trigger already implies the issue is closed,
          # but re-confirm the closed issue identity through the REST issue reader before any
          # label write.
          if ! issue_payload=$(
            python -m scripts.dev.gh_issue_rest view "$ISSUE_NUMBER" --repo "$REPO" --json number state url is_pull_request
          ); then
            echo "REST issue read failed; refusing cleanup." >&2
            exit 1
          fi
          if ! issue_identity=$(
            python -c '
          import json
          import sys

          from scripts.dev.gh_issue_rest import validate_issue_identity

          payload = json.load(sys.stdin)
          validate_issue_identity(
              payload,
              repo=sys.argv[1],
              number=int(sys.argv[2]),
          )
          print(payload["state"])
          print("true" if payload["is_pull_request"] else "false")
          print(payload["url"])
          ' "$REPO" "$ISSUE_NUMBER" <<<"$issue_payload"
          ); then
            echo "REST issue read returned malformed identity; refusing cleanup." >&2
            exit 1
          fi
          mapfile -t ISSUE_IDENTITY <<<"$issue_identity"
          if [ "${#ISSUE_IDENTITY[@]}" -ne 3 ]; then
            echo "REST issue identity had an unexpected field count; refusing cleanup." >&2
            exit 1
          fi
          state="${ISSUE_IDENTITY[0]}"
          is_pull_request="${ISSUE_IDENTITY[1]}"
          issue_url="${ISSUE_IDENTITY[2]}"
          echo "Issue #$ISSUE_NUMBER state: $state url: $issue_url"
          if [ "$state" != "CLOSED" ]; then
            echo "Issue #$ISSUE_NUMBER is not CLOSED ($state); skipping (no-op)."
            exit 0
          fi
          if [ "$is_pull_request" = "true" ]; then
            echo "Issue #$ISSUE_NUMBER has a pull request URL; skipping (no-op)."
            exit 0
          fi

          # Fetch the issue's current labels once through the verified REST helper, then remove
          # only the live state labels that are actually present. Guarding on presence keeps the
          # step a no-op when nothing is stale.
          if ! label_payload=$(python -m scripts.dev.gh_pr_label_rest list "$ISSUE_NUMBER" --repo "$REPO"); then
            echo "REST label inventory read failed; refusing cleanup." >&2
            exit 1
          fi
          if ! python -c '
          import json
          import sys

          from scripts.dev.gh_pr_label_rest import validate_result_envelope

          payload = json.load(sys.stdin)
          validate_result_envelope(
              payload,
              action="list",
              number=int(sys.argv[2]),
              repo=sys.argv[1],
          )
          ' "$REPO" "$ISSUE_NUMBER" <<<"$label_payload"; then
            echo "REST label inventory result was malformed; refusing cleanup." >&2
            exit 1
          fi
          current_label_names=$(
            python -c '
          import json
          import sys

          payload = json.load(sys.stdin)
          print("\n".join(payload["labels"]))
          ' <<<"$label_payload"
          )
          CURRENT_LABELS=()
          if [ -n "$current_label_names" ]; then
            mapfile -t CURRENT_LABELS <<<"$current_label_names"
          fi

          removed=0
          for label in "${LIVE_LABELS[@]}"; do
            for present in "${CURRENT_LABELS[@]:-}"; do
              if [ "$label" = "$present" ]; then
                echo "Removing stale label '$label' from issue #$ISSUE_NUMBER"
                if ! remove_payload=$(python -m scripts.dev.gh_pr_label_rest remove "$ISSUE_NUMBER" \
                  --repo "$REPO" --label "$label"); then
                  echo "REST label removal failed; refusing cleanup." >&2
                  exit 1
                fi
                if ! python -c '
          import json
          import sys

          from scripts.dev.gh_pr_label_rest import validate_result_envelope

          payload = json.load(sys.stdin)
          validate_result_envelope(
              payload,
              action="remove",
              number=int(sys.argv[2]),
              repo=sys.argv[1],
              label=sys.argv[3],
          )
          ' "$REPO" "$ISSUE_NUMBER" "$label" <<<"$remove_payload"; then
                  echo "REST label removal result was malformed; refusing cleanup." >&2
                  exit 1
                fi
                removed=$((removed + 1))
                break
              fi
            done
          done

          if [ "$removed" -eq 0 ]; then
            echo "No live state labels present on issue #$ISSUE_NUMBER; nothing to do."
          else
            echo "Removed $removed live state label(s) from issue #$ISSUE_NUMBER."
          fi
