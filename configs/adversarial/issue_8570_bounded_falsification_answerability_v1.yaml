      sha256: b82dce96beb16cedd53a0584981d1c5cc9d1a4bdac043b2a9e9168fcb058dec1
      role: frozen #7340 scenario-template bytes and actor binding
    map:
      path: maps/svg_maps/classic_station_platform.svg
      sha256: 5f03421ac3d16d6008e92e00634fa9f3d0c896304ffd204691d79a3a115be156
      role: map input referenced by the frozen #7340 scenario template
  search_space:
    input_id: search_space
    schema_version: adversarial-search-space.v1
    semantic:
      schema_version: adversarial-search-space.v1
      variables:
        start_x:
          min: 6.0
          max: 10.0
        start_y:
          min: 21.2
          max: 22.8
        goal_x:
          min: 18.0
          max: 26.0
        goal_y:
          min: 21.2
          max: 22.8
        spawn_time_s:
          min: 0.0
          max: 1.0
        pedestrian_speed_mps:
          min: 0.8
          max: 1.4
        pedestrian_delay_s:
          min: 0.0
          max: 1.0
