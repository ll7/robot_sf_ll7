name: PR Contract Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: pr-contract-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-contract-check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the default merge checkout for existing current-base checks.
          # The published software baseline must resolve by its immutable tag.
          fetch-depth: 0

      - name: Fetch base ref
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Refresh the moving base for current-base checks; immutable budget
          # measurement uses pull_request.base.sha separately below. Checkout
          # already hydrated history and tags for source-bound receipts.
          git fetch origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            || echo "::warning::Failed to fetch base ref '${BASE_REF}'; contract check will use authoritative added-files list"

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python
        with:
          install-system-packages: "false"
          migrate-artifacts: "false"
          sync-args: "--frozen"

      - name: Collect changed files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Routed through a shared retrying collector (issue #5918): a transient
          # GitHub API 502/503/504/429 (which arrives as an HTML body that gh can't
          # JSON-parse) is retried with backoff instead of red-ing this job before
          # contract validation runs. A persistent failure still fails closed.
          # The helper emits the authoritative ADDED list (status == "added") used
          # for evidence-hygiene "is new" decisions (issue #5464).
          uv run python scripts/ci/collect_pr_files.py \
            --repo "$REPO" --pr-number "$PR_NUMBER" \
            --out-changed-files "$RUNNER_TEMP/pr_changed_files.txt" \
            --out-files-status "$RUNNER_TEMP/pr_files_status.tsv" \
            --out-added-files "$RUNNER_TEMP/pr_added_files.txt"

      - name: Validate dependency update policy
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          uv run python scripts/dev/check_dependabot_update_policy.py \
            --base-ref "$BASE_REF" \
            --changed-files-file "$RUNNER_TEMP/pr_changed_files.txt" \
            --json

      - name: Enforce evaluation seed holdout
        run: |
          set -euo pipefail
          uv run python scripts/validation/check_seed_holdout_diff.py \
            --base-ref "origin/${{ github.base_ref }}"

      - name: Validate PR body contracts (advisory)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          uv run python scripts/dev/check_pr_followups.py \
            --github-event-path "$GITHUB_EVENT_PATH" \
            --changed-files-file "$RUNNER_TEMP/pr_changed_files.txt" \
            --require-body \
            --require-substantive-body \
            --require-open-issues \
            --advisory

      - name: Validate behaviour receipt with base policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEHAVIOUR_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Before first installation the gate is not active. Never substitute
          # PR-head policy for missing base policy, schema or owner inventory.
          git cat-file -e "$PR_BASE_SHA^{commit}"
          if ! git cat-file -e "$PR_BASE_SHA:scripts/ci/behaviour_receipt.py"; then
            echo "::notice::Behaviour receipt gate is not installed on the event base; activation follows installation"
            exit 0
          fi
          TRUSTED_GATE="$RUNNER_TEMP/behaviour-gate-base"
          git worktree add --detach "$TRUSTED_GATE" "$PR_BASE_SHA"
          PYTHONPATH="$TRUSTED_GATE:$TRUSTED_GATE/fast-pysf" UV_NO_SYNC=1 \
            uv run python "$TRUSTED_GATE/scripts/ci/behaviour_receipt.py" \
            --github-event-path "$GITHUB_EVENT_PATH" \
            --repo-root "$GITHUB_WORKSPACE" \
            --base-ref "$PR_BASE_SHA"

      - name: Run PR Contract Check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          uv run python scripts/ci/pr_contract_check.py \
            --github-event-path "$GITHUB_EVENT_PATH" \
            --changed-files-file "$RUNNER_TEMP/pr_changed_files.txt" \
            --added-files-file "$RUNNER_TEMP/pr_added_files.txt" \
            --base-ref "origin/${{ github.base_ref }}" \
            --budget-base-sha "$PR_BASE_SHA" \
            --post-comment
