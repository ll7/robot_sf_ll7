name: Apply issue 8134 patch

on:
  push:
    branches:
      - fix/8134-claimable-queue-fail-closed

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Apply bounded source and regression patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)


          source_path = Path("scripts/dev/snapshot_issue_batch.py")
          source = source_path.read_text(encoding="utf-8")
          source = replace_once(
              source,
              """    ``queue_completeness`` makes zero-work claims explicit: ``complete`` means the
              ready-candidate universe was fully scanned and every live admission succeeded;
              ``incomplete`` means the ready-candidate page was truncated or resumable; and
              """,
              """    ``queue_completeness`` makes zero-work claims explicit: ``complete`` means the
              ready-candidate universe was scanned from page one and every live admission and
              claim-state read succeeded; ``incomplete`` means the ready-candidate page was
              truncated, resumable, or started after page one; and
              """,
              "queue-completeness docstring",
          )
          source = replace_once(
              source,
              """    else:
                  truncation_note = ""
              return {
              """,
              """    else:
                  truncation_note = ""
              claimable_issues = [
                  issue
                  for issue in issues
                  if isinstance(issue.get("admission"), dict)
                  and issue["admission"].get("ok") is True
                  and issue["admission"].get("outcome") == "ready_check_only"
                  and issue.get("dispatch_allowed", True) is not False
              ]
              admission_results_complete = all(
                  isinstance(issue.get("admission"), dict)
                  and issue["admission"].get("outcome") != "error"
                  and issue["admission"].get("classification") != "error"
                  and issue["admission"].get("claim_outcome")
                  in {"unclaimed", "already_claimed"}
                  for issue in snapshots
              )
              if not admission_results_complete:
                  queue_completeness = "unavailable"
              elif resume_page > 1 or truncated:
                  queue_completeness = "incomplete"
              else:
                  queue_completeness = "complete"
              return {
              """,
              "queue calculations",
          )
          source = replace_once(
              source,
              '        "queue_completeness": "incomplete" if truncated else "complete",\n',
              '        "queue_completeness": queue_completeness,\n',
              "queue-completeness result",
          )
          source = replace_once(
              source,
              """        "claimable_issues": [
                      issue
                      for issue in issues
                      if isinstance(issue.get("admission"), dict)
                      and issue["admission"].get("ok") is True
                      and issue["admission"].get("outcome") == "ready_check_only"
                  ],
                  "claimable_count": sum(
                      1
                      for issue in issues
                      if isinstance(issue.get("admission"), dict)
                      and issue["admission"].get("ok") is True
                      and issue["admission"].get("outcome") == "ready_check_only"
                  ),
              """,
              """        "claimable_issues": claimable_issues,
                  "claimable_count": len(claimable_issues),
              """,
              "final claimable selection",
          )
          source = replace_once(
              source,
              """                    _admission_reason(issue["admission"])
                          for issue in snapshots
                          if isinstance(issue.get("admission"), dict)
              """,
              """                    (
                              str(issue.get("classification") or "blocked")
                              if issue.get("dispatch_allowed") is False
                              else _admission_reason(issue["admission"])
                          )
                          for issue in snapshots
                          if isinstance(issue.get("admission"), dict)
              """,
              "final admission reason",
          )
          source_path.write_text(source, encoding="utf-8")

          skill_path = Path(".agents/skills/goal-autopilot/SKILL.md")
          skill = skill_path.read_text(encoding="utf-8")
          skill = replace_once(
              skill,
              """    unavailable -> treat as no queue evidence; retry after quota/transport recovery
              ```

              The audit and queue snapshots must expose an admission-reason histogram.
              """,
              """    unavailable -> treat as no queue evidence; retry after quota/transport recovery
              ```

              `queue_completeness: complete` is authoritative only for a page-one ready-candidate
              scan with no remaining truncation or resume cursor and with usable canonical admission
              and atomic-claim results for every discovered row. A resumed final page, admission
              error, or unavailable claim read is never complete queue evidence.

              The audit and queue snapshots must expose an admission-reason histogram.
              """,
              "goal-autopilot queue authority",
          )
          skill_path.write_text(skill, encoding="utf-8")

          test_path = Path("tests/dev/test_snapshot_claimable_queue_fail_closed.py")
          test_path.write_text(
              '''"""Regression tests for fail-closed claimable-queue truth."""

              from __future__ import annotations

              import json
              from pathlib import Path
              from unittest.mock import patch

              import pytest

              from scripts.dev import goal_issue_admission, issue_implementability, snapshot_issue_batch


              def _claim_status(number: int, *, ok: bool = True) -> dict[str, object]:
                  """Return one compact claim-state fixture."""
                  return {
                      "ok": ok,
                      "claimed": False if ok else None,
                      "claim_ref": f"agent-claims/issue-{number}",
                      "sha": None,
                  }


              def _ready_issue(number: int) -> dict[str, object]:
                  """Return one state:ready candidate-list row."""
                  return {
                      "number": number,
                      "title": f"ready issue {number}",
                      "state": "OPEN",
                      "url": f"https://github.test/issues/{number}",
                      "labels": [{"name": issue_implementability.READY_LABEL}],
                      "assignees": [],
                  }


              def _listing(
                  rows: list[dict[str, object]],
                  *,
                  data_source: str = "graphql",
                  resume_cursor: dict[str, object] | None = None,
              ) -> dict[str, object]:
                  """Return one successful bounded listing fixture."""
                  return {
                      "status": "ok",
                      "listed": rows,
                      "error": "",
                      "data_source": data_source,
                      "rate_limit": {},
                      "quota": {},
                      "resume_cursor": resume_cursor,
                  }


              def _admission(number: int, *, ready: bool) -> dict[str, object]:
                  """Return one canonical live-admission wrapper fixture."""
                  claim = _claim_status(number)
                  preflight = {
                      "schema": "issue_implementability.v1",
                      "classification": "ready" if ready else "needs_spec",
                      "admission_reason": "claimable" if ready else "needs_spec",
                      "reasons": ["issue is ready" if ready else "missing contract section"],
                      "ready": ready,
                      "write_allowed": ready,
                      "claim": claim,
                  }
                  return {
                      "schema": goal_issue_admission.SCHEMA,
                      "ok": ready,
                      "outcome": "ready_check_only" if ready else "not_admitted",
                      "write_attempted": False,
                      "source_ref": goal_issue_admission.DEFAULT_SOURCE_REF,
                      "preflight": preflight,
                      "claim": claim,
                  }


              def test_resumed_final_page_is_not_global_complete() -> None:
                  """A standalone final resume page cannot prove the preceding pages were scanned."""
                  with patch(
                      "scripts.dev.snapshot_issue_batch._list_open_issues",
                      return_value=_listing([], data_source="rest"),
                  ):
                      payload = snapshot_issue_batch.snapshot_claimable_issues(
                          repo="ll7/robot_sf_ll7",
                          remote="origin",
                          body_limit=150,
                          limit=20,
                          resume_page=2,
                      )

                  assert payload["claimable_count"] == 0
                  assert payload["queue_completeness"] == "incomplete"


              def test_admission_error_makes_queue_unavailable() -> None:
                  """An admission exception must forbid a complete zero-work conclusion."""
                  number = 9001
                  with (
                      patch(
                          "scripts.dev.snapshot_issue_batch._list_open_issues",
                          return_value=_listing([_ready_issue(number)]),
                      ),
                      patch(
                          "scripts.dev.snapshot_issue_batch._batch_claim_statuses",
                          return_value={number: _claim_status(number)},
                      ),
                      patch(
                          "scripts.dev.snapshot_issue_batch.goal_issue_admission.admit_issue",
                          side_effect=RuntimeError("admission unavailable"),
                      ),
                  ):
                      payload = snapshot_issue_batch.snapshot_claimable_issues(
                          repo="ll7/robot_sf_ll7",
                          remote="origin",
                          body_limit=150,
                          limit=20,
                      )

                  assert payload["claimable_count"] == 0
                  assert payload["queue_completeness"] == "unavailable"
                  assert payload["admission_reason_histogram"] == {"error": 1}


              def test_unavailable_claim_read_makes_queue_unavailable() -> None:
                  """An unusable atomic-claim read must not become complete zero-work evidence."""
                  number = 9002
                  unavailable_claim = _claim_status(number, ok=False)
                  preflight = {
                      "schema": "issue_implementability.v1",
                      "classification": "needs_spec",
                      "admission_reason": "needs_spec",
                      "reasons": ["missing contract section"],
                      "ready": False,
                      "write_allowed": False,
                      "claim": unavailable_claim,
                  }
                  with (
                      patch(
                          "scripts.dev.snapshot_issue_batch._list_open_issues",
                          return_value=_listing([_ready_issue(number)]),
                      ),
                      patch(
                          "scripts.dev.snapshot_issue_batch._batch_claim_statuses",
                          return_value={number: unavailable_claim},
                      ),
                      patch(
                          "scripts.dev.snapshot_issue_batch.issue_implementability.evaluate_issue",
                          return_value=preflight,
                      ),
                  ):
                      payload = snapshot_issue_batch.snapshot_claimable_issues(
                          repo="ll7/robot_sf_ll7",
                          remote="origin",
                          body_limit=150,
                          limit=20,
                      )

                  assert payload["claimable_count"] == 0
                  assert payload["queue_completeness"] == "unavailable"


              def test_complete_nonclaimable_scan_can_prove_zero_work() -> None:
                  """A page-one, exhaustive, fully evaluated scan may remain complete."""
                  number = 9003
                  with (
                      patch(
                          "scripts.dev.snapshot_issue_batch._list_open_issues",
                          return_value=_listing([_ready_issue(number)]),
                      ),
                      patch(
                          "scripts.dev.snapshot_issue_batch._batch_claim_statuses",
                          return_value={number: _claim_status(number)},
                      ),
                      patch(
                          "scripts.dev.snapshot_issue_batch.goal_issue_admission.admit_issue",
                          return_value=_admission(number, ready=False),
                      ),
                  ):
                      payload = snapshot_issue_batch.snapshot_claimable_issues(
                          repo="ll7/robot_sf_ll7",
                          remote="origin",
                          body_limit=150,
                          limit=20,
                      )

                  assert payload["claimable_count"] == 0
                  assert payload["queue_completeness"] == "complete"


              @pytest.mark.parametrize(
                  ("status", "expected_reason"),
                  [
                      ("blocked_unchanged", "blocked_receipt"),
                      ("blocker_changed", "needs_re_evaluation"),
                      ("re_evaluate", "needs_re_evaluation"),
                  ],
              )
              def test_blocker_receipt_fences_final_claimable_selection(
                  tmp_path: Path, status: str, expected_reason: str
              ) -> None:
                  """A final blocker receipt must override an otherwise ready live admission."""
                  number = 9004
                  decision_path = tmp_path / "blocker-decision.json"
                  decision_path.write_text(
                      json.dumps(
                          {
                              "issue": number,
                              "status": status,
                              "reason": "external blocker decision",
                              "receipt_digest": "a" * 64,
                              "current_fingerprint": "b" * 64,
                          }
                      ),
                      encoding="utf-8",
                  )
                  with (
                      patch(
                          "scripts.dev.snapshot_issue_batch._list_open_issues",
                          return_value=_listing([_ready_issue(number)]),
                      ),
                      patch(
                          "scripts.dev.snapshot_issue_batch._batch_claim_statuses",
                          return_value={number: _claim_status(number)},
                      ),
                      patch(
                          "scripts.dev.snapshot_issue_batch.goal_issue_admission.admit_issue",
                          return_value=_admission(number, ready=True),
                      ),
                  ):
                      payload = snapshot_issue_batch.snapshot_claimable_issues(
                          repo="ll7/robot_sf_ll7",
                          remote="origin",
                          body_limit=150,
                          limit=20,
                          blocker_decision_paths=[str(decision_path)],
                      )

                  row = payload["issues"][0]
                  assert row["dispatch_allowed"] is False
                  assert row["classification"] == expected_reason
                  assert payload["claimable_issues"] == []
                  assert payload["claimable_count"] == 0
                  assert payload["admission_reason_histogram"] == {expected_reason: 1}
                  assert payload["queue_completeness"] == "complete"
              ''',
              encoding="utf-8",
          )
          PY

          python -m py_compile \
            scripts/dev/snapshot_issue_batch.py \
            tests/dev/test_snapshot_claimable_queue_fail_closed.py

      - name: Commit bounded patch
        shell: bash
        run: |
          rm .github/workflows/apply-8134.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(workflow): make claimable queue fully fail closed (#8134)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
