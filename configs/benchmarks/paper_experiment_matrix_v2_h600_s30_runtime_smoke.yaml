# Bounded runtime smoke for the approved S30/H600 benchmark-data release.
#
# This is intentionally derived from the 14-arm full campaign, not from the
# historical seven-planner/S3 smoke.  It exercises one representative scenario
# and one seed at the production horizon.  A passing smoke is execution
# evidence only; it is not full benchmark evidence and must not be used to rank
# planners or to make a Social Navigation Quality Index (SNQI) claim.
name: paper_experiment_matrix_v2_h600_s30_runtime_smoke
paper_facing: true
paper_profile_version: paper-matrix-v1
scenario_matrix: configs/scenarios/single/francis2023_blind_corner.yaml
comparability_mapping: configs/benchmarks/alyassi_comparability_map_v1.yaml
route_clearance_certifications: configs/benchmarks/route_clearance_certifications_v1.yaml

amv_profile:
  name: amv-paper-v1
  contract_version: "1"
  coverage_enforcement: warn
  required_dimensions:
    use_case: [delivery_robot, shared_space_micromobility]
    context: [sidewalk, shared_space]
    speed_regime: [walking_speed, scooter_speed]
    maneuver_type: [overtake, crossing, bottleneck]

seed_policy:
  mode: fixed-list
  seeds: [111]
  seed_sets_path: configs/benchmarks/seed_sets_v1.yaml

snqi_weights: configs/benchmarks/snqi_weights_camera_ready_v3.json
snqi_baseline: configs/benchmarks/snqi_baseline_camera_ready_v3.json
snqi_contract:
  enabled: true
  enforcement: warn
  rank_alignment_warn_threshold: 0.5
  rank_alignment_fail_threshold: 0.3
  outcome_separation_warn_threshold: 0.05
  outcome_separation_fail_threshold: 0.0
  max_component_dominance_warn_threshold: 0.24
  max_component_dominance_fail_threshold: 0.27
  calibration_seed: 123
  calibration_trials: 600

# Match the production process-pool width. Even with one scenario/seed, this
# exercises the fork boundary after per-arm CUDA cleanup instead of silently
# taking the serial path that missed the release failure.
workers: 32
horizon: 600
dt: 0.1
record_forces: true
checkpoint_provenance_enforcement: error
resume: false
stop_on_failure: true
bootstrap_samples: 100
bootstrap_confidence: 0.95
bootstrap_seed: 123

kinematics_matrix:
  - differential_drive

export_publication_bundle: false
include_videos_in_publication: false
overwrite_publication_bundle: false
repository_url: https://github.com/ll7/robot_sf_ll7
release_tag: paper-matrix-v2-h600-s30-runtime-smoke
doi: 10.5281/zenodo.<fresh-concept-required>
paper_interpretation_profile: runtime-smoke-advisory-no-ranking

# Compact provenance and claim-boundary metadata.  The campaign loader ignores
# these descriptive fields; release manifests and tests retain them for review.
release_kind: benchmark-data
release_status: runtime-smoke-only
derived_from:
  config: configs/benchmarks/paper_experiment_matrix_v2_h600_s30_benchmark_data_2026_08.yaml
  config_sha256: 31e3e4689d91ed540af0037b9373108f10c45d11bbaf12f013016d9f99f076f2
claim_boundary:
  evidence_class: runtime-smoke
  benchmark_data_release: true
  software_release: false
  snqi: advisory-no-ranking
  allowed:
    - planner construction and one-scenario runtime compatibility
    - fail-closed detection of missing planner prerequisites
  prohibited:
    - full benchmark or paper-facing performance claim
    - Social Navigation Quality Index planner ranking
    - software package release or version claim
zenodo:
  concept: fresh-required
  doi_status: pending-assignment
  reuse_existing_concept: false
artifact_provenance:
  raw_episode_outputs: worktree-local-ignored-cache
  compact_manifest: tracked-compact-evidence
  source_commit: record-at-run
  command: >-
    uv run python scripts/tools/run_benchmark_release.py
    --manifest configs/benchmarks/releases/paper_experiment_matrix_v2_h600_s30_runtime_smoke_v0_2.yaml
    --label runtime-smoke
  campaign_root: output/benchmarks/camera_ready/<campaign_id>

planners:
  - key: prediction_planner
    algo: prediction_planner
    planner_group: experimental
    algo_config: configs/algos/prediction_planner_camera_ready.yaml
    benchmark_profile: experimental

  - key: goal
    algo: goal
    planner_group: core
    benchmark_profile: baseline-safe

  - key: social_force
    algo: social_force
    planner_group: core
    benchmark_profile: baseline-safe

  - key: orca
    algo: orca
    planner_group: core
    benchmark_profile: baseline-safe
    socnav_missing_prereq_policy: fail-fast

  - key: ppo
    algo: ppo
    planner_group: experimental
    algo_config: configs/baselines/ppo_issue_791_eval_aligned_large_capacity_cpu.yaml
    benchmark_profile: experimental
    adapter_impact_eval: true

  - key: socnav_sampling
    algo: socnav_sampling
    planner_group: experimental
    benchmark_profile: experimental
    socnav_missing_prereq_policy: fail-fast

  - key: sacadrl
    algo: sacadrl
    planner_group: experimental
    benchmark_profile: experimental
    socnav_missing_prereq_policy: fail-fast

  - key: scenario_adaptive_hybrid_orca_v2_bottleneck_yield
    algo: hybrid_rule_local_planner
    planner_group: experimental
    algo_config: >-
      configs/policy_search/candidates/scenario_adaptive_hybrid_orca_v2_bottleneck_yield_s30_h600_release.yaml
    benchmark_profile: experimental

  - key: scenario_adaptive_hybrid_orca_v2_collision_guard
    algo: hybrid_rule_local_planner
    planner_group: experimental
    algo_config: >-
      configs/policy_search/candidates/scenario_adaptive_hybrid_orca_v2_collision_guard_s30_h600_release.yaml
    benchmark_profile: experimental

  - key: hybrid_rule_v3_fast_progress_static_escape
    algo: hybrid_rule_local_planner
    planner_group: experimental
    algo_config: >-
      configs/policy_search/candidates/hybrid_rule_v3_fast_progress_static_escape_s30_h600_release.yaml
    benchmark_profile: experimental

  - key: hybrid_rule_v3_fast_progress_static_escape_continuous
    algo: hybrid_rule_local_planner
    planner_group: experimental
    algo_config: >-
      configs/policy_search/candidates/hybrid_rule_v3_fast_progress_static_escape_continuous_s30_h600_release.yaml
    benchmark_profile: experimental

  - key: guarded_ppo
    algo: guarded_ppo
    planner_group: experimental
    algo_config: configs/algos/guarded_ppo_camera_ready_cpu.yaml
    benchmark_profile: experimental

  - key: predictive_mppi
    algo: predictive_mppi
    planner_group: experimental
    algo_config: configs/algos/predictive_mppi_camera_ready.yaml
    benchmark_profile: experimental

  - key: risk_dwa
    algo: risk_dwa
    planner_group: experimental
    algo_config: configs/algos/risk_dwa_camera_ready.yaml
    benchmark_profile: experimental
