name: Figure-render recurrence guard

# Isolated recurrence guard for recurrence-eligible figure-render commands (issue #6770).
#
# Executes ONLY the entries marked ``recurrence_eligible: true`` in the canonical v1 figure-render
# registry (issue #6769) in isolated temporary output roots, enforcing committed-input hashes,
# timeouts, declared-output presence, no extra/escaped writes, and a minimal credential-free
# environment. The job is blocking: it fails when any eligible command drifts, escapes its output
# root, times out, or exits with an unexpected code. Excluded entries are never executed.
#
# Network/scheduler-credential boundary: the recurrence guard is launched through the fail-closed
# Linux network-namespace helper, which denies sockets for the guard and every executed descendant.
# The guard additionally builds a minimal credential-free environment (no SLURM/cloud/token variables
# are inherited) and forces uv offline. The claim boundary is workflow recurrence + write containment
# only.

on:
  pull_request:
    paths:
      - "docs/context/figure_render_registry.v1.yaml"
      - "scripts/dev/check_figure_render_recurrence.py"
      - "scripts/dev/build_figure_render_registry.py"
      - "tests/dev/test_check_figure_render_recurrence.py"
      - "docs/context/evidence/issue_6770_figure_render_recurrence_report.json"
      - "docs/context/catalog.yaml"
      - "scripts/benchmark/build_horizon_timestep_ablation_report.py"
      - "scripts/benchmark/build_forecast_calibration_from_cv_comparison.py"
      - "docs/context/evidence/issue_2868_semantic_metadata_fixtures_2026-06-15/comparison_report.json"
      - "scripts/benchmark/run_cv_forecast_eval.py"
      - "scripts/validation/validate_forecast_risk_calibration_filter.py"
      - "scripts/benchmark/build_horizon_timestep_denominator_report.py"
      - "scripts/validation/check_simulator_dependence_validity_boundary.py"
      - "scripts/benchmark/export_event_ledger_reconciliation.py"
      - "tests/benchmark/fixtures/event_ledger_reconciliation/reconciled_episodes.jsonl"
      - "tests/benchmark/fixtures/event_ledger_reconciliation/violating_exact_collision_zero_count.jsonl"
      - ".github/workflows/figure-render-recurrence.yml"
  schedule:
    - cron: "23 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  figure-render-recurrence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python

      - name: Ensure strace (required for deterministic write containment)
        run: |
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y strace
          fi
          strace --version

      - name: Verify the registry drift gate (read-only input)
        run: uv run python scripts/dev/build_figure_render_registry.py --check

      - name: Verify the OS-level network-deny boundary
        run: |
          scripts/dev/run_without_network.sh python -c '
          import socket

          for address in (("1.1.1.1", 443), ("8.8.8.8", 53)):
              try:
                  with socket.create_connection(address, timeout=1):
                      raise SystemExit(f"network unexpectedly reachable: {address}")
              except OSError:
                  pass
          '

      - name: Run the recurrence guard (no secrets; network namespace + UV_OFFLINE)
        env:
          UV_OFFLINE: "1"
        run: |
          set -o pipefail
          scripts/dev/run_without_network.sh uv run python scripts/dev/check_figure_render_recurrence.py \
            --registry docs/context/figure_render_registry.v1.yaml \
            --report docs/context/evidence/issue_6770_figure_render_recurrence_report.json \
            2>&1 | tee output/figure_render_recurrence.log

      - name: Upload recurrence log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: figure-render-recurrence-log
          path: output/figure_render_recurrence.log
          if-no-files-found: warn
