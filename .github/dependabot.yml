version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      developer-tooling:
        applies-to: "version-updates"
        patterns:
          - "black"
          - "isort"
          - "mypy"
          - "pre-commit"
          - "pylint"
          - "pytest"
          - "pytest-*"
          - "ruff"
        update-types:
          - "minor"
          - "patch"
      serialization-data:
        applies-to: "version-updates"
        patterns:
          - "orjson"
        update-types:
          - "minor"
          - "patch"
      experiment-integrations:
        applies-to: "version-updates"
        patterns:
          - "wandb"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/fast-pysf"
    schedule:
      interval: "monthly"
      day: "tuesday"
      time: "06:30"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "07:00"
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
