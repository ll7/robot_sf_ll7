  - path: docs/context/evidence/issue_5948_doorway_provenance_2026-07-17/run_summary_reconstruction.yaml
    codes: [hash_without_artifact_path]
    disposition: baseline
    reason: >-
      Issue #5948 run-summary reconstruction carries a checksum without an adjacent artifact path.
      This is the legacy provenance gap identified by Issue #5972; repairing the external artifact
      binding is outside this baseline reconciliation, so the finding is explicitly dispositioned
      as baseline under the existing strict-CI policy.
  - path: docs/context/evidence/issue_6412_real_reexport_package/evidence_export.json
    codes: [artifact_hash_mismatch, uncommitted_artifact_missing_location]
    disposition: baseline
    reason: >-
      Issue #6412 compact export receipt. Its file paths are intentionally relative to the
      self-contained export directory, so the repository-root evidence linter cannot resolve
      tracked siblings and reports one bundle-context hash mismatch plus eleven missing locations
      for package-relative records. The export also declares raw and normalized traces outside
      Git. Preserve the package contract and exact hashes; changing the schema or recovering the
      disposable/external artifacts requires a reviewed producer/consumer migration, so this is
      targeted provenance debt rather than a safe in-place repair.
  - path: docs/context/evidence/issue_6412_real_reexport_package/figure_artifacts.json
    codes: [hash_without_artifact_path]
    disposition: baseline
    reason: >-
      Issue #6412 figure receipt hashes generated PDF/PNG outputs while deliberately keeping those
      binaries in disposable package storage rather than Git. The receipt is visualization-only
      and carries no release claim; adding a durable artifact path requires external package
      retention/owner action, so the four hashes remain explicitly baselined pending provenance
      backfill.
  - path: docs/context/evidence/issue_6412_real_reexport_package/package_report.json
    codes: [hash_without_artifact_path]
    disposition: baseline
    reason: >-
      Issue #6412 package report hashes the resolver and figure-QA receipts as compact package
      provenance, while the source traces and figure binaries remain outside Git. Those two
      checksums have no adjacent durable artifact path by design; the package remains
      diagnostic-only and visualization-only, so this targeted legacy provenance gap is
      baselined pending external retention and owner review.
