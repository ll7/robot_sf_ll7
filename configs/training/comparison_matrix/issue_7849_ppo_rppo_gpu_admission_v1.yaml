answerability:
  schema_version: research_answerability.v1
  question:
    research_question: >-
      Under the frozen matched simulator contract, does true RecurrentPPO
      improve collision-free route completion or reduce low-progress and
      timeout failure relative to feed-forward PPO without a material collision
      or severe-intrusion regression?
    bounded_claim: >-
      Only a paired disjoint-training-seed, in-distribution comparison on the
      frozen scenario matrix and named observation/action/reward contracts.
    negative_result_meaning: >-
      A valid null or negative result is terminal evidence under the frozen
      decision predicates; an invalid or incomplete matrix is inconclusive and
      cannot be relabeled as a policy failure.
    decision_vocabulary: [continue, stop, inconclusive, invalid]
  estimand:
    primary: paired difference in collision-free route completion probability
    reference_or_null: zero paired arm difference under the frozen comparison contract
    decision_predicates: >-
      Require the primary comparison and collision/severe-intrusion guardrails
      to satisfy the #7846 rule before any continuation decision.
    minimally_important_effect: >-
      The registered #7846 margin and collision guardrail must be explicitly
      confirmed by Domain-Aware Approval before execution.
  producers:
    - field: full_matrix_episode_rows
      producer: native matched PPO and RecurrentPPO evaluation runners
      source: scripts/training/train_ppo.py and scripts/training/train_recurrent_ppo.py
      unit: one immutable scenario and evaluation-seed episode row
      direction: paired arm rows share scenario and evaluation-seed identity
      denominator: all planned valid evaluation cells with explicit missingness
      pairing_key: training_seed plus scenario_id plus evaluation_seed
      missingness_rule: retain missing and invalid rows in the ledger and exclude them from success evidence
      status: blocked
      execution_mode: unavailable
      required: true
    - field: checkpoint_selection_metrics
      producer: native metric-aligned checkpoint evaluator
      source: scripts/training/train_recurrent_ppo.py and scripts/training/train_ppo.py
      unit: scheduled checkpoint evaluation
      direction: maximize success_rate with separate collision guardrail
      denominator: configured evaluation episodes per checkpoint
      pairing_key: arm plus training_seed plus checkpoint_step
      missingness_rule: missing metric invalidates selection and preserves the checkpoint lineage
      status: blocked
      execution_mode: unavailable
      required: true
    - field: disjoint_evaluation_seed_manifest
      producer: immutable shared evaluation-seed manifest consumed by both arms
      source: admission packet source inventory and later resolved launch manifest
      unit: evaluation seed identity
      direction: disjoint from all training seeds and identical across arms
      denominator: complete configured scenario and evaluation-seed cross product
      pairing_key: scenario_id plus evaluation_seed
      missingness_rule: absent, reused, or unpaired identities block the campaign
      status: missing
      execution_mode: unavailable
      required: true
    - field: recurrent_state_integrity
      producer: RecurrentPPO stateful evaluation adapter
      source: robot_sf/training/recurrent_runtime.py
      unit: recurrent evaluation episode
      direction: finite state with reset at every episode boundary
      denominator: every recurrent evaluation episode
      pairing_key: training_seed plus scenario_id plus evaluation_seed
      missingness_rule: any non-finite or leaked state invalidates the affected row
      status: blocked
      execution_mode: unavailable
      required: true
  analysis:
    analysis_unit: paired evaluation-seed scenario cell nested within training seed
    resampling_unit: training seed with paired scenario/evaluation-seed cells
    command: >-
      Run the registered #7846 paired analysis owner only after all required
      producers and exact row accounting are available.
    multiplicity: report the preregistered primary and secondary metrics without outcome-driven selection
    sensitivity_plan: hierarchical paired bootstrap and explicit missingness/attrition sensitivity
    dry_run_status: blocked
    comparability_status: blocked
  design:
    mode: decision_capable
    power_status: unknown
    budget: 2 arms x 5 independent training seeds x 15000000 steps
    sample_size: 10 training runs and the complete frozen scenario/evaluation-seed matrix
  artifacts:
    raw_owner: private operations durable artifact owner
    durable_path: approved external durable destination recorded in the private launch receipt
    durability_status: planned
    incomplete_policy: preserve all attempts and missingness; exclude invalid rows from claims and stop unresolved gaps
    checksums: [source inventory, resolved config, environment manifest, checkpoint index, raw rows, compact analysis]

compute_authorization:
