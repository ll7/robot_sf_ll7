name: CI

on:
  merge_group:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      retry_failed:
        description: Retry one completed exact-head failure (recorded and deduplicated)
        required: false
        default: false
        type: boolean

run-name: ${{ github.event_name == 'workflow_dispatch' && format('CI manual recovery retry_failed={0}', inputs.retry_failed) || github.event.head_commit.message || github.event.pull_request.title || github.workflow }}

permissions:
  actions: read
  contents: read

concurrency:
  # Pushes and pull-request updates retain latest-main-wins supersession.
  # Manual recovery runs use a unique pending identity because GitHub replaces
  # an existing pending run even when cancel-in-progress is false. The
  # dispatch-ownership job below deduplicates expensive same-head matrices.
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}-dispatch-{2}', github.workflow, github.ref, github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  SDL_VIDEODRIVER: dummy
  MPLBACKEND: Agg
  PYGAME_HIDE_SUPPORT_PROMPT: "1"
  # The sys.monitoring backend is faster for full non-PR coverage, but its
  # hosted pytest-xdist worker data is not reliable on PR/merge-group runs.
  # Keep the trace backend for exact-head changed coverage so the shard union
  # represents executed tests rather than collection-only lines.
  COVERAGE_CORE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'ctrace' || 'sysmon' }}

jobs:
  self-hosted-admission:
    # This job always runs hosted. No contribution executes on a private runner
    # before the complete commit range has passed the installed hook's policy.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      self_hosted: ${{ steps.provenance.outputs.self_hosted }}
    steps:
      - name: Checkout admission policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR cannot replace the admission policy with its own code.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Verify commit provenance
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Feature-branch bases and non-main pushes are never trust anchors.
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$PR_BASE_REF" != main ]] ||
             [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'self_hosted=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Empty output, script errors and API failures all select hosted.
          decision="$(/bin/bash -p scripts/ci/self_hosted/job_started_hook.sh --route)" || decision='self_hosted=false'
          if [[ "$decision" == 'self_hosted=true' ]]; then
            echo 'self_hosted=true' >> "$GITHUB_OUTPUT"
          else
            echo 'self_hosted=false' >> "$GITHUB_OUTPUT"
          fi

  dispatch-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      # Serialize same-head manual elections only. Push, PR, and merge_group
      # bypass gates must not hold the slot that a manual follower waits on.
      group: ci-dispatch-owner-${{ github.event_name == 'workflow_dispatch' && github.sha || github.run_id }}
      cancel-in-progress: false
    outputs:
      run_full_ci: ${{ steps.decision.outputs.run_full_ci }}
      compat_os: ${{ steps.paths.outputs.compat_os }}
      examples_smoke: ${{ steps.paths.outputs.examples_smoke }}
      notebooks_smoke: ${{ steps.paths.outputs.notebooks_smoke }}
      xdist_scratch_isolation: ${{ steps.paths.outputs.xdist_scratch_isolation }}
    steps:
      - name: Checkout gate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep workflow-added CI helper tests paired with the workflow revision.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Elect exact-head full-matrix owner
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_FAILED: ${{ inputs.retry_failed || false }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            if [[ "${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}" == "true" ]]; then
              echo "run_full_ci=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "run_full_ci=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          retry_args=()
          if [[ "${RETRY_FAILED}" == "true" ]]; then
            retry_args+=(--retry-failed)
          fi
          python scripts/dev/main_ci_is_green.py \
            --dispatch-gate \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow ci.yml \
            --target-sha "${GITHUB_SHA}" \
            --target-branch "${GITHUB_REF_NAME}" \
            --target-ref-type "${GITHUB_REF_TYPE}" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --github-output "${GITHUB_OUTPUT}" \
            "${retry_args[@]}"

      - name: Test CI fallback decisions without project dependencies
        run: node --test tests/ci/runner_fallback.test.cjs

      - name: Set up pinned uv for draft feedback with bounded retry
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        env:
          UV_VERSION: "0.11.21"
          UV_INSTALL_MAX_ATTEMPTS: "3"
          UV_INSTALL_BACKOFF_BASE: "5"
          UV_INSTALL_BACKOFF_CAP: "30"
        run: bash scripts/dev/ci_install_uv_retry.sh "${UV_VERSION}"

      - name: Lint and run small CI-helper subset on drafts
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          set -euo pipefail
          uvx --from ruff==0.16.7 ruff check .
          uvx --from ruff==0.16.7 ruff format --check .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run --no-project --with pytest==9.1.1 \
            python -m pytest tests/dev/test_ci_heavy_paths.py tests/ci/test_collect_pr_files.py \
            --noconftest -q -o addopts=''

      - name: Collect ready PR changed files
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python scripts/ci/collect_pr_files.py
          --repo "$GITHUB_REPOSITORY" --pr-number "$PR_NUMBER"
          --out-changed-files "$RUNNER_TEMP/pr_changed_files.txt"
          --out-files-status "$RUNNER_TEMP/pr_files_status.tsv"

      - name: Select heavy PR jobs
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            python scripts/dev/ci_heavy_paths.py \
              --changed-files "$RUNNER_TEMP/pr_changed_files.txt" \
              --files-status "$RUNNER_TEMP/pr_files_status.tsv" \
              --github-output "$GITHUB_OUTPUT"
          else
            {
              echo 'compat_os=["ubuntu-latest","macos-latest"]'
              echo 'examples_smoke=true'
              echo 'notebooks_smoke=true'
              echo 'xdist_scratch_isolation=true'
            } >> "$GITHUB_OUTPUT"
          fi
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft

      - name: Restore test durations for pytest-split balancing
        if: steps.decision.outputs.run_full_ci == 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .test_durations
            .pytest_cache/test_durations_metadata.json
          key: test-durations-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-durations-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}-
            test-durations-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Freeze matrix duration input
        id: freeze-durations
        if: steps.decision.outputs.run_full_ci == 'true'
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          # An older PR head may not support this workflow's helper arguments.
          # Keep scheduling code paired with the exact workflow revision.
          if ! git cat-file -e "${WORKFLOW_SHA}:scripts/dev/merge_test_durations.py"; then
            git fetch --no-tags origin "${WORKFLOW_SHA}"
          fi
          git show "${WORKFLOW_SHA}:scripts/dev/merge_test_durations.py" \
            > "$RUNNER_TEMP/merge_test_durations.py"
          python "$RUNNER_TEMP/merge_test_durations.py" \
            --snapshot-input .test_durations --output .test_durations

      - name: Upload frozen test durations
        if: steps.decision.outputs.run_full_ci == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-duration-snapshot
          path: .test_durations
          include-hidden-files: true
          if-no-files-found: error

      - name: Prepare conservative test admission
        if: steps.decision.outputs.run_full_ci == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python scripts/dev/affected_test_selection.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --json-output output/ci/affected-selection.json --format mode

      - name: Upload conservative test admission
        if: steps.decision.outputs.run_full_ci == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conservative-test-admission
          path: output/ci/affected-selection.json
          if-no-files-found: error

  runner-availability:
    needs: [dispatch-ownership, self-hosted-admission]
    if: ${{ !cancelled() && needs.dispatch-ownership.result == 'success' && needs.dispatch-ownership.outputs.run_full_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # A failed checkout/probe must leave the workload's hosted default usable.
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      fast_feedback: ${{ steps.route.outputs.fast_feedback }}
      smoke_artifacts: ${{ steps.route.outputs.smoke_artifacts }}
      wheel_smoke_install: ${{ steps.route.outputs.wheel_smoke_install }}
      examples_smoke: ${{ steps.route.outputs.examples_smoke }}
      notebooks_smoke: ${{ steps.route.outputs.notebooks_smoke }}
    steps:
      # PR routing code comes from its trusted base, never its writable head.
      - name: Checkout trusted routing source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      # No PR-head code runs with this credential. Only the probe consumes it.
      - name: Mint narrow runner inventory token
        id: router-token
        if: >-
          needs.self-hosted-admission.result == 'success' && needs.self-hosted-admission.outputs.self_hosted == 'true' &&
          vars.ROBOT_SF_SELF_HOSTED_CI_ENABLED == 'true' && github.run_attempt == 1 &&
          github.repository == 'll7/robot_sf_ll7' && github.actor == 'll7' &&
          github.triggering_actor == 'll7' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == 'll7/robot_sf_ll7' &&
          github.event.pull_request.head.repo.fork == false &&
          github.event.pull_request.user.login == 'll7'))
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.ROBOT_SF_ROUTER_APP_ID }}
          private-key: ${{ secrets.ROBOT_SF_ROUTER_APP_KEY }}
          owner: ll7
          repositories: robot_sf_ll7
          permission-administration: read
          # Default post-job revocation remains enabled.

      - name: Probe optional idle runner capacity
        id: route
        if: >-
          steps.router-token.outcome == 'success' && steps.router-token.outputs.token != '' &&
          needs.self-hosted-admission.result == 'success' && needs.self-hosted-admission.outputs.self_hosted == 'true' &&
          vars.ROBOT_SF_SELF_HOSTED_CI_ENABLED == 'true' && github.run_attempt == 1 &&
          github.repository == 'll7/robot_sf_ll7' && github.actor == 'll7' &&
          github.triggering_actor == 'll7' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == 'll7/robot_sf_ll7' &&
          github.event.pull_request.head.repo.fork == false &&
          github.event.pull_request.user.login == 'll7'))
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SELF_HOSTED_ENABLED: ${{ vars.ROBOT_SF_SELF_HOSTED_CI_ENABLED }}
          PROVENANCE_ADMITTED: ${{ needs.self-hosted-admission.outputs.self_hosted }}
        with:
          # Step-local installation token; never exported to env or job outputs.
          github-token: ${{ steps.router-token.outputs.token }}
          retries: 0
          script: |
            try {
              const { route } = require('./scripts/ci/runner_fallback.cjs');
              await route({ github, context, core, enabled: process.env.SELF_HOSTED_ENABLED,
                provenance: process.env.PROVENANCE_ADMITTED });
            } catch {
              // The router does not yet exist on a pre-merge PR base.
              core.info('ci-runner-route hosted: trusted routing source unavailable');
            }

  fast-feedback:
    needs: [dispatch-ownership, self-hosted-admission, runner-availability]
    if: ${{ !cancelled() && needs.dispatch-ownership.result == 'success' && needs.dispatch-ownership.outputs.run_full_ci == 'true' }}
    # Hosted first: opt in only with a successful bounded idle-capacity probe.
    # Every retry is hosted, including a queue-watchdog recovery.
    # Forks, bots, privileged events, and manual dispatches stay hosted.
    runs-on: ${{ needs.self-hosted-admission.result == 'success' && needs.self-hosted-admission.outputs.self_hosted == 'true' && vars.ROBOT_SF_SELF_HOSTED_CI_ENABLED == 'true' && github.repository == 'll7/robot_sf_ll7' && github.actor == 'll7' && github.triggering_actor == 'll7' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'll7/robot_sf_ll7')) && github.run_attempt == 1 && needs.runner-availability.outputs.fast_feedback == 'true' && 'robot-sf-ci-ephemeral' || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: 45
    # Split complete admission across six runners and combine exact-head coverage.
    # Uncertain dependencies intentionally select every slow test on pull requests.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      # Browser witnesses run once on the hosted Node lane.
      PYTEST_ADDOPTS: >-
        --deselect=tests/render/test_audit_workbench.py::test_browser_controller_runtime_covers_normal_and_missing_media_cases
        --deselect=tests/render/test_audit_workbench.py::test_browser_controller_runtime_failure_reports_redacted_bounded_diagnostics
        --deselect=tests/render/test_review_editor.py::test_python_generated_model_can_save_storyboard_in_browser_runtime
        --deselect=tests/render/test_review_editor.py::test_node_browser_controller_honours_typing_shortcut_suppression
        --deselect=tests/render/test_review_sessions.py::test_node_browser_runtime_is_offline_and_has_no_implicit_start
        --deselect=tests/test_review_workbench.py::test_canonical_launch_mounts_diagnostic_audit_extension_and_browser_runtime
      # Redistribute queued release-validation checks instead of stranding a tail.
      PYTEST_XDIST_DIST: worksteal
      PYTEST_SHARD_COUNT: 6
      PYTEST_SHARD_INDEX: ${{ matrix.shard }}
      ROBOT_SF_SHARD_INCLUDE_SLOW: "1"
      # Reuse the setup decision only after default admission is installed.
      ROBOT_SF_AFFECTED_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      ROBOT_SF_AFFECTED_SELECTION_FILE: ${{ github.event_name == 'pull_request' && 'output/ci/affected-selection.json' || '' }}
      ROBOT_SF_PYTEST_COVERAGE: "1"
      COVERAGE_FILE: ${{ format('output/coverage/.coverage.{0}', matrix.shard) }}
      # The release-hydration tests invoke `gh` for a public pinned asset. Use
      # the Actions token so GitHub API rate limits cannot make main flaky.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Coverage must be collected from the same immutable head that the
          # changed-line gate evaluates, not an implicit merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # The evidence-registry ratchet resolves historical producing commits.
          # A shallow checkout turns reachable provenance into false
          # ``dangling_commit`` findings and makes main CI environment-dependent.
          fetch-depth: 0
          persist-credentials: false

      - name: Download conservative test admission
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conservative-test-admission
          path: output/ci

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python
        with:
          node: "false"
          install-system-packages: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}

      - name: Prime uv cache metadata for offline software-candidate checks
        run: |
          set -euo pipefail
          # A locked sync records the selected wheel payload but may not retain the
          # wheel-metadata response needed by a later offline ``uv pip install``.
          # Refresh and reinstall the exact helper pins so each test shard can
          # resolve them without depending on a prior unrelated registry lookup.
          uv pip install \
            --python .venv/bin/python \
            --refresh-package packaging \
            --refresh-package pyyaml \
            --reinstall \
            "packaging==26.0" \
            "pyyaml==6.0.3"

      - name: Hydrate result-interpretation provenance
        run: uv run python scripts/dev/ensure_result_interpretation_provenance.py

      - name: Run isolated offline core smoke
        if: ${{ matrix.shard == 1 }}
        env:
          UV_OFFLINE: "1"
        run: UV_NO_SYNC=1 UV_NO_CONFIG=1 uv run python scripts/dev/run_offline_smoke.py --offline --isolated --json --output-root output/offline-smoke

      - name: Cache test results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            pytest-${{ runner.os }}-

      - name: Download frozen test durations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-duration-snapshot
          path: .
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      # Lint and typecheck are shard-independent; run them once (shard 1 only)
      # to avoid duplicated annotations on pull-request shard matrices.
      - name: Lint
        if: ${{ matrix.shard == 1 }}
        run: scripts/dev/ci_driver.sh lint

      - name: Type check
        if: ${{ matrix.shard == 1 }}
        run: scripts/dev/ci_driver.sh typecheck

      - name: Unit tests
        run: scripts/dev/ci_driver.sh test

      - name: Upload test durations
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-durations-${{ matrix.shard }}
          path: .test_durations
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload pytest lastfailed order snapshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-lastfailed-${{ matrix.shard }}
          path: .pytest_cache/v/cache/lastfailed
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: output/coverage/.coverage.${{ matrix.shard }}
          if-no-files-found: error
          include-hidden-files: true

  browser-witnesses:
    needs: dispatch-ownership
    if: ${{ !cancelled() && needs.dispatch-ownership.result == 'success' && needs.dispatch-ownership.outputs.run_full_ci == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout exact evaluated head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CI Python and browser runtime
        uses: ./.github/actions/setup-ci-python
        with:
          node: "true"

      - name: Run browser witnesses
        run: |
          uv run pytest -q \
            tests/render/test_audit_workbench.py::test_browser_controller_runtime_covers_normal_and_missing_media_cases \
            tests/render/test_audit_workbench.py::test_browser_controller_runtime_failure_reports_redacted_bounded_diagnostics \
            tests/render/test_review_editor.py::test_python_generated_model_can_save_storyboard_in_browser_runtime \
            tests/render/test_review_editor.py::test_node_browser_controller_honours_typing_shortcut_suppression \
            tests/render/test_review_sessions.py::test_node_browser_runtime_is_offline_and_has_no_implicit_start \
            tests/test_review_workbench.py::test_canonical_launch_mounts_diagnostic_audit_extension_and_browser_runtime

  changed-coverage-gate:
    runs-on: ubuntu-latest
    # This lane performs a complete exact-head checkout and the shared all-extras
    # setup before it can combine shards and emit merge-admission proof.
    timeout-minutes: 30
    needs: fast-feedback
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.fast-feedback.result == 'success'
    steps:
      - name: Checkout exact evaluated head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python

      - name: Download coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          path: output/coverage
          merge-multiple: true

      - name: Combine coverage shards
        run: |
          set -euo pipefail
          uv run coverage combine output/coverage
          uv run coverage json

      - name: Enforce exact-head changed-line coverage
        id: changed-coverage
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BASE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$HEAD_SHA" ]]; then
            echo "Checked-out head drifted: expected $HEAD_SHA, got $actual_head" >&2
            exit 2
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Event base.sha can predate commits already present in the PR.
            # Bind this verdict to the live target branch; a missing ref fails
            # before coverage rather than falling back to that stale event SHA.
            git fetch --no-tags origin \
              "refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
            BASE_SHA="$(git merge-base "refs/remotes/origin/$BASE_BRANCH" "$HEAD_SHA")"
          fi

          set +e
          uv run python scripts/coverage/check_changed_files_coverage.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --event-name "$GITHUB_EVENT_NAME" \
            --coverage output/coverage/coverage.json \
            --json-output output/coverage/changed-coverage-result.json \
            --show-skipped \
            >output/coverage/changed-coverage.log 2>&1
          coverage_status=$?
          set -e
          cat output/coverage/changed-coverage.log
          exit "$coverage_status"

      - name: Upload changed-coverage proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changed-coverage-proof
          path: |
            output/coverage/changed-coverage-result.json
            output/coverage/changed-coverage.log
          if-no-files-found: error

  coverage-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: fast-feedback
    if: ${{ github.event_name != 'pull_request' && needs.fast-feedback.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python

      - name: Download coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          path: output/coverage
          merge-multiple: true

      - name: Combine coverage shards
        run: |
          uv run coverage combine output/coverage
          uv run coverage json
          uv run coverage html

      - name: Enforce absolute coverage floor
        run: >-
          uv run python scripts/coverage/compare_coverage.py
          --current output/coverage/coverage.json
          --absolute-only
          --format github
          --minimum-total 85.0

      - name: Restore coverage baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/coverage/.coverage-baseline.json
          key: coverage-baseline-${{ github.ref_name }}
          restore-keys: |
            coverage-baseline-main

      - name: Compare coverage with baseline
        continue-on-error: true
        run: |
          if [ -f output/coverage/.coverage-baseline.json ]; then
            echo "Baseline found, comparing coverage..."
            uv run python scripts/coverage/compare_coverage.py \
              --current output/coverage/coverage.json \
              --baseline output/coverage/.coverage-baseline.json \
              --format github \
              --threshold 1.0
          else
            echo "No baseline found, skipping comparison"
          fi

      - name: Update coverage baseline (main branch only)
        if: github.ref == 'refs/heads/main' && success()
        run: |
          mkdir -p output/coverage
          cp output/coverage/coverage.json output/coverage/.coverage-baseline.json
          echo "Coverage baseline updated for main branch"

      - name: Save coverage baseline (main branch only)
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/coverage/.coverage-baseline.json
          key: coverage-baseline-${{ github.ref_name }}-${{ github.sha }}

      - name: Upload coverage reports
        if: ${{ failure() || github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            output/coverage/coverage.json
            output/coverage/htmlcov/
            output/coverage/.coverage
          include-hidden-files: true

  compat-matrix:
    needs: dispatch-ownership
    if: needs.dispatch-ownership.outputs.run_full_ci == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.dispatch-ownership.outputs.compat_os) }}
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up matrixed compatibility CI environment
        uses: ./.github/actions/setup-ci-python
        with:
          node: "true"
          python-version: ${{ matrix.python }}
          # Slim profile (issue #9355): base + viz + maps extras cover the full
          # compat test closure (proven by check_compat_import_profile.py plus a
          # slim-venv collection/runtime probe). Full --all-extras downloads
          # (CUDA torch, Ray, browsers) blew the 1,200s setup budget on cold
          # caches before any test ran.
          sync-args: "--extra viz --extra maps --frozen"

      - name: Verify compat import profile before tests
        run: uv run python scripts/dev/check_compat_import_profile.py

      - name: Run compatibility tests with profile extras
        run: >-
          uv run pytest tests/common tests/contract tests/factories tests/gym_env tests/maps
          tests/nav tests/ped_npc tests/render tests/scenarios tests/sensor tests/sim tests/unit
          -q -m "not slow"

  fast-pysf-compat:
    needs: dispatch-ownership
    if: needs.dispatch-ownership.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pinned uv with bounded retry
        env:
          UV_VERSION: "0.11.21"
          UV_INSTALL_MAX_ATTEMPTS: "3"
          UV_INSTALL_BACKOFF_BASE: "5"
          UV_INSTALL_BACKOFF_CAP: "30"
        run: bash scripts/dev/ci_install_uv_retry.sh "${UV_VERSION}"

      - name: Validate fast-pysf standalone lock
        run: uv lock --check --directory fast-pysf

  smoke-artifacts:
    needs: [dispatch-ownership, self-hosted-admission, runner-availability]
    if: ${{ !cancelled() && needs.dispatch-ownership.result == 'success' && needs.dispatch-ownership.outputs.run_full_ci == 'true' }}
    runs-on: ${{ needs.self-hosted-admission.result == 'success' && needs.self-hosted-admission.outputs.self_hosted == 'true' && vars.ROBOT_SF_SELF_HOSTED_CI_ENABLED == 'true' && github.repository == 'll7/robot_sf_ll7' && github.actor == 'll7' && github.triggering_actor == 'll7' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'll7/robot_sf_ll7')) && github.run_attempt == 1 && needs.runner-availability.outputs.smoke_artifacts == 'true' && 'robot-sf-ci-ephemeral' || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python
        with:
          install-system-packages: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}

      - name: Validation smoke tests
        id: smoke_tests
        run: scripts/dev/ci_driver.sh smoke

      - name: Upload map verification manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-verification-manifest
          path: output/validation/map_verification.json
          if-no-files-found: warn

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-artifacts
          path: output/benchmarks/
          if-no-files-found: ignore

      - name: Upload recording artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recording-artifacts
          path: output/recordings/
          if-no-files-found: ignore

      - name: Upload cold/warm perf smoke artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cold-warm-perf-smoke
          path: |
            output/benchmarks/perf/cold_warm_pr_smoke.json
            output/benchmarks/perf/cold_warm_pr_smoke.md
          if-no-files-found: warn

      - name: Upload smoke artifact on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-smoke-episodes
          path: output/benchmarks/ci_smoke/episodes.jsonl

      - name: Enforce artifact root policy
        if: >-
          ${{ always() && (steps.smoke_tests.outcome == 'success' ||
          steps.smoke_tests.outcome == 'failure') }}
        env:
          CI_STEP_TIMEOUT_SECONDS: "300"
        run: bash scripts/dev/ci_step_timer.sh "Enforce artifact root policy" scripts/dev/ci_driver.sh artifact-policy

  scenario-validation:
    needs: dispatch-ownership
    if: needs.dispatch-ownership.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact evaluated head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python

      - name: Enforce pinned geometry contract
        run: >-
          uv run python scripts/validation/check_scenario_archetype_geometry.py
          --fail-on-violation
          --waiver-file configs/scenarios/archetype_validation_waivers.yaml

      - name: Enforce release endpoint separation
        run: >-
          uv run python scripts/validation/check_scenario_archetype_geometry.py
          --release-zones
          --endpoint-policy pedestrian_radius_v1
          --waiver-file configs/scenarios/release_0_0_8_endpoint_dispositions.yaml

      - name: Enforce pinned parameter contract
        run: >-
          uv run python scripts/validation/check_scenario_archetype_parameters.py
          --fail-on-violation
          --waiver-file configs/scenarios/archetype_validation_waivers.yaml

  new-tests-fail-on-base:
    # Advisory (issue 9986): new or changed tests should fail on the merge base.
    # Never blocks; findings go to the job summary.
    needs: dispatch-ownership
    if: github.event_name == 'pull_request' && needs.dispatch-ownership.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout exact evaluated head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python
        with:
          node: "true"

      - name: Run new tests against the base commit (advisory)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # base.sha is the base branch tip; compare against the merge base so a
          # moved main cannot make tests fail for unrelated reasons.
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          uv run python scripts/validation/check_new_tests_fail_on_base.py \
            --base "$MERGE_BASE" --head "$HEAD_SHA" \
            --summary-out "$RUNNER_TEMP/new_tests_fail_on_base.md" \
            --json-out "$RUNNER_TEMP/new_tests_fail_on_base.json" || true
          cat "$RUNNER_TEMP/new_tests_fail_on_base.md" >> "$GITHUB_STEP_SUMMARY" || true

  reproducibility-check:
    # Run on pull requests so hosted reproducibility evidence is green rather
    # than skipped; retain manual dispatch for standalone diagnostics.
    needs: dispatch-ownership
    if: >-
      needs.dispatch-ownership.outputs.run_full_ci == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python

      - name: Run reproducibility diagnostic
        run: uv run python scripts/benchmark_repro_check.py

      - name: Upload reproducibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-report
          path: output/benchmarks/reproducibility_check.json
          if-no-files-found: warn

  reproducibility-check-reconciliation:
    # A successful Actions job can transiently retain a pending check-run on
    # GitHub-hosted state. Reconcile only that exact job identity; keep the
    # hosted-state repair diagnostic-only and outside the ci aggregate.
    if: >-
      ${{ always() && needs.reproducibility-check.result == 'success' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    needs: [reproducibility-check]
    continue-on-error: true
    permissions:
      actions: read
      checks: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reconcile exact successful check-run
        env:
          GH_TOKEN: ${{ github.token }}
          REPRODUCIBILITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPRODUCIBILITY_JOB_RESULT: ${{ needs.reproducibility-check.result }}
        run: >-
          python scripts/dev/reconcile_reproducibility_check_run.py
          --output output/validation/reproducibility_check_run_reconciliation.json

      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-check-reconciliation
          path: output/validation/reproducibility_check_run_reconciliation.json
          if-no-files-found: warn

  xdist-scratch-isolation:
    needs: dispatch-ownership
    if: >-
      needs.dispatch-ownership.outputs.run_full_ci == 'true' &&
      (github.event_name != 'pull_request' || needs.dispatch-ownership.outputs.xdist_scratch_isolation == 'true')
    runs-on: ubuntu-latest
    # Shared all-extras setup can take ~19 minutes before the guard runs (#8631).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python

      - name: Run xdist scratch-isolation guard
        run: |
          uv run pytest -n 4 --dist worksteal \
            tests/test_runner_policy_timeout.py::test_planner_step_timeout_fails_fast_and_reports_metadata \
            tests/tools/test_release_evidence_gate.py::test_archive_integrity_pass_and_fail \
            tests/benchmark/test_scenario_criticality_optimization.py::test_effective_workers_capped_at_candidate_count \
            'tests/analysis/test_recenter_topology_panels_issue_2227.py::test_both_arm_traces_validate_against_schema[topology_result]' \
            'tests/analysis/test_recenter_topology_panels_issue_2227.py::test_both_arm_traces_validate_against_schema[static_recenter_result]' \
            tests/validation/test_evaluate_predictive_planner_smoke.py::test_evaluate_predictive_planner_fails_closed_without_collision_metric \
            tests/validation/test_predictive_success_campaign_tags.py::test_main_writes_failure_summary_for_missing_jsonl \
            tests/validation/test_predictive_success_campaign_tags.py::test_main_writes_failure_summary_for_malformed_jsonl

  wheel-smoke-install:
    needs: [dispatch-ownership, self-hosted-admission, runner-availability]
    if: ${{ !cancelled() && needs.dispatch-ownership.result == 'success' && needs.dispatch-ownership.outputs.run_full_ci == 'true' }}
    runs-on: ${{ needs.self-hosted-admission.result == 'success' && needs.self-hosted-admission.outputs.self_hosted == 'true' && vars.ROBOT_SF_SELF_HOSTED_CI_ENABLED == 'true' && github.repository == 'll7/robot_sf_ll7' && github.actor == 'll7' && github.triggering_actor == 'll7' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'll7/robot_sf_ll7')) && github.run_attempt == 1 && needs.runner-availability.outputs.wheel_smoke_install == 'true' && 'robot-sf-ci-ephemeral' || 'ubuntu-latest' }}
    permissions:
      contents: read
    # Leave smoke-test headroom after an observed ~18-minute setup (#8631).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python
        with:
          install-system-packages: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}

      - name: Build wheel
        run: uv build

      - name: Check distribution license payloads
        run: uv run python scripts/tools/check_distribution_licenses.py dist

      - name: Clean wheel install/import smoke
        run: bash scripts/validation/wheel_install_smoke.sh

      - name: Upload wheel smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-smoke-report
          path: output/validation/wheel_install_smoke_report.json
          if-no-files-found: warn

  examples-smoke:
    needs: [dispatch-ownership, self-hosted-admission, runner-availability]
    if: ${{ !cancelled() && needs.dispatch-ownership.result == 'success' && needs.dispatch-ownership.outputs.run_full_ci == 'true' && (github.event_name != 'pull_request' || needs.dispatch-ownership.outputs.examples_smoke == 'true') }}
    runs-on: ${{ needs.self-hosted-admission.result == 'success' && needs.self-hosted-admission.outputs.self_hosted == 'true' && vars.ROBOT_SF_SELF_HOSTED_CI_ENABLED == 'true' && github.repository == 'll7/robot_sf_ll7' && github.actor == 'll7' && github.triggering_actor == 'll7' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'll7/robot_sf_ll7')) && github.run_attempt == 1 && needs.runner-availability.outputs.examples_smoke == 'true' && 'robot-sf-ci-ephemeral' || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout (attempt 1)
        id: checkout_attempt_1
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout (attempt 2)
        id: checkout_attempt_2
        if: steps.checkout_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout (attempt 3)
        id: checkout_attempt_3
        if: steps.checkout_attempt_1.outcome == 'failure' && steps.checkout_attempt_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail-closed guard when checkout fails
        if: steps.checkout_attempt_1.outcome == 'failure' && steps.checkout_attempt_2.outcome == 'failure' && steps.checkout_attempt_3.outcome == 'failure'
        run: |
          # shellcheck disable=SC2016
          {
            echo "## Checkout failed: examples-smoke did not run"
            echo ""
            echo "All three bounded checkout attempts failed before the local repository could be set up."
            echo "No example smoke tests ran."
            echo "TLS certificate verification was **not** bypassed."
            echo ""
            echo "After the underlying infrastructure recovers, rerun the failed job with:"
            echo ""
            echo '```bash'
            echo 'gh run rerun "$GITHUB_RUN_ID" --failed'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::examples-smoke checkout failed after 3 attempts; no example tests ran. TLS verification was not bypassed. Rerun with: gh run rerun '$GITHUB_RUN_ID' --failed"
          exit 1

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python
        with:
          install-system-packages: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
          # The examples manifest needs plotting/benchmark/PPO dependencies,
          # not the unrelated all-extras GPU, Ray, TensorFlow, SocNav, or
          # browser stacks that can exhaust the setup timeout before tests run.
          sync-args: "--group examples --frozen"

      - name: Example smoke tests
        run: scripts/dev/ci_driver.sh examples-smoke

  notebooks-smoke:
    needs: [dispatch-ownership, self-hosted-admission, runner-availability]
    if: ${{ !cancelled() && needs.dispatch-ownership.result == 'success' && needs.dispatch-ownership.outputs.run_full_ci == 'true' && (github.event_name != 'pull_request' || needs.dispatch-ownership.outputs.notebooks_smoke == 'true') }}
    runs-on: ${{ needs.self-hosted-admission.result == 'success' && needs.self-hosted-admission.outputs.self_hosted == 'true' && vars.ROBOT_SF_SELF_HOSTED_CI_ENABLED == 'true' && github.repository == 'll7/robot_sf_ll7' && github.actor == 'll7' && github.triggering_actor == 'll7' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'll7/robot_sf_ll7')) && github.run_attempt == 1 && needs.runner-availability.outputs.notebooks_smoke == 'true' && 'robot-sf-ci-ephemeral' || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python
        with:
          install-system-packages: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}

      - name: Notebook smoke tests
        run: scripts/dev/ci_driver.sh notebooks-smoke

  # --- Path-triggered exact-repeat determinism gate (Option B, issue #6191) ---
  #
  # Runs the full exact-repeat determinism test suite only when the PR diff
  # touches paths that can affect determinism.  Most PRs pay zero overhead.
  # When triggered the check is genuinely blocking (failing it fails CI).
  #
  # Determinism-relevant paths — update this list when code moves:
  #   robot_sf/planner/        – planner implementations
  #   robot_sf/models/registry.py – model registry
  #   robot_sf/benchmark/      – benchmark runner / exact-repeat campaign
  #   configs/baselines/       – baseline configs
  determinism-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The dedicated preflight job owns the checksum-verified model cache. Wait
    # for it and restore the same key before the full suite, otherwise this
    # parallel job independently redownloads the model and turns a cacheable
    # provisioning dependency into a network-flaky determinism failure.
    needs: exact-repeat-model-preflight
    env:
      PPO_ALGO_CONFIG: configs/baselines/ppo_issue_791_eval_aligned_large_capacity_cpu.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check determinism-relevant path changes
        id: check-changes
        shell: bash
        run: |
          # Determine the base ref for diffing
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            BASE_REF="${{ github.event.merge_group.base_sha }}"
          else
            BASE_REF="origin/main"
          fi

          # Determinism-relevant paths — single source of truth for the
          # path-triggered gate.  Keep in sync with the comment above.
          DETERMINISM_PATHS=(
            "robot_sf/planner/"
            "robot_sf/models/registry.py"
            "robot_sf/benchmark/"
            "configs/baselines/"
          )

          CHANGED=$(git diff --name-only "$BASE_REF...HEAD" -- "${DETERMINISM_PATHS[@]}")
          if [[ -n "$CHANGED" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed determinism-relevant paths:"
            echo "$CHANGED"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No determinism-relevant paths changed"
          fi

      - name: No determinism-relevant changes
        if: steps.check-changes.outputs.changed == 'false'
        run: echo "Skipping exact-repeat determinism check (no changes to determinism-relevant paths)"

      - name: Set up CI Python environment
        if: steps.check-changes.outputs.changed == 'true'
        uses: ./.github/actions/setup-ci-python

      - name: Derive model-cache key from registry-pinned digests
        if: steps.check-changes.outputs.changed == 'true'
        id: model-cache-key
        run: |
          KEY=$(uv run python scripts/dev/model_cache_key.py --config "${PPO_ALGO_CONFIG}" --machine)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Restore exact-repeat model cache
        if: steps.check-changes.outputs.changed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/model_cache
          key: model-cache-exact-repeat-ppo-${{ steps.model-cache-key.outputs.key }}

      - name: Run exact-repeat determinism test
        if: steps.check-changes.outputs.changed == 'true'
        run: uv run pytest tests/benchmark/test_exact_repeat_executor.py -v

  exact-repeat-model-preflight:
    # Issue #6189: prove the exact-repeat native-PPO path runs offline. The
    # required model assets are staged (checksum-verified) in a SETUP step and
    # cached via actions/cache keyed on their registry-pinned SHA-256, so the
    # timed test never downloads a model inside its loop. The test itself
    # monkeypatches the downloader to fail-closed if any in-loop fetch is
    # attempted.
    needs: dispatch-ownership
    if: needs.dispatch-ownership.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PPO_ALGO_CONFIG: configs/baselines/ppo_issue_791_eval_aligned_large_capacity_cpu.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-ci-python

      - name: Derive model-cache key from registry-pinned digests
        id: model-cache-key
        run: |
          KEY=$(uv run python scripts/dev/model_cache_key.py --config "${PPO_ALGO_CONFIG}" --machine)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Restore model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/model_cache
          key: model-cache-exact-repeat-ppo-${{ steps.model-cache-key.outputs.key }}

      - name: Preflight required model assets (before the timed test)
        run: uv run python scripts/models/preflight_models.py --config "${PPO_ALGO_CONFIG}"

      - name: Run exact-repeat native-PPO determinism offline
        run: |
          uv run pytest -m slow -p no:cacheprovider \
            tests/benchmark/test_exact_repeat_executor.py::test_native_ppo_runs_offline_after_model_preflight \
            -q

  ci:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'ci-draft' || 'ci' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - dispatch-ownership
      - fast-feedback
      - browser-witnesses
      - changed-coverage-gate
      - coverage-gate
      - compat-matrix
      - fast-pysf-compat
      - smoke-artifacts
      - scenario-validation
      - xdist-scratch-isolation
      - wheel-smoke-install
      - examples-smoke
      - notebooks-smoke
      - determinism-gate
      - exact-repeat-model-preflight
    if: always()
    steps:
      - name: Checkout source for aggregate CI checks and duration-cache update
        id: checkout_ci_source
        if: >-
          ${{ always() && (needs.dispatch-ownership.result != 'success' ||
          needs.dispatch-ownership.outputs.run_full_ci == 'true') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check split job results
        if: >-
          ${{ always() && steps.checkout_ci_source.outcome == 'success' &&
          (needs.dispatch-ownership.result != 'success' ||
          needs.dispatch-ownership.outputs.run_full_ci == 'true') }}
        env:
          BROWSER_WITNESSES_RESULT: ${{ needs.browser-witnesses.result }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_LANE_OUTPUTS: ${{ toJSON(needs.dispatch-ownership.outputs) }}
        run: |
          test "$BROWSER_WITNESSES_RESULT" = success || test "$BROWSER_WITNESSES_RESULT" = cancelled
          python scripts/dev/check_ci_needs.py \
            --event-name "${{ github.event_name }}" \
            --treat-cancelled-as-superseded \
            --lane-outputs "$CI_LANE_OUTPUTS" \
            --results "$CI_NEEDS_JSON"

      - name: Record observed exact-head verdict
        if: >-
          ${{ always() && needs.dispatch-ownership.result == 'success' &&
          needs.dispatch-ownership.outputs.run_full_ci == 'false' &&
          github.event_name == 'workflow_dispatch' }}
        run: echo "The dispatch gate observed a decisive exact-head CI run; no duplicate matrix launched."

      - name: Record draft feedback result
        if: >-
          ${{ always() && needs.dispatch-ownership.result == 'success' &&
          needs.dispatch-ownership.outputs.run_full_ci == 'false' &&
          github.event_name == 'pull_request' }}
        run: echo "Draft lint and small helper tests passed; full CI starts on ready_for_review."

      - name: Download test-duration shards
        if: ${{ always() && needs.fast-feedback.result != 'skipped' && steps.checkout_ci_source.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pytest-durations-*
          path: .duration-artifacts

      # Duration hints survive failed/cancelled siblings; the CI verdict above
      # remains mandatory. Empty, malformed and overlapping artifacts cannot save.
      - name: Merge test durations
        id: merge-test-durations
        if: ${{ always() && needs.fast-feedback.result != 'skipped' && steps.checkout_ci_source.outcome == 'success' }}
        continue-on-error: true
        env:
          FAST_FEEDBACK_RESULT: ${{ needs.fast-feedback.result }}
          DURATION_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DURATION_CACHE_KEY: test-durations-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/dev/merge_test_durations.py \
            --artifact-dir .duration-artifacts --output .test_durations \
            --allow-partial --shard-count 6 --metadata-output .pytest_cache/test_durations_metadata.json

      - name: Save merged test durations
        if: ${{ always() && needs.fast-feedback.result != 'skipped' && steps.checkout_ci_source.outcome == 'success' && steps.merge-test-durations.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .test_durations
            .pytest_cache/test_durations_metadata.json
          key: test-durations-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
