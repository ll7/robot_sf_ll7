expected_paper_profile_version: paper-matrix-v1
expected_paper_interpretation_profile: baseline-ready-core

matrix:
  planner_arms: 14
  scenarios: 48
  seeds: 30
  expected_episode_cells: 20160
  horizon_steps: 600
  dt: 0.1

publication:
