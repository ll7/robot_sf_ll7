# Tracked campaign template for future benchmark-data v0.2 releases.
#
# This file deliberately carries publication identity slots instead of a
# concrete release tag or DOI. The release identity resolver overlays those
# values in an ignored, source-bound manifest after the candidate SHA and fresh
# Zenodo coordinates are selected. Keep the scientific contract and all input
# bytes stable when resolving a release.
name: paper_experiment_matrix_v2_h600_s30_benchmark_data
protocol_version: 0.0.8
paper_facing: true
paper_profile_version: paper-matrix-v1
scenario_matrix: configs/scenarios/classic_interactions_francis2023_release_0_0_8_v1.yaml
comparability_mapping: configs/benchmarks/alyassi_comparability_map_v2.yaml
route_clearance_certifications: configs/benchmarks/route_clearance_certifications_v1.yaml

amv_profile:
  name: amv-paper-v1
  contract_version: "1"
  coverage_enforcement: warn
  required_dimensions:
    use_case: [delivery_robot, shared_space_micromobility]
    context: [sidewalk, shared_space]
    speed_regime: [walking_speed, scooter_speed]
    maneuver_type: [overtake, crossing, bottleneck]

seed_policy:
  mode: seed-set
  seed_set: release_eval_0_0_8
  seed_sets_path: configs/benchmarks/seed_sets_0_0_8.yaml

snqi_weights: configs/benchmarks/snqi_weights_camera_ready_v3.json
snqi_baseline: configs/benchmarks/snqi_baseline_camera_ready_v3.json
snqi_contract:
  enabled: true
  enforcement: warn
  rank_alignment_warn_threshold: 0.5
  rank_alignment_fail_threshold: 0.3
  outcome_separation_warn_threshold: 0.05
  outcome_separation_fail_threshold: 0.0
  max_component_dominance_warn_threshold: 0.24
  max_component_dominance_fail_threshold: 0.27
  calibration_seed: 123
  calibration_trials: 6000

workers: 32
# Authored per-scenario budgets replace the fixed horizon (including H650/H700).
scenario_horizons: configs/benchmarks/horizon_schedules/release_0_0_8_authored_v1.yaml
scenario_horizons_sha256: 032bbf8ad354ea9394492659aa50188e2bc40078930975ef30cd3ba77208675e
dt: 0.1
record_forces: true
# D-057: 0.0.8 release rows stay untraced (record_simulation_step_trace defaults
# to false). Diagnostic/illustration traces come from rehearsal 2, a separate
# DEV-seed 1001 run at the freeze commit. No sealed-seed trace run exists.
checkpoint_provenance_enforcement: error
resume: true
# Release execution stops at the first broken arm. Same-ID resume is admitted only
# after an infrastructure interruption with an immutable resume receipt; code,
# config, dependency, or checkpoint defects require a corrected commit and fresh run.
stop_on_failure: true
bootstrap_samples: 300
bootstrap_confidence: 0.95
bootstrap_seed: 123

kinematics_matrix:
  - differential_drive

export_publication_bundle: true
include_videos_in_publication: false
overwrite_publication_bundle: true
repository_url: https://github.com/ll7/robot_sf_ll7
release_tag: "{{release_tag}}"
doi: "{{version_doi}}"
paper_interpretation_profile: baseline-ready-core

planners:
  - key: prediction_planner
    algo: prediction_planner
    planner_group: experimental
    algo_config: configs/algos/prediction_planner_release_v0_0_8.yaml
    benchmark_profile: experimental

  - key: goal
    algo: goal
    planner_group: core
    benchmark_profile: baseline-safe

  - key: social_force
    algo: social_force
    planner_group: core
    # Issues #9724/#9764: resolution-independent planner and wrapped pair kernel.
    algo_config: configs/algos/social_force_release_v0_0_8.yaml
    benchmark_profile: baseline-safe

  - key: orca
    algo: orca
    planner_group: core
    benchmark_profile: baseline-safe
    algo_config: configs/algos/orca_release_v0_0_8.yaml
    socnav_missing_prereq_policy: fail-fast

  - key: ppo
    algo: ppo
    planner_group: experimental
    # CPU inference is the established parallel-matrix profile. GPU-backed
    # model loading in forked workers failed closed on both imech192 and LiCCA.
    algo_config: configs/baselines/ppo_issue_791_eval_aligned_large_capacity_cpu.yaml
    benchmark_profile: experimental
    adapter_impact_eval: true

  - key: socnav_sampling
    algo: socnav_sampling
    planner_group: experimental
    # Issues #9727/#9746: bounded_v2 sampling heuristic (footprint sweep, speed cap).
    algo_config: configs/algos/socnav_sampling_release_v0_0_8.yaml
    benchmark_profile: experimental
    socnav_missing_prereq_policy: fail-fast

  - key: sacadrl
    algo: sacadrl
    planner_group: experimental
    algo_config: configs/algos/socnav_release_v0_0_8.yaml
    benchmark_profile: experimental
    socnav_missing_prereq_policy: fail-fast

  # Issue #9751: replaces 0.0.7 slot `scenario_adaptive_hybrid_orca_v2_bottleneck_yield` (reported as
  # `implementation replaced`). Frozen under the #9748 hybrid v4 decision.
  - key: scenario_adaptive_hybrid_orca_v2_bottleneck_yield_v4
    algo: hybrid_rule_local_planner
    planner_group: experimental
    algo_config: >-
      configs/policy_search/candidates/scenario_adaptive_hybrid_orca_v2_bottleneck_yield_v4_s30_h600_release_0_0_8_frozen.yaml
    benchmark_profile: experimental

  # Issue #9751: replaces 0.0.7 slot `scenario_adaptive_hybrid_orca_v2_collision_guard` (reported as
  # `implementation replaced`). Frozen under the #9748 hybrid v4 decision.
  - key: scenario_adaptive_hybrid_orca_v2_collision_guard_v4
    algo: hybrid_rule_local_planner
    planner_group: experimental
    algo_config: >-
      configs/policy_search/candidates/scenario_adaptive_hybrid_orca_v2_collision_guard_v4_s30_h600_release_0_0_8_frozen.yaml
    benchmark_profile: experimental

  # Issue #9751: replaces 0.0.7 slot `hybrid_rule_v3_fast_progress_static_escape` (reported as
  # `implementation replaced`). Frozen under the #9748 hybrid v4 decision.
  - key: hybrid_rule_v4_fast_progress_static_escape
    algo: hybrid_rule_local_planner
    planner_group: experimental
    algo_config: >-
      configs/policy_search/candidates/hybrid_rule_v4_fast_progress_static_escape_s30_h600_release_0_0_8_frozen.yaml
    benchmark_profile: experimental

  # Issue #9751: replaces 0.0.7 slot `hybrid_rule_v3_fast_progress_static_escape_continuous` (reported as
  # `implementation replaced`). Frozen under the #9748 hybrid v4 decision.
  - key: hybrid_rule_v4_fast_progress_static_escape_continuous
    algo: hybrid_rule_local_planner
    planner_group: experimental
    algo_config: >-
      configs/policy_search/candidates/hybrid_rule_v4_fast_progress_static_escape_continuous_s30_h600_release_0_0_8_frozen.yaml
    benchmark_profile: experimental

  - key: guarded_ppo
    algo: guarded_ppo
    planner_group: experimental
    algo_config: configs/algos/guarded_ppo_release_v0_0_8.yaml
    benchmark_profile: experimental

  - key: predictive_mppi
    algo: predictive_mppi
    planner_group: experimental
    algo_config: configs/algos/predictive_mppi_release_v0_0_8.yaml
    benchmark_profile: experimental

  - key: risk_dwa
    algo: risk_dwa
    planner_group: experimental
    algo_config: configs/algos/risk_dwa_release_v0_0_8.yaml
    benchmark_profile: experimental
