name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "fast-pysf/pyproject.toml"
      - "fast-pysf/uv.lock"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "fast-pysf/pyproject.toml"
      - "fast-pysf/uv.lock"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  # Latest-main-wins (issue #6399): same policy as ci.yml. Cancelling
  # in-progress runs in the per-ref group lets the final aggregate SHA of a
  # merge burst be analyzed without queueing behind superseded runs, while a
  # new pull request push still only cancels its own superseded run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: python

      - name: Perform CodeQL analysis
        id: codeql-analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:python"
          # Upload separately so a transient SARIF endpoint failure can be retried
          # without retrying or masking the analysis itself.
          upload: never

      - name: Upload CodeQL SARIF (attempt 1)
        id: upload-codeql-sarif-attempt-1
        if: steps.codeql-analysis.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:python"
          sarif_file: ${{ steps.codeql-analysis.outputs.sarif-output }}

      - name: Back off before CodeQL SARIF retry
        if: >-
          steps.codeql-analysis.outcome == 'success' &&
          steps.upload-codeql-sarif-attempt-1.outcome == 'failure'
        env:
          CODEQL_SARIF_UPLOAD_BACKOFF_BASE: "15"
          CODEQL_SARIF_UPLOAD_BACKOFF_CAP: "60"
        run: scripts/dev/codeql_sarif_upload_retry.sh wait 2

      - name: Upload CodeQL SARIF (attempt 2)
        id: upload-codeql-sarif-attempt-2
        if: >-
          steps.codeql-analysis.outcome == 'success' &&
          steps.upload-codeql-sarif-attempt-1.outcome == 'failure'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:python"
          sarif_file: ${{ steps.codeql-analysis.outputs.sarif-output }}

      - name: Finalize CodeQL SARIF upload status
        if: always()
        env:
          CODEQL_ANALYSIS_OUTCOME: ${{ steps.codeql-analysis.outcome }}
          CODEQL_SARIF_UPLOAD_ATTEMPT_1_OUTCOME: ${{ steps.upload-codeql-sarif-attempt-1.outcome }}
          CODEQL_SARIF_UPLOAD_ATTEMPT_2_OUTCOME: ${{ steps.upload-codeql-sarif-attempt-2.outcome }}
        run: scripts/dev/codeql_sarif_upload_retry.sh finalize
