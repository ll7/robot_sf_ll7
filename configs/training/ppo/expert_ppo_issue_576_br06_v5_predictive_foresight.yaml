# Canonical run: uv run python scripts/training/train_ppo.py --config configs/training/ppo/expert_ppo_issue_576_br06_v5_predictive_foresight.yaml
# BR-06 v5 PPO retraining with compact predictor-derived foresight features.
base_config: expert_ppo_issue_576_br06_predictive_base.yaml
policy_id: ppo_expert_br06_v5_predictive_foresight
resume_model_id: ppo_expert_br06_v3_15m_all_maps_randomized_20260304T075200
num_envs: 8
worker_mode: subproc
env_overrides:
  predictive_foresight_model_id: predictive_proxy_selected_v2_full
  predictive_foresight_max_agents: 16
  predictive_foresight_horizon_steps: 8
env_factory_kwargs:
  reward_kwargs:
    weights:
      progress: 1.4
      collision: -12.0
      timeout: -4.5
      terminal_bonus: 4.0
  peds_have_obstacle_forces: true
evaluation:
  evaluation_episodes: 30
  step_schedule:
    - until_step: 3000000
      every_steps: 250000
    - until_step: 9000000
      every_steps: 500000
    - every_steps: 1000000
tracking:
  wandb:
    group: issue-576-br06-v5-predictive-foresight
    job_type: expert-ppo-predictive-foresight
    tags:
      - issue-576
      - br-06
      - ppo
      - predictive-foresight
      - route-completion-v3
      - randomized
