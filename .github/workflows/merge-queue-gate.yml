name: Merge Queue Gate

# Required status check for the GitHub native merge queue (issue #6274).
#
# After a maintainer activates this required check, the native merge queue must
# not auto-merge a PR until this gate passes. It enforces the same fail-closed
# preflight as the in-repository `gh-pr-merger` skill:
# non-draft state, current `merge-ready` label, a current exact-head
# `gate-verdict: accepted @ <head_sha>` trailer, and no unresolved actionable
# review threads. It also requires the merge queue's "Only merge non-failing
# pull requests" (`ALLGREEN`) strategy so a passing tail entry cannot carry an
# earlier ungated entry through a grouped merge. The audit record (evaluated
# head/base SHAs, queue strategy, label set, gate-verdict status, staleness
# verdict, CI conclusion, thread resolution) is emitted to the job summary and
# stdout.
#
# To activate fail-closed behavior, add this job's status check
# ("Merge Queue Gate / merge-queue-gate") to the merge queue's required status
# checks and enable "Only merge non-failing pull requests" in the branch
# protection rules for `main`. The source-PR run reports the check context
# advisory; the `merge_group` run enforces it fail-closed. The workflow does not
# locate or control direct merge dispatchers.
# See docs/dev_guide.md ("Merge queue gate") for the exact configuration and
# residual issue #6274 acceptance proof.

on:
  pull_request:
    types: [labeled, reopened, synchronize, unlabeled]
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open PR number to evaluate (advisory; does not gate a merge)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-queue-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-queue-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run merge-queue gate (merge_group)
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/dev/merge_queue_gate.py \
            --from-event "$GITHUB_EVENT_PATH" \
            --repo "${{ github.repository }}" \
            --json

      - name: Report merge-queue gate context (pull_request head, advisory)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          status=0
          python scripts/dev/merge_queue_gate.py \
            --pr "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json || status=$?
          if (( status != 0 )); then
            echo "::notice::PR-head evaluation is advisory; merge_group enforces the gate."
          fi
          exit 0

      - name: Run merge-queue gate (advisory, workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          python scripts/dev/merge_queue_gate.py \
            --pr "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json
