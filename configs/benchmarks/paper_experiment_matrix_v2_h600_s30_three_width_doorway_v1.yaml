# Preregistered 2.2/2.8/3.6 m full-roster doorway width slice.
name: paper_experiment_matrix_v2_h600_s30_three_width_doorway_v1
paper_facing: true
paper_profile_version: paper-matrix-v1
scenario_matrix: configs/scenarios/francis2023_narrow_doorway_three_width_release_0_0_8_v1.yaml
comparability_mapping: configs/benchmarks/alyassi_comparability_map_v2.yaml
route_clearance_certifications: configs/benchmarks/route_clearance_certifications_v1.yaml
amv_profile:
  name: amv-paper-v1
  contract_version: '1'
  coverage_enforcement: warn
  required_dimensions:
    use_case:
    - delivery_robot
    - shared_space_micromobility
    context:
    - sidewalk
    - shared_space
    speed_regime:
    - walking_speed
    - scooter_speed
    maneuver_type:
    - overtake
    - crossing
    - bottleneck
seed_policy:
  mode: seed-set
  seed_set: release_eval_0_0_8
  seed_sets_path: configs/benchmarks/seed_sets_0_0_8.yaml
snqi_weights: configs/benchmarks/snqi_weights_camera_ready_v3.json
snqi_baseline: configs/benchmarks/snqi_baseline_camera_ready_v3.json
snqi_contract:
  enabled: false
  enforcement: warn
  rank_alignment_warn_threshold: 0.5
  rank_alignment_fail_threshold: 0.3
  outcome_separation_warn_threshold: 0.05
  outcome_separation_fail_threshold: 0.0
  max_component_dominance_warn_threshold: 0.24
  max_component_dominance_fail_threshold: 0.27
  calibration_seed: 123
  calibration_trials: 6000
workers: 32
horizon: 600
dt: 0.1
record_forces: true
checkpoint_provenance_enforcement: error
resume: false
stop_on_failure: true
bootstrap_samples: 300
bootstrap_confidence: 0.95
bootstrap_seed: 123
kinematics_matrix:
- differential_drive
export_publication_bundle: false
include_videos_in_publication: false
overwrite_publication_bundle: true
repository_url: https://github.com/ll7/robot_sf_ll7
release_tag: three-width-doorway-0.0.8-v1
doi: diagnostic-only-unpublished
paper_interpretation_profile: doorway-width-slice
planners:
- key: prediction_planner
  algo: prediction_planner
  planner_group: experimental
  algo_config: configs/algos/prediction_planner_camera_ready.yaml
  benchmark_profile: experimental
- key: goal
  algo: goal
  planner_group: core
  benchmark_profile: baseline-safe
- key: social_force
  algo: social_force
  planner_group: core
  algo_config: configs/algos/social_force_resolution_independent_v2_kernel_wrapped_v2.yaml
  benchmark_profile: baseline-safe
- key: orca
  algo: orca
  planner_group: core
  benchmark_profile: baseline-safe
  socnav_missing_prereq_policy: fail-fast
- key: ppo
  algo: ppo
  planner_group: experimental
  algo_config: configs/baselines/ppo_issue_791_eval_aligned_large_capacity_cpu.yaml
  benchmark_profile: experimental
  adapter_impact_eval: true
- key: socnav_sampling
  algo: socnav_sampling
  planner_group: experimental
  algo_config: configs/algos/socnav_sampling_bounded_v2.yaml
  benchmark_profile: experimental
  socnav_missing_prereq_policy: fail-fast
- key: sacadrl
  algo: sacadrl
  planner_group: experimental
  benchmark_profile: experimental
  socnav_missing_prereq_policy: fail-fast
- key: scenario_adaptive_hybrid_orca_v2_bottleneck_yield_v4
  algo: hybrid_rule_local_planner
  planner_group: experimental
  algo_config: configs/policy_search/candidates/scenario_adaptive_hybrid_orca_v2_bottleneck_yield_v4_s30_h600_release_0_0_8_frozen.yaml
  benchmark_profile: experimental
- key: scenario_adaptive_hybrid_orca_v2_collision_guard_v4
  algo: hybrid_rule_local_planner
  planner_group: experimental
  algo_config: configs/policy_search/candidates/scenario_adaptive_hybrid_orca_v2_collision_guard_v4_s30_h600_release_0_0_8_frozen.yaml
  benchmark_profile: experimental
- key: hybrid_rule_v4_fast_progress_static_escape
  algo: hybrid_rule_local_planner
  planner_group: experimental
  algo_config: configs/policy_search/candidates/hybrid_rule_v4_fast_progress_static_escape_s30_h600_release_0_0_8_frozen.yaml
  benchmark_profile: experimental
- key: hybrid_rule_v4_fast_progress_static_escape_continuous
  algo: hybrid_rule_local_planner
  planner_group: experimental
  algo_config: configs/policy_search/candidates/hybrid_rule_v4_fast_progress_static_escape_continuous_s30_h600_release_0_0_8_frozen.yaml
  benchmark_profile: experimental
- key: guarded_ppo
  algo: guarded_ppo
  planner_group: experimental
  algo_config: configs/algos/guarded_ppo_camera_ready_cpu.yaml
  benchmark_profile: experimental
- key: predictive_mppi
  algo: predictive_mppi
  planner_group: experimental
  algo_config: configs/algos/predictive_mppi_camera_ready.yaml
  benchmark_profile: experimental
- key: risk_dwa
  algo: risk_dwa
  planner_group: experimental
  algo_config: configs/algos/risk_dwa_camera_ready.yaml
  benchmark_profile: experimental
