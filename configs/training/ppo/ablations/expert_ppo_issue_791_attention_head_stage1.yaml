# Stage-1 issue-791 attention head ablation.
# Stacks on the asymmetric critic config: adds a masked multi-head self-attention
# head over pedestrian slots in the actor feature extractor.
base_config: expert_ppo_issue_791_stage1_base.yaml
policy_id: ppo_expert_issue_791_attention_head_stage1
scenario_config: ../../../scenarios/classic_interactions_francis2023.yaml
num_envs: 2
total_timesteps: 8192
feature_extractor_kwargs:
  use_pedestrian_attention: true
  attn_d_model: 64
  attn_num_heads: 4
  attn_output_dim: 64
env_factory_kwargs:
  asymmetric_critic: true
