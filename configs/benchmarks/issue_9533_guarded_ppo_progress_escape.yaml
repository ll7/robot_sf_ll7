# Matched, diagnostic-only evaluation for issue #9533.
# Three arms use the same BR-06 v3 checkpoint, classic/Francis suite, and
# paper_eval_s30 seeds: raw PPO, canonical guard, and guard with progress escape.
# Both guarded arms retain per-step shield evaluations and simulation traces.
name: issue_9533_guarded_ppo_progress_escape_v1
paper_facing: false
paper_profile_version: paper-matrix-v1
scenario_matrix: configs/scenarios/classic_interactions_francis2023.yaml
comparability_mapping: configs/benchmarks/alyassi_comparability_map_v1.yaml
route_clearance_certifications: configs/benchmarks/route_clearance_certifications_v1.yaml

seed_policy:
  mode: seed-set
  seed_set: paper_eval_s30
  seed_sets_path: configs/benchmarks/seed_sets_v1.yaml

workers: 20
horizon: 600
dt: 0.1
record_forces: false
record_planner_decision_trace: true
record_simulation_step_trace: true
checkpoint_provenance_enforcement: error
resume: false
stop_on_failure: false
bootstrap_samples: 1000
bootstrap_confidence: 0.95
bootstrap_seed: 123
kinematics_matrix:
  - differential_drive
export_publication_bundle: false
include_videos_in_publication: false
overwrite_publication_bundle: false
paper_interpretation_profile: diagnostic-only

planners:
  - key: ppo_br06_matched_guard_off
    algo: ppo
    planner_group: experimental
    algo_config: configs/algos/guarded_ppo_camera_ready.yaml
    benchmark_profile: experimental

  - key: guarded_ppo_baseline
    algo: guarded_ppo
    planner_group: experimental
    algo_config: configs/algos/guarded_ppo_camera_ready.yaml
    benchmark_profile: experimental

  - key: guarded_ppo_progress_escape
    algo: guarded_ppo
    planner_group: experimental
    algo_config: configs/algos/guarded_ppo_issue_9533_progress_escape.yaml
    benchmark_profile: experimental
