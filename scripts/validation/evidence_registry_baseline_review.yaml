  - path: docs/context/evidence/issue_5948_doorway_provenance_2026-07-17/run_summary_reconstruction.yaml
    codes: [hash_without_artifact_path]
    disposition: baseline
    reason: >-
      Issue #5948 run-summary reconstruction carries a checksum without an adjacent artifact path.
      This is the legacy provenance gap identified by Issue #5972; repairing the external artifact
      binding is outside this baseline reconciliation, so the finding is explicitly dispositioned
      as baseline under the existing strict-CI policy.
  - path: docs/context/evidence/issue_6412_real_reexport_package/evidence_export.json
    codes: [artifact_hash_mismatch, uncommitted_artifact_missing_location]
    disposition: baseline
    reason: >-
      Compact export of the issue #6412 visualization-only re-export package
      (schema issue_6412_compact_evidence.v1, human_evidence_owner_review pending). Its declared
      artifact paths are bare package-relative paths, which the generic linter resolves
      repo-root-relative: README.md binds to the repository-root README (hash mismatch), and the
      eleven remaining declarations (exclusions/*.json, expected_outcomes.json,
      figure_artifacts.json, figure_qa.json, mapping_receipt.json, package_complete.json,
      package_manifest.json, package_report.json, resolver_summary.json, source_pointer.json) do
      not bind, although every one is a tracked sibling file whose bytes match the declared
      SHA-256. Binding requires schema-aware path resolution or explicit location markers, which
      is #6412 owner-review provenance backfill rather than a safe rewrite inside a CI unbreak
      repair.
  - path: docs/context/evidence/issue_6412_real_reexport_package/figure_artifacts.json
    codes: [hash_without_artifact_path]
    disposition: baseline
    reason: >-
      Records sha256 for two figures' PDF and PNG outputs (four findings) that are deliberately
      not committed: the package is visualization-only and declares
      raw_and_normalized_traces_in_git false. Same hash_without_artifact_path pattern as the
      legacy uncommitted/external artifact debt; committing or regenerating the figure artifacts
      under bound paths is #6412 owner-review backfill.
  - path: docs/context/evidence/issue_6412_real_reexport_package/package_report.json
    codes: [hash_without_artifact_path]
    disposition: baseline
    reason: >-
      The figure_qa/sha256 and resolver_summary/sha256 entries record checksums of the tracked
      sibling files figure_qa.json and resolver_summary.json (bytes verified to match) but carry
      no adjacent artifact-path key under the linter's meaning. Adding a binding path field would
      edit a package schema whose human owner review is still pending, so the findings stay
      explicitly baselined until the #6412 owner-review backfill.
  - path: docs/context/evidence/issue_7322_ch7_evidence_package_v2/manifest.json
    codes: [hash_without_artifact_path]
    disposition: baseline
    reason: >-
      The v2 manifest binds the tracked v2 portfolio config by canonical path and SHA-256, but the
      generic evidence linter deliberately does not treat `configs/` paths as artifact bindings.
      The package schema is versioned and its generated bytes are deterministic; changing the
      schema solely for this generic heuristic would weaken the frozen package contract. The
      custody note records the exact config digest and retrieval pointer, so this single reviewed
      linter finding is baselined as provenance bookkeeping, not benchmark evidence.
  - path: docs/context/evidence/issue_7322_ch7_evidence_package_v2/review/source_verification.json
    codes: [hash_without_artifact_path]
    disposition: baseline
    reason: >-
      The source-verification view records the frozen v1 portfolio config digest and explicit
      source path, but the generic evidence linter intentionally excludes `configs/` paths from
      artifact resolution. The source package and its member hashes are independently verified by
      the v2 builder and the custody note; retain the exact generated view and baseline this
      reviewed non-claim finding rather than mutating the package schema.
