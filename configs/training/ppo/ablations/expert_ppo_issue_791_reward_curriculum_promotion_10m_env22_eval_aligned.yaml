# Issue-791 wave-4 candidate A: scenario-aligned reward-curriculum 10M promotion run.
#
# Motivation
# ----------
# After the 11566/11610 plateau confirmation at success=0.586 on a rollout success of ~0.75,
# the dominant ceiling is a ~0.30 train/eval generalization gap. The eval set
# `ppo_full_maintained_eval_v1.yaml` is a superset of the training set (it includes the
# atomic navigation archetypes from issue_596 that the training distribution never samples).
# This config trains on the exact eval-aligned scenario set so the atomic archetypes are
# in-distribution during training.
#
# Everything else matches the 11566 recipe so the comparison is one-factor.
base_config: expert_ppo_issue_791_reward_curriculum_promotion_10m_env22_base.yaml
policy_id: ppo_expert_issue_791_reward_curriculum_promotion_10m_env22_eval_aligned
scenario_config: ../../../scenarios/sets/ppo_full_maintained_eval_v1.yaml
num_envs: 22
total_timesteps: 10000000
scenario_sampling:
  strategy: random
  profile_strategy: cycle
evaluation:
  step_schedule:
    - every_steps: 524288
tracking:
  wandb:
    job_type: expert-ppo-10m-promotion-env22-eval-aligned
    tags:
      - issue-791
      - reward-curriculum
      - ppo
      - promotion-10m-env22
      - eval-aligned
      - wave-4
