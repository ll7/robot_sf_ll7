# Issue 4014: shared base for the issue_4014 PPO smoke config family.
#
# Variant configs (issue_4014_ppo_*.yaml) inherit these shared settings via
# `base_config: issue_4014_ppo_smoke_base.yaml` and override only their
# per-run settings: policy_id, feature_extractor/kwargs, observation_mode,
# and matched-only num_envs/worker_mode/tracking.
#
# The base holds only values that are byte-identical across every variant, so
# each variant still resolves to exactly its pre-inheritance effective values.
scenario_config: ../../scenarios/sets/classic_cross_trap_subset.yaml
total_timesteps: 2048
seeds:
  - 4014
randomize_seeds: false
env_factory_kwargs:
  reward_name: route_completion_v2
convergence:
  success_rate: 0.8
  collision_rate: 0.1
  plateau_window: 512
evaluation:
  evaluation_episodes: 3
  randomize_seeds: false
  step_schedule:
    - every_steps: 1024
ppo_hyperparams:
  learning_rate: 0.0001
  n_steps: 128
  batch_size: 64
  n_epochs: 2
  gamma: 0.99
  gae_lambda: 0.95
