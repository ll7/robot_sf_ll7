# Shared base for the issue-791 reward-curriculum 10M resume-promotion pair.
# The strongest-checkpoint resume source and each variant's launch metadata remain
# explicit in the variant files. The exploration candidate overrides only the
# three PPO update-size/exploration gates that distinguish it from the baseline.
# Inherits common invariant settings from expert_ppo_issue_791_promotion_shared_base.yaml.
# Launch a variant file, not this base config.
base_config: expert_ppo_issue_791_promotion_shared_base.yaml
env_overrides:
  predictive_foresight_device: cuda
env_factory_kwargs:
  reward_curriculum:
    stages:
      - until_episodes: 100
        reward_kwargs:
          weights:
            progress: 1.1
            collision: -15.0
            timeout: -6.5
            terminal_bonus: 20.0
      - reward_kwargs:
          weights:
            progress: 1.1
            living: -0.015
            collision: -15.0
            near_miss: -1.5
            ttc_risk: -1.2
            comfort: -0.5
            smoothness: -0.18
            timeout: -6.5
            stagnation: -0.8
            terminal_bonus: 20.0
tracking:
  wandb:
    enabled: true
    project: robot_sf
    group: issue-791-reward-curriculum
